<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-1 酸鹼通性與命名 · 核心通關檢核</title>
    <meta name="description" content="選修化學三：酸鹼通性與命名核心連連看通關檢核與章節解鎖">
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
            background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }

        #app {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 1.2rem 1rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-container-full {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 標頭情境框 (公版標準格式) */
        .quiz-scenario-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1.1rem 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .problem-badge {
            font-size: 0.85rem;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid var(--accent-purple);
            background: rgba(167,139,250,0.15);
            color: var(--accent-purple);
            letter-spacing: 0.05em;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        /* 測驗卡片外框 */
        .quiz-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 連連看互動區 */
        .match-game-wrapper {
            position: relative;
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            touch-action: none;
        }

        .match-game-cols {
            display: flex;
            justify-content: space-between;
            position: relative;
            gap: 28px;
            z-index: 2;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 45%;
        }

        .match-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            touch-action: none;
            font-size: 0.98rem;
            color: #f1f5f9;
            min-height: 48px;
        }

        .match-item:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        .match-item.selected {
            border-color: #fbbf24 !important;
            background: rgba(251, 191, 36, 0.18) !important;
            box-shadow: 0 0 14px rgba(251, 191, 36, 0.3);
        }

        .match-item.connected {
            border-color: #34d399 !important;
            background: rgba(52, 211, 153, 0.12) !important;
        }

        .match-item.match-wrong {
            border-color: #f87171 !important;
            background: rgba(248, 113, 113, 0.15) !important;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .match-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #94a3b8;
            border: 2px solid rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .match-item:hover .match-dot,
        .match-item.selected .match-dot {
            background: #fbbf24;
            transform: scale(1.2);
            border-color: #ffffff;
        }

        .match-item.connected .match-dot {
            background: #34d399;
            border-color: #ffffff;
        }

        #match-svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 底部操作與反饋欄 */
        .quiz-action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0.5rem 0;
        }

        .quiz-feedback-msg {
            font-size: 0.95rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .btn-action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit-exam {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0.65rem 1.6rem;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(6, 182, 212, 0.35);
        }

        .btn-submit-exam:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-submit-exam:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f1f5f9;
            border-radius: 10px;
            padding: 0.65rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        /* 通關解鎖橫幅 */
        #section-complete-banner {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 182, 212, 0.15));
            border: 2px solid rgba(52, 211, 153, 0.5);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="quiz-container-full">
        <!-- 標頭情境框 -->
        <div class="quiz-scenario-box">
            <span class="problem-badge">🏆 單元 8-1 · 核心通關檢核</span>
            <h2 style="font-size:1.35rem; color:#f8fafc; font-weight:800; margin:0.2rem 0 0.4rem;">
                🎮 綜合練習：化學命名配對挑戰
            </h2>
            <p style="color:#94a3b8; font-size:0.95rem; line-height:1.5;">
                請將左側的<strong>化學式</strong>與右側的<strong>標準中文名稱</strong>進行配對連線（點選左側再點選右側，或直接拖曳連線）。完成全部 8 組配對後點擊「確定作答」提交檢核並解鎖下一單元！
            </p>
        </div>

        <!-- 測驗連連看主卡片 -->
        <div class="quiz-card" id="quiz-main-card">
            <div class="match-game-wrapper" id="match-wrapper">
                <svg id="match-svg-canvas"></svg>
                <div class="match-game-cols">
                    <div class="match-col" id="col-left"></div>
                    <div class="match-col" id="col-right"></div>
                </div>
            </div>

            <!-- 操作與反饋欄 -->
            <div class="quiz-action-bar">
                <div class="quiz-feedback-msg" id="quiz-feedback-msg">
                    <span>💡 請點選左側項目，再點選右側項目完成連線（已連線：<span id="connected-count" style="color:var(--accent-yellow);font-weight:bold;">0</span> / 8 組）。</span>
                </div>
                <div class="btn-action-group">
                    <button type="button" class="btn-secondary" id="btn-reset-match" onclick="resetConnections()">重連 🔄</button>
                    <button type="button" class="btn-secondary" id="btn-new-pool" onclick="newQuestionPool()">換一批 🎲</button>
                    <button type="button" class="btn-submit-exam" id="btn-submit-exam" onclick="checkAnswers()">確定作答 🚀</button>
                </div>
            </div>
        </div>

        <!-- 解鎖成功橫幅 -->
        <div id="section-complete-banner">
            <div style="font-size:3.5rem; margin-bottom:0.5rem;">🎉</div>
            <h2 style="color:#34d399; font-size:1.8rem; font-weight:800; margin-bottom:0.4rem;">
                恭喜！單元 8-1 核心檢核全對通過！
            </h2>
            <p style="color:#e2e8f0; font-size:1.05rem; margin-bottom:1rem;">
                您已精通無氧酸、含氧酸、鹼、正鹽、酸式鹽與含磷酸之化學命名法則！下一單元已為您自動解鎖 🔓
            </p>
            <div style="display:flex; gap:10px;">
                <button type="button" class="btn-submit-exam" onclick="newQuestionPool()" style="padding:0.55rem 1.4rem;">再挑戰一組 🎲</button>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    // 題庫池（精選 40 組涵蓋酸、鹼、鹽代表物）
    const GAME_POOL = [
        // 無氧酸
        { formula: '$\\mathrm{HCl}_{(aq)}$', name: '氫氯酸（鹽酸）' },
        { formula: '$\\mathrm{HF}_{(aq)}$', name: '氫氟酸' },
        { formula: '$\\mathrm{H_2S}_{(aq)}$', name: '氫硫酸' },
        { formula: '$\\mathrm{HCN}_{(aq)}$', name: '氫氰酸' },
        { formula: '$\\mathrm{HBr}_{(aq)}$', name: '氫溴酸' },
        { formula: '$\\mathrm{HI}_{(aq)}$', name: '氫碘酸' },
        // 含氧酸
        { formula: '$\\mathrm{H_2SO_4}$', name: '硫酸' },
        { formula: '$\\mathrm{HNO_3}$', name: '硝酸' },
        { formula: '$\\mathrm{H_3PO_4}$', name: '磷酸' },
        { formula: '$\\mathrm{H_2CO_3}$', name: '碳酸' },
        { formula: '$\\mathrm{HClO_4}$', name: '過氯酸' },
        { formula: '$\\mathrm{HClO_3}$', name: '氯酸' },
        { formula: '$\\mathrm{HClO_2}$', name: '亞氯酸' },
        { formula: '$\\mathrm{HClO}$', name: '次氯酸' },
        { formula: '$\\mathrm{H_3PO_3}$', name: '亞磷酸' },
        { formula: '$\\mathrm{H_3PO_2}$', name: '次磷酸' },
        { formula: '$\\mathrm{CH_3COOH}$', name: '醋酸（乙酸）' },
        { formula: '$\\mathrm{H_2SO_3}$', name: '亞硫酸' },
        // 鹼
        { formula: '$\\mathrm{NaOH}$', name: '氫氧化鈉' },
        { formula: '$\\mathrm{Ca(OH)_2}$', name: '氫氧化鈣' },
        { formula: '$\\mathrm{Al(OH)_3}$', name: '氫氧化鋁' },
        { formula: '$\\mathrm{Fe(OH)_3}$', name: '氫氧化鐵' },
        { formula: '$\\mathrm{Fe(OH)_2}$', name: '氫氧化亞鐵' },
        { formula: '$\\mathrm{KOH}$', name: '氫氧化鉀' },
        { formula: '$\\mathrm{Ba(OH)_2}$', name: '氫氧化鋇' },
        { formula: '$\\mathrm{Mg(OH)_2}$', name: '氫氧化鎂' },
        // 正鹽
        { formula: '$\\mathrm{NaCl}$', name: '氯化鈉' },
        { formula: '$\\mathrm{K_2S}$', name: '硫化鉀' },
        { formula: '$\\mathrm{AlF_3}$', name: '氟化鋁' },
        { formula: '$\\mathrm{CuCl_2}$', name: '氯化銅' },
        { formula: '$\\mathrm{KNO_3}$', name: '硝酸鉀' },
        { formula: '$\\mathrm{CaSO_4}$', name: '硫酸鈣' },
        { formula: '$\\mathrm{Na_3PO_4}$', name: '磷酸鈉' },
        { formula: '$\\mathrm{BaCO_3}$', name: '碳酸鋇' },
        { formula: '$\\mathrm{AgNO_3}$', name: '硝酸銀' },
        { formula: '$\\mathrm{Na_2CO_3}$', name: '碳酸鈉' },
        // 酸式鹽
        { formula: '$\\mathrm{NaHCO_3}$', name: '碳酸氫鈉' },
        { formula: '$\\mathrm{NaHSO_4}$', name: '硫酸氫鈉' },
        { formula: '$\\mathrm{NaH_2PO_4}$', name: '磷酸二氫鈉' },
        { formula: '$\\mathrm{Na_2HPO_4}$', name: '磷酸一氫鈉' },
        // 特殊鹽與其他鹽
        { formula: '$\\mathrm{Na_2HPO_3}$', name: '亞磷酸鈉（正鹽）' },
        { formula: '$\\mathrm{NaH_2PO_2}$', name: '次磷酸鈉（正鹽）' },
        { formula: '$\\mathrm{Cu_2(OH)_2CO_3}$', name: '鹼式碳酸銅' },
        { formula: '$\\mathrm{Bi(OH)_2NO_3}$', name: '鹼式硝酸鉍' },
        { formula: '$\\mathrm{KAl(SO_4)_2 \\cdot 12H_2O}$', name: '明礬（硫酸鋁鉀）' },
        { formula: '$\\mathrm{K_4[Fe(CN)_6]}$', name: '亞鐵氰化鉀（黃血鹽）' }
    ];

    const GAME_COUNT = 8;
    let currentQuestions = [];
    let userConnections = []; // { leftIdx, rightIdx }
    let selectedLeft = null;
    let selectedRight = null;
    let isPassed = false;

    const colLeft = document.getElementById('col-left');
    const colRight = document.getElementById('col-right');
    const svgCanvas = document.getElementById('match-svg-canvas');
    const feedbackMsg = document.getElementById('quiz-feedback-msg');
    const connectedCountEl = document.getElementById('connected-count');
    const completeBanner = document.getElementById('section-complete-banner');

    window.newQuestionPool = function() {
        isPassed = false;
        userConnections = [];
        selectedLeft = null;
        selectedRight = null;
        completeBanner.style.display = 'none';

        // 隨機抽 8 題
        const shuffled = [...GAME_POOL].sort(() => Math.random() - 0.5);
        currentQuestions = shuffled.slice(0, GAME_COUNT).map((item, i) => ({
            id: i,
            formula: item.formula,
            name: item.name
        }));

        const leftItems = [...currentQuestions];
        const rightItems = [...currentQuestions].sort(() => Math.random() - 0.5);

        colLeft.innerHTML = '';
        colRight.innerHTML = '';

        leftItems.forEach(item => {
            const el = document.createElement('div');
            el.className = 'match-item';
            el.dataset.id = item.id;
            el.innerHTML = `<span>${item.formula}</span><div class="match-dot"></div>`;
            el.onclick = () => onSelectLeft(el, item.id);
            colLeft.appendChild(el);
        });

        rightItems.forEach(item => {
            const el = document.createElement('div');
            el.className = 'match-item';
            el.dataset.id = item.id;
            el.innerHTML = `<div class="match-dot"></div><span>${item.name}</span>`;
            el.onclick = () => onSelectRight(el, item.id);
            colRight.appendChild(el);
        });

        updateConnections();
        if (window.MathJax) {
            window.MathJax.typesetPromise([colLeft]);
        }
        reportIframeHeight();
    };

    function onSelectLeft(el, id) {
        if (isPassed) return;
        if (selectedLeft === id) {
            selectedLeft = null;
            el.classList.remove('selected');
            return;
        }

        colLeft.querySelectorAll('.match-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedLeft = id;

        if (selectedRight !== null) {
            connectPair(selectedLeft, selectedRight);
        }
    }

    function onSelectRight(el, id) {
        if (isPassed) return;
        if (selectedRight === id) {
            selectedRight = null;
            el.classList.remove('selected');
            return;
        }

        colRight.querySelectorAll('.match-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedRight = id;

        if (selectedLeft !== null) {
            connectPair(selectedLeft, selectedRight);
        }
    }

    function connectPair(leftId, rightId) {
        // 移除左邊原本有的連線
        userConnections = userConnections.filter(c => c.leftId !== leftId && c.rightId !== rightId);
        userConnections.push({ leftId, rightId });

        selectedLeft = null;
        selectedRight = null;
        colLeft.querySelectorAll('.match-item').forEach(i => i.classList.remove('selected'));
        colRight.querySelectorAll('.match-item').forEach(i => i.classList.remove('selected'));

        updateConnections();
    }

    window.resetConnections = function() {
        if (isPassed) return;
        userConnections = [];
        selectedLeft = null;
        selectedRight = null;
        colLeft.querySelectorAll('.match-item').forEach(i => {
            i.classList.remove('selected', 'connected', 'match-wrong');
        });
        colRight.querySelectorAll('.match-item').forEach(i => {
            i.classList.remove('selected', 'connected', 'match-wrong');
        });
        updateConnections();
        feedbackMsg.innerHTML = '<span>💡 已清空連線，請重新點選兩端項目進行配對。</span>';
    };

    function updateConnections() {
        svgCanvas.innerHTML = '';
        connectedCountEl.textContent = userConnections.length;

        colLeft.querySelectorAll('.match-item').forEach(el => el.classList.remove('connected'));
        colRight.querySelectorAll('.match-item').forEach(el => el.classList.remove('connected'));

        const wrapperRect = document.getElementById('match-wrapper').getBoundingClientRect();

        userConnections.forEach(conn => {
            const leftEl = colLeft.querySelector(`.match-item[data-id="${conn.leftId}"]`);
            const rightEl = colRight.querySelector(`.match-item[data-id="${conn.rightId}"]`);

            if (leftEl && rightEl) {
                leftEl.classList.add('connected');
                rightEl.classList.add('connected');

                const leftDot = leftEl.querySelector('.match-dot').getBoundingClientRect();
                const rightDot = rightEl.querySelector('.match-dot').getBoundingClientRect();

                const x1 = leftDot.left + leftDot.width / 2 - wrapperRect.left;
                const y1 = leftDot.top + leftDot.height / 2 - wrapperRect.top;
                const x2 = rightDot.left + rightDot.width / 2 - wrapperRect.left;
                const y2 = rightDot.top + rightDot.height / 2 - wrapperRect.top;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#38bdf8');
                line.setAttribute('stroke-width', '3');
                line.setAttribute('stroke-linecap', 'round');
                svgCanvas.appendChild(line);
            }
        });
    }

    window.addEventListener('resize', updateConnections);

    window.checkAnswers = function() {
        if (isPassed) return;

        if (userConnections.length < GAME_COUNT) {
            feedbackMsg.innerHTML = '<span style="color:#f87171;">⚠️ 尚有項目未完成配對，請完成所有 8 組連線後再提交！</span>';
            return;
        }

        let wrongCount = 0;
        userConnections.forEach(conn => {
            const isCorrect = (conn.leftId === conn.rightId);
            const leftEl = colLeft.querySelector(`.match-item[data-id="${conn.leftId}"]`);
            const rightEl = colRight.querySelector(`.match-item[data-id="${conn.rightId}"]`);

            if (!isCorrect) {
                wrongCount++;
                if (leftEl) leftEl.classList.add('match-wrong');
                if (rightEl) rightEl.classList.add('match-wrong');
            } else {
                if (leftEl) leftEl.classList.remove('match-wrong');
                if (rightEl) rightEl.classList.remove('match-wrong');
            }
        });

        if (wrongCount === 0) {
            isPassed = true;
            feedbackMsg.innerHTML = '<span style="color:#34d399;font-weight:bold;">🎉 太厲害了！全部配對正確！章節已解鎖！</span>';
            completeBanner.style.display = 'flex';
            notifySectionComplete();
            reportIframeHeight();
        } else {
            feedbackMsg.innerHTML = `<span style="color:#f87171;">❌ 共有 ${wrongCount} 組配對錯誤（已用紅色標出），請點「重連」再次挑戰！</span>`;
        }
    };

    // 通關通知外層母網頁 SPA 並寫入 localStorage
    function notifySectionComplete() {
        const payload = {
            type: 'SECTION_COMPLETE',
            sectionId: 'ch8_s1',
            sectionFolder: '01_酸鹼的通性與命名',
            chapterId: 'ch8',
            title: '酸鹼通性與命名',
            unlockSections: ['ch8_s2']
        };

        if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, '*');
        }
        if (window.top && window.top !== window && window.top !== window.parent) {
            window.top.postMessage(payload, '*');
        }

        // 同步寫入 localStorage
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('chem_progress_')) {
                    const data = JSON.parse(localStorage.getItem(k));
                    if (data && Array.isArray(data.unlockedSections)) {
                        if (!data.completedSections.includes('ch8_s1')) data.completedSections.push('ch8_s1');
                        if (!data.unlockedSections.includes('ch8_s2')) data.unlockedSections.push('ch8_s2');
                        localStorage.setItem(k, JSON.stringify(data));
                    }
                }
            }
        } catch (e) {}
    }

    function reportIframeHeight() {
        setTimeout(() => {
            const h = document.documentElement.scrollHeight || document.body.scrollHeight;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'RESIZE_IFRAME', height: h }, '*');
            }
        }, 200);
    }

    newQuestionPool();
})();
</script>
