<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-4 酸鹼中和與滴定 · 滴定線上模擬實驗室 | 互動教學</title>
    <style>
        :root {
            --bg-dark: #0f172a; --text-main: #f8fafc;
            --accent-blue: #38bdf8; --accent-green: #34d399; --accent-red: #f87171;
            --accent-yellow: #fbbf24; --accent-purple: #a78bfa; --accent-cyan: #22d3ee;
            --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #presentation-area { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container {
            position: absolute;
            top: 1.2vh; left: 1.8vw; right: 1.8vw; bottom: 1.2vh;
        }
        .slide {
            position: absolute; inset: 0; padding: 0.15rem 0.15rem;
            opacity: 1; pointer-events: auto;
            display: flex; flex-direction: column; overflow: hidden; height: 100%;
        }
        h1 {
            color: var(--accent-cyan); font-size: clamp(1.3rem, 1.85vw, 1.75rem);
            margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.6rem;
            border-bottom: 2px solid rgba(34,211,238,0.25); padding-bottom: 0.25rem; flex-shrink: 0;
        }
        h1::before { content: ""; width: 7px; height: 24px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }
        
        .sim-container {
            flex: 1; width: 100%; min-height: 0;
            background: var(--glass); border: 1.5px solid var(--glass-border); border-radius: 14px;
            overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            position: relative; display: flex; flex-direction: column;
        }
        .sim-header {
            background: rgba(15,23,42,0.75); border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0.45rem 1rem; display: flex; align-items: center; justify-content: space-between;
            font-size: 0.88rem; flex-shrink: 0;
        }
        iframe {
            flex: 1; width: 100%; height: 100%; border: none; background: #0f172a;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="presentation-area">
        <div id="slides-container">
            <div class="slide active">
                <h1>8-4 酸鹼中和與滴定 · 滴定線上模擬實驗室</h1>
                <div class="sim-container">
                    <div class="sim-header">
                        <div style="display: flex; align-items: center; gap: 0.6rem;">
                            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green);"></span>
                            <span style="color: var(--accent-cyan); font-weight: bold;">Titration Blogger 互動滴定模擬儀</span>
                        </div>
                        <span style="color: rgba(255,255,255,0.6); font-size: 0.82rem;">提示：可選酸鹼種類、滴定液速度並觀察燒杯中指示劑變色與 pH 曲線動態繪製</span>
                    </div>
                    <iframe src="titration_blogger.html" title="酸鹼滴定線上模擬器"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
