<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>氧化還原方程式平衡 | 互動教學</title>
<!-- Fonts & MathJax -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Fira+Math&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
/* CSS from ref_index.html */
:root {
    --bg-dark: #0f172a; --text-main: #f8fafc;
    --accent-blue: #38bdf8; --accent-green: #34d399; --accent-red: #f87171;
    --accent-yellow: #fbbf24; --accent-purple: #a78bfa; --accent-cyan: #22d3ee;
    --accent-orange: #fb923c;
    --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.12);
    /* Colors from index_old.html */
    --accent-ox: #ff4d6d;
    --accent-success: #3ef2a0;
    --accent-step2: #facc15;
    --accent-step34: #c084fc;
    --accent-step5: #3ef2a0;
    --text-muted: #94a3b8;
    --glass-bg: rgba(255, 255, 255, 0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body, html {
    width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main);
    font-family: 'Noto Sans TC', sans-serif;
    overflow-x: hidden;
    scroll-behavior: smooth;
    background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
    background-size: 30px 30px;
}
#app { position: relative; width: 100%; min-height: 100vh; overflow-x: hidden; }

/* Start Overlay */
#start-overlay {
    position: fixed; inset: 0; background: var(--bg-dark); z-index: 10000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background-image: radial-gradient(rgba(167,139,250,0.12) 2px, transparent 2px);
    background-size: 60px 60px;
}
.start-badge {
    font-size: 0.92rem; color: var(--accent-purple);
    background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.35);
    padding: 0.3rem 1.1rem; border-radius: 40px; margin-bottom: 1rem; letter-spacing: 0.06em;
}
.start-title {
    font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 900; text-align: center; line-height: 1.15;
    color: var(--accent-cyan); text-shadow: 0 0 40px rgba(34,211,238,0.35);
}
.btn-start {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: #0f172a; border: none;
    padding: 1.1rem 3rem; border-radius: 60px; font-size: 1.35rem; font-weight: 800;
    box-shadow: 0 0 35px rgba(34,211,238,0.5); cursor: pointer; touch-action: manipulation;
    transition: 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.btn-start:hover { transform: scale(1.06); }

/* Top Nav */
#top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9500;
    background: rgba(15,23,42,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 15px; padding: 10px 20px; overflow-x: auto;
    white-space: nowrap; justify-content: center;
}
.nav-link {
    color: var(--accent-cyan); text-decoration: none; font-weight: 700; font-size: 1.05rem;
    padding: 6px 16px; border-radius: 20px; border: 1px solid transparent;
    transition: 0.3s; cursor: pointer;
}
.nav-link:hover { background: rgba(34,211,238,0.15); border-color: rgba(34,211,238,0.4); }
.nav-link.active { background: var(--accent-cyan); color: #0f172a; }

/* Slides Container */
#presentation-area { position: relative; width: 100%; min-height: 100vh; }
#slides-container { position: relative; padding: 70px 2rem 20px 2rem; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
.slide { width: 100%; display: flex; flex-direction: column; align-items: center; }

/* Toolbar & Drawing Layer */
#toolbar {
    position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
    background: rgba(15,23,42,0.9); padding: 12px 6px; border-radius: 30px;
    display: flex; flex-direction: column; gap: 9px; align-items: center; z-index: 9000;
    border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 15px 45px rgba(0,0,0,0.7);
    backdrop-filter: blur(20px); width: 50px;
}
.btn-tool {
    background: transparent; color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.15); width: 34px; height: 34px;
    border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.25s; font-size: 1.2rem;
}
.btn-tool:hover { background: rgba(255,255,255,0.15); color: #fff; }
.btn-tool.active-tool { background: var(--accent-cyan); color: #0f172a; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(34,211,238,0.5); }
#drag-handle { width: 100%; text-align: center; color: rgba(255,255,255,0.4); cursor: grab; font-size: 1.3rem; line-height: 0.5; }
#drawing-layer { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; touch-action: none; }
#drawing-layer.drawing-active { pointer-events: auto; z-index: 120; }

/* Old CSS parts for Equation Workspace */
.hidden { display: none !important; }
sub, sup { font-size: 0.75em; }

.main-header { margin-bottom: 1.5rem; text-align: center; width: 100%; }
.main-header h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--accent-cyan); }
.subtitle { color: var(--text-muted); font-size: 1rem; }

.step-nav-horizontal {
  display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; justify-content: center; width: 100%;
}
.step-btn {
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 50px; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;
  cursor: pointer; transition: all 0.3s ease; color: var(--text-main); font-size: 0.9rem;
}
.step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.step-btn:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
.step-btn.active {
  background: rgba(52, 211, 153, 0.1); border-color: var(--accent-success); box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
}
.step-num {
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.1); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Roboto Mono', monospace;
}
.step-btn.active .step-num { background: var(--accent-success); color: #000; }

.topic-display {
  background: var(--glass-bg); border: 1px solid var(--accent-success); border-radius: 12px;
  padding: 1rem 2rem; margin-bottom: 1rem; font-size: 1.2rem; text-align: center; display: none;
  animation: fadeIn 0.5s ease;
}
.topic-display.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.equation-workspace {
  position: relative; min-height: 250px; display: flex; flex-direction: column; align-items: center;
  padding-top: 40px; width: 100%; overflow-x: auto;
}
.equation-workspace.balancing .slot.filled { border-color: var(--glass-border) !important; box-shadow: none !important; }
.equation-workspace.step5 .coeff { color: var(--accent-step5) !important; }
.equation-workspace.step5 .slot.filled { border-color: var(--glass-border) !important; box-shadow: none !important; background: rgba(255, 255, 255, 0.02) !important; }

.equation-layout { display: flex; flex-direction: column; align-items: center; gap: 3rem; width: max-content; min-width: 100%; padding: 0 2rem; }
.row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; position: relative; }
.slot-group { display: flex; align-items: center; gap: 0.5rem; }

.slot {
  min-width: 160px; padding: 0 10px; min-height: 90px; border: 2px dashed var(--glass-border); border-radius: 12px;
  position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s;
  background: rgba(255, 255, 255, 0.02);
}
.slot:hover:not(.locked) { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.05); }
.slot.locked { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
.slot-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-muted); font-size: 0.85rem; pointer-events: none; width: 100%; text-align: center; }
.slot-content { font-size: 1.5rem; font-weight: 500; z-index: 2; text-align: center; }
.slot.filled .slot-label { display: none; }

.arrow-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin: 0 2rem; }
.mini-slot { position: absolute; bottom: 100%; margin-bottom: -10px; width: 36px; min-height: 24px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; }
.mini-slot .slot-label { font-size: 0.65rem; }
.mini-slot .slot-content { font-size: 0.9rem; }

.slot.ox.filled { border-color: var(--accent-ox); border-style: solid; box-shadow: 0 0 10px rgba(255, 77, 109, 0.1); }
.slot.red.filled { border-color: var(--accent-blue); border-style: solid; box-shadow: 0 0 10px rgba(0, 180, 216, 0.1); }
.slot-cond.filled { border-color: var(--accent-success); border-style: solid; }

.slot-balancer { min-width: 120px; width: auto; opacity: 0; pointer-events: none; }
.slot-balancer.show { border-style: dotted; opacity: 0.6; }
.slot-balancer.filled { opacity: 1; border-style: solid; min-width: 120px; padding: 0 1.5rem; }

.operator { font-size: 2rem; font-weight: 300; color: var(--text-muted); padding: 0 0.5rem; }
.operator.arrow { font-size: 2.5rem; color: var(--text-main); margin: 0; }

.popover {
  position: fixed; background: #1e293b; border: 1px solid var(--glass-border); border-radius: 10px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); z-index: 100000; padding: 8px; min-width: 200px; backdrop-filter: blur(8px);
}
.popover-arrow { position: absolute; width: 10px; height: 10px; background: #1e293b; border-left: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border); transform: rotate(45deg); }
.popover-content { display: flex; flex-direction: column; gap: 4px; }
.pop-item { padding: 10px 14px; border-radius: 6px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
.pop-item:hover { background: rgba(255, 255, 255, 0.1); }
.pop-item .formula { font-family: 'Fira Math', serif; font-size: 1.1rem; }
.pop-item .name { font-size: 0.8rem; color: var(--text-muted); }

.eq-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

.key-atom { display: inline-block; position: relative; border-radius: 4px; }
.ox-hi { color: var(--accent-ox); background: rgba(255, 77, 109, 0.1); }
.red-hi { color: var(--accent-blue); background: rgba(0, 180, 216, 0.1); }
.ox-label { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 0.75rem; font-weight: 700; color: var(--accent-success); opacity: 0; transition: opacity 0.3s; padding-bottom: 2px; pointer-events: none; white-space: nowrap; }
.ox-label.vis { opacity: 1; text-shadow: 0 0 5px rgba(0,0,0,0.8); }
.coeff { display: inline-block; font-weight: 700; color: var(--accent-success); margin-right: 0.4em; opacity: 0; transition: opacity 0.3s; }
.coeff.vis { opacity: 1; }
.coeff.step2 { color: var(--accent-step2); }
.coeff.step34 { color: var(--accent-step34); }

.feedback-area { margin-top: 2rem; width: 100%; max-width: 800px; padding-bottom: 2rem; }
.step-explanation { background: var(--glass-bg); border-radius: 12px; padding: 1.5rem; border-left: 4px solid var(--accent-success); border-right: 4px solid var(--accent-success); line-height: 1.6; }
.step-explanation h3 { margin-bottom: 0.75rem; font-size: 1.1rem; color: var(--accent-success); }
.step-explanation b { color: #fff; }
.hi-red { color: #fb7185; }
.hi-ox { color: #38bdf8; }
.hi-coeff { background: rgba(52, 211, 153, 0.2); color: var(--accent-success); padding: 0 4px; border-radius: 4px; }

/* 半反應法專屬樣式 */
.half-rxn-workspace {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem;
  padding: 2rem; background: rgba(30, 41, 59, 0.5); border-radius: 20px; border: 1px solid var(--glass-border);
}
.hr-table {
  display: grid; grid-template-columns: auto 1fr auto auto auto auto auto 1fr; gap: 0.75rem;
  align-items: center; width: 100%; max-width: 1100px; position: relative;
}
.hr-label-cell { grid-column: 1; font-weight: 700; font-size: 1.1rem; color: var(--text-muted); white-space: nowrap; text-align: right; }
.hr-red .hr-label-cell { color: var(--accent-ox); }
.hr-ox .hr-label-cell { color: var(--accent-blue); }

.hr-slot {
  min-width: 140px; min-height: 50px; border: 1px solid var(--glass-border); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05);
  font-size: 1.2rem; padding: 0 10px; transition: all 0.3s ease;
}
.hr-slot:empty::before { content: ' '; }
.hr-slot.main { border: 2px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); font-weight: 700; }
.hr-arrow-cell { font-size: 2rem; color: var(--text-main); padding: 0 1rem; }
.hr-math-line { grid-column: 1 / span 8; height: 2px; background: var(--text-main); width: 100%; margin: 1rem 0; opacity: 1; display: none; }
.hr-sum-row { grid-column: 1 / span 8; text-align: center; font-size: 1.5rem; opacity: 0; transition: opacity 0.5s; padding: 1.5rem; border-radius: 12px; background: rgba(255, 255, 255, 0.03); }
.hr-operator { font-size: 1.5rem; color: var(--text-muted); font-weight: 300; }
.hr-bracket-container { position: absolute; right: -60px; height: 100%; display: flex; align-items: center; opacity: 0; transition: opacity 0.3s; }
.hr-bracket-svg { height: 100%; width: 30px; stroke: var(--accent-step34); stroke-width: 2; fill: none; }
.hr-mult-text { color: var(--accent-step34); font-weight: 700; font-size: 1.3rem; margin-left: 10px; }
.hr-section-wrapper { display: contents; }
.sum-reactant { color: var(--accent-success); }
.sum-product { color: var(--accent-blue); }
.hr-e { color: #facc15; font-weight: 700; }

.reset-btn {
  background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
  padding: 0.75rem 1.5rem; border-radius: 50px; cursor: pointer; transition: all 0.2s; font-size: 1rem;
}
.reset-btn:hover { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }

@media (max-width: 850px) {
  .equation-layout, .half-rxn-workspace { transform: scale(0.75); transform-origin: top center; gap: 1rem; }
  .slot { min-width: 120px; min-height: 70px; }
}
/* ---- Random Draw Modal ---- */
#random-draw-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); border: 1px solid var(--accent-cyan); box-shadow: 0 0 30px rgba(34, 211, 238, 0.3); border-radius: 20px; padding: 20px; z-index: 10000; backdrop-filter: blur(10px); width: 600px; max-width: 90vw; }
#random-draw-balls { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; justify-content: center; margin: 0 auto 20px auto; width: 100%; max-width: 500px; }
.draw-ball { width: 100%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: clamp(0.75rem, 2.5vw, 1.1rem); color: #fff; position: relative; z-index: 1; transition: all 0.3s; }
.draw-ball.flicker { background: #fff; color: #000; transform: scale(1.35); box-shadow: 0 0 25px #fff, 0 0 15px var(--accent-cyan); border-color: #fff; z-index: 10; }
.draw-ball.drawn { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.3); }
.draw-ball.winner { background: var(--accent-yellow); border-color: var(--accent-yellow); color: #000; transform: scale(1.25); box-shadow: 0 0 25px var(--accent-yellow); z-index: 10; }
#random-draw-controls { display: flex; flex-direction: column; align-items: center; gap: 15px; }
#btn-do-draw { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: #0f172a; border: none; padding: 10px 30px; border-radius: 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
#btn-do-draw:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(34, 211, 238, 0.5); }
#btn-do-draw:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.draw-input-group { display: flex; align-items: center; gap: 10px; color: #fff; }
.draw-input-group input { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--accent-cyan); color: #fff; padding: 5px 10px; border-radius: 5px; width: 60px; text-align: center; font-size: 1rem; }
#btn-close-draw { position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; opacity: 0.7; }
#btn-close-draw:hover { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  
  <div id="start-overlay">
    <div class="start-badge" style="font-size: clamp(1.5rem, 4vw, 2.5rem); background: transparent; border: none; padding: 0; margin-bottom: 1rem;">化學方程式平衡互動教學</div>
    <h1 class="start-title">氧化還原方程式平衡</h1>
    <button class="btn-start" id="btn-start" style="margin-top: 2rem;" type="button">開始練習 ✦</button>
  </div>

  <div id="presentation-area">
    <nav id="top-nav">
      <a class="nav-link active" id="tab-ox" onclick="switchMode('oxNum')">氧化數法平衡</a>
      <a class="nav-link" id="tab-hr" onclick="switchMode('halfRxn')">半反應法平衡</a>
    </nav>
    
    <div id="slides-container">
      <div class="slide active">
        <h1 id="main-title">氧化還原方程式——氧化數法平衡</h1>
        <p class="subtitle" id="main-subtitle" style="margin-bottom: 1rem;">依序點擊框格選取化學種，開始平衡練習</p>
        
        <!-- 步驟按鈕區塊 -->
        <div class="step-nav-horizontal" id="nav-ox">
          <button class="step-btn" id="step1-btn" onclick="runStep(1)" disabled>
            <div class="step-num">1</div><div class="step-text">計算氧化數及變化</div>
          </button>
          <button class="step-btn" id="step2-btn" onclick="runStep(2)" disabled>
            <div class="step-num">2</div><div class="step-text">平衡氧化數變化量</div>
          </button>
          <button class="step-btn" id="step3-btn" onclick="runStep(3)" disabled>
            <div class="step-num">3</div><div class="step-text">平衡電荷數</div>
          </button>
          <button class="step-btn" id="step4-btn" onclick="runStep(4)" disabled>
            <div class="step-num">4</div><div class="step-text">原子不滅 (H₂O)</div>
          </button>
          <button class="step-btn" id="step5-btn" onclick="runStep(5)" disabled>
            <div class="step-num">5</div><div class="step-text">最終平衡結果</div>
          </button>
        </div>

        <div class="step-nav-horizontal hidden" id="nav-hr">
          <button class="step-btn" id="hr-step1-btn" onclick="runHRStep(1)" disabled><div class="step-num">1</div><div class="step-text">氧化與還原劑</div></button>
          <button class="step-btn" id="hr-step2-btn" onclick="runHRStep(2)" disabled><div class="step-num">2</div><div class="step-text">計算電子變化</div></button>
          <button class="step-btn" id="hr-step3-btn" onclick="runHRStep(3)" disabled><div class="step-num">3</div><div class="step-text">平衡電荷數</div></button>
          <button class="step-btn" id="hr-step4-btn" onclick="runHRStep(4)" disabled><div class="step-num">4</div><div class="step-text">平衡原子數</div></button>
          <button class="step-btn" id="hr-step5-btn" onclick="runHRStep(5)" disabled><div class="step-num">5</div><div class="step-text">平衡電子數</div></button>
          <button class="step-btn" id="hr-step6-btn" onclick="runHRStep(6)" disabled><div class="step-num">6</div><div class="step-text">完成反應</div></button>
          <button class="step-btn" id="hr-step7-btn" onclick="runHRStep(7)" disabled><div class="step-num">7</div><div class="step-text">完成平衡</div></button>
        </div>

        <div class="topic-display" id="topic-display"></div>

        <!-- 互動工作區 -->
        <div class="equation-workspace" id="equation-workspace">
          <svg id="eq-svg" class="eq-svg">
            <defs>
              <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <polyline points="0 0, 7 4, 0 8" fill="none" stroke="#ff4d6d" stroke-width="1.5" />
              </marker>
              <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <polyline points="0 0, 7 4, 0 8" fill="none" stroke="#00b4d8" stroke-width="1.5" />
              </marker>
            </defs>
          </svg>

          <!-- 氧化數法佈局 -->
          <div class="equation-layout">
            <div class="row row-main">
              <div class="slot-group group-reactants">
                <div class="slot slot-balancer" id="slot-1">
                  <span class="slot-label">反應物</span><div class="slot-content" id="content-1"></div>
                </div>

<script>
// =============== Toolbar & Drawing Layer Logic ===============
let isDrawingMode = false, drawMode = 'pen', penColor = '#f8fafc';
let lastX = 0, lastY = 0, isDrawing = false;
const canvas = document.getElementById('drawing-layer');
const ctx = canvas ? canvas.getContext('2d') : null;

function resizeCanvas() {
    if (!canvas || !ctx) return;
    canvas.width = document.documentElement.scrollWidth; 
    canvas.height = document.documentElement.scrollHeight;
}
window.addEventListener('resize', resizeCanvas);
if (canvas && ctx) resizeCanvas();

function getCoords(e) {
    if (!canvas) return [0, 0];
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return [cx - rect.left, cy - rect.top];
}
function startDrawing(e) { if (!isDrawingMode || !ctx) return; isDrawing = true; [lastX, lastY] = getCoords(e); }
function draw(e) {
    if (!isDrawing || !ctx) return;
    const [x, y] = getCoords(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
    if (drawMode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = 38;
    } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = penColor;
        ctx.lineWidth = 3.5;
    }
    ctx.lineCap = 'round'; ctx.stroke();
    [lastX, lastY] = [x, y];
}
function stopDrawing() { if (isDrawing && canvas) isDrawing = false; }

if (canvas) {
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', e => { if (isDrawingMode) e.preventDefault(); startDrawing(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (isDrawingMode) e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
}

document.getElementById('btn-draw').addEventListener('click', e => {
    isDrawingMode = !isDrawingMode;
    if (isDrawingMode) drawMode = 'pen';
    e.currentTarget.classList.toggle('active-tool', isDrawingMode);
    canvas.classList.toggle('drawing-active', isDrawingMode);
    document.getElementById('color-picker').style.display = isDrawingMode ? 'flex' : 'none';
    document.getElementById('eraser-tools').style.display = isDrawingMode ? 'flex' : 'none';
});
document.getElementById('btn-eraser').addEventListener('click', e => {
    drawMode = drawMode === 'eraser' ? 'pen' : 'eraser';
    e.currentTarget.classList.toggle('active-tool', drawMode === 'eraser');
});
document.querySelectorAll('.color-dot').forEach(dot => {
    dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.style.borderColor = 'transparent');
        dot.style.borderColor = 'white';
        penColor = dot.dataset.color; drawMode = 'pen';
        document.getElementById('btn-eraser').classList.remove('active-tool');
    });
});
document.getElementById('btn-clear').addEventListener('click', () => {
    if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// Toolbar drag
(function () {
    const tb = document.getElementById('toolbar'), dh = document.getElementById('drag-handle');
    let isDT = false, tOY = 0;
    const sDT = y => { isDT = true; tOY = y - tb.offsetTop; };
    const mDT = y => { if (isDT) { tb.style.top = (y - tOY) + 'px'; tb.style.bottom = 'auto'; tb.style.transform = 'none'; } };
    dh.addEventListener('mousedown', e => sDT(e.clientY));
    window.addEventListener('mousemove', e => mDT(e.clientY));
    window.addEventListener('mouseup', () => { isDT = false; });
    dh.addEventListener('touchstart', e => sDT(e.touches[0].clientY), { passive: true });
    window.addEventListener('touchmove', e => { if (isDT) mDT(e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', () => { isDT = false; });
})();

// Start Overlay
(function () {
    let starting = false;
    function startTeaching(ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        if (starting) return; starting = true;
        document.getElementById('start-overlay').style.display = 'none';
        const el = document.documentElement;
        try { const p = el.requestFullscreen && el.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
        try { if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (e) {}
        setTimeout(() => resizeCanvas(), 100);
    }
    const btn = document.getElementById('btn-start');
    if (btn) { btn.addEventListener('click', startTeaching); btn.addEventListener('touchend', startTeaching, { passive: false }); }
})();

// Random Draw Tool Logic
(function() {
    const btnRandomDraw = document.getElementById('btn-random-draw');
    const drawModal = document.getElementById('random-draw-modal');
    const btnCloseDraw = document.getElementById('btn-close-draw');
    const drawBallsContainer = document.getElementById('random-draw-balls');
    const drawTotalInput = document.getElementById('draw-total-input');
    const btnDoDraw = document.getElementById('btn-do-draw');

    let drawBalls = [];
    let totalBalls = 40;

    function renderBalls() {
        drawBallsContainer.innerHTML = '';
        drawBalls = [];
        for (let i = 1; i <= totalBalls; i++) {
            const ball = document.createElement('div');
            ball.className = 'draw-ball';
            ball.textContent = i;
            ball.dataset.num = i;
            drawBallsContainer.appendChild(ball);
            drawBalls.push(ball);
        }
    }

    btnRandomDraw.addEventListener('click', () => {
        if (drawModal.style.display === 'block') {
            drawModal.style.display = 'none';
            btnRandomDraw.classList.remove('active-tool');
        } else {
            drawModal.style.display = 'block';
            btnRandomDraw.classList.add('active-tool');
            if (drawBalls.length === 0) {
                totalBalls = parseInt(drawTotalInput.value) || 40;
                renderBalls();
            }
        }
    });

    btnCloseDraw.addEventListener('click', () => {
        drawModal.style.display = 'none';
        btnRandomDraw.classList.remove('active-tool');
    });

    drawTotalInput.addEventListener('change', () => {
        let val = parseInt(drawTotalInput.value);
        if (isNaN(val) || val < 1) val = 1;
        drawTotalInput.value = val;
        totalBalls = val;
        renderBalls();
    });

    let drawInterval;
    let drawTimeout;

    btnDoDraw.addEventListener('click', () => {
        if (btnDoDraw.disabled) return;

        // Find all available (undrawn) balls
        const availableBalls = drawBalls.filter(b => !b.classList.contains('drawn'));
        
        if (availableBalls.length === 0) {
            alert('所有號碼都已抽出！');
            return;
        }

        // Remove winner state from previous winner and mark as drawn
        const prevWinner = drawBalls.find(b => b.classList.contains('winner'));
        if (prevWinner) {
            prevWinner.classList.remove('winner');
            prevWinner.classList.add('drawn');
        }

        // Update available balls again in case we just marked the previous winner
        const currentAvailable = drawBalls.filter(b => !b.classList.contains('drawn'));
        if (currentAvailable.length === 0) {
            alert('所有號碼都已抽出！');
            return;
        }

        btnDoDraw.disabled = true;
        drawTotalInput.disabled = true;

        let flickerCount = 0;
        const flickerDuration = 3000; // 3 seconds
        const flickerSpeed = 50; // Every 50ms

        // Start flickering
        drawInterval = setInterval(() => {
            // Clear all flickers
            currentAvailable.forEach(b => b.classList.remove('flicker'));
            // Pick a random ball to flicker
            const randomIdx = Math.floor(Math.random() * currentAvailable.length);
            currentAvailable[randomIdx].classList.add('flicker');
        }, flickerSpeed);

        // Stop flickering and pick winner
        drawTimeout = setTimeout(() => {
            clearInterval(drawInterval);
            currentAvailable.forEach(b => b.classList.remove('flicker'));

            const winnerIdx = Math.floor(Math.random() * currentAvailable.length);
            const winnerBall = currentAvailable[winnerIdx];
            winnerBall.classList.add('winner');

            btnDoDraw.disabled = false;
            drawTotalInput.disabled = false;
        }, flickerDuration);
    });
})();
</script>

function openPopover(slotId, event) {
  const popover = document.getElementById('popover'); const itemsContainer = document.getElementById('popover-items');
  const slotEl = document.getElementById(`slot-${slotId}`); if (slotEl.classList.contains('locked')) return;
  itemsContainer.innerHTML = ''; let items = [];
  switch(slotId) {
    case 2: OXIDIZERS_LIST.forEach(ox => { items.push({ id: ox.id, html: ox.formulaHTML, name: ox.compound, action: () => selectSpecies(2, ox.id) }); }); break;
    case 3: REDUCERS_LIST.forEach(red => { items.push({ id: red.id, html: red.formulaHTML, name: red.compound, action: () => selectSpecies(3, red.id) }); }); break;
    case 7: items = [{ id: 'acid', html: '酸性 (H⁺)', name: 'Acidic', action: () => selectCondition('acid') }, { id: 'base', html: '鹼性 (OH⁻)', name: 'Basic', action: () => selectCondition('base') }]; break;
    case 4: if (!sel.ox) return; getConjugatesFor(sel.ox, sel.cond, 'ox').forEach(p => { items.push({ id: p.id, html: p.formulaHTML, name: p.name, action: () => selectSpecies(4, p.id) }); }); break;
    case 5: if (!sel.red) return; getConjugatesFor(sel.red, sel.cond, 'red').forEach(p => { items.push({ id: p.id, html: p.formulaHTML, name: p.name, action: () => selectSpecies(5, p.id) }); }); break;
  }
  items.forEach(item => {
    const div = document.createElement('div'); div.className = 'pop-item'; div.innerHTML = `<span class="formula">${item.html}</span><span class="name">${item.name}</span>`;
    div.onclick = () => { item.action(); closePopover(); }; itemsContainer.appendChild(div);
  });
  const rect = slotEl.getBoundingClientRect(); popover.style.display = 'block';
  if (items.length > 5) { itemsContainer.style.display = 'grid'; itemsContainer.style.gridTemplateRows = 'repeat(5, auto)'; itemsContainer.style.gridAutoFlow = 'column'; itemsContainer.style.gap = '8px'; }
  else { itemsContainer.style.display = 'flex'; itemsContainer.style.flexDirection = 'column'; itemsContainer.style.gap = '4px'; }
  let left = rect.left + rect.width/2 - popover.offsetWidth/2;
  if (left < 10) left = 10; if (left + popover.offsetWidth > window.innerWidth - 10) left = window.innerWidth - popover.offsetWidth - 10;
  popover.style.left = `${left}px`; popover.style.top = `${rect.bottom + 10}px`;
  const closeHandler = (e) => { if (!popover.contains(e.target) && !slotEl.contains(e.target)) { closePopover(); document.removeEventListener('mousedown', closeHandler); } };
  document.addEventListener('mousedown', closeHandler);
}

function renderFormula(id, slotId) {
  const sp = SPECIES[id]; if (!sp) return id;
  let html = ''; const rolePrefix = { 2:'ox', 3:'red', 4:'oxP', 5:'redP' }[slotId];
  html += `<span class="coeff" id="coeff-${rolePrefix}">1</span>`;
  sp.htmlParts.forEach(part => {

  });

}

function checkReadyToBalance() {
  if (sel.ox && sel.red && sel.cond && sel.oxP && sel.redP) {
    const res = calculateBalance(sel.ox, sel.red, sel.oxP, sel.redP, sel.cond);
    if (res) { 
      rxn = res; 
      enableUpTo(1); 
      enableHRUpTo(1);
    } else { 
      setExpl('<div style="color:#f87171">無法平衡：請確認選取的反應物與產物。</div>', 0); 
      enableUpTo(0); 
      enableHRUpTo(0);
    }
  } else {
    rxn = null;
    enableUpTo(0);
    enableHRUpTo(0);
  }
}

function calculateBalance(oxId, redId, oxPId, redPId, cond) {
  const oxSp = SPECIES[oxId], redSp = SPECIES[redId], oxPSp = SPECIES[oxPId], redPSp = SPECIES[redPId];
  const dx = oxPSp.oxNum - oxSp.oxNum, dr = redPSp.oxNum - redSp.oxNum; if ((dx >= 0 && dr >= 0) || (dx <= 0 && dr <= 0)) return null;
  const molDx = Math.abs(dx * oxSp.keyCount), molDr = Math.abs(dr * redSp.keyCount), L = lcm(molDx, molDr);
  let cOx = L / molDx, cRed = L / molDr;
  const totalKeyOx = cOx * oxSp.keyCount, totalKeyRed = cRed * redSp.keyCount;
  const mult = lcm(oxPSp.keyCount / gcd(totalKeyOx, oxPSp.keyCount), redPSp.keyCount / gcd(totalKeyRed, redPSp.keyCount));
  cOx *= mult; cRed *= mult; const cOxP = (cOx * oxSp.keyCount) / oxPSp.keyCount, cRedP = (cRed * redSp.keyCount) / redPSp.keyCount;
  let QL = cOx * oxSp.charge + cRed * redSp.charge, QR = cOxP * oxPSp.charge + cRedP * redPSp.charge, dQ = QR - QL, b3 = null;
  if (cond === 'acid') { if (dQ > 0) b3 = { type: 'H+', coeff: dQ, side: 'L' }; else if (dQ < 0) b3 = { type: 'H+', coeff: Math.abs(dQ), side: 'R' }; }
  else { if (dQ > 0) b3 = { type: 'OH-', coeff: dQ, side: 'R' }; else if (dQ < 0) b3 = { type: 'OH-', coeff: Math.abs(dQ), side: 'L' }; }
  const getA = () => {
    let hl=0, ol=0, hr=0, or=0; const add = (id, c, s) => { const sp=SPECIES[id]; if(s==='L'){ hl+=sp.H*c; ol+=sp.O*c; } else { hr+=sp.H*c; or+=sp.O*c; } };
    add(oxId, cOx, 'L'); add(redId, cRed, 'L'); add(oxPId, cOxP, 'R'); add(redPId, cRedP, 'R');
    if (b3) { const c = b3.coeff; if (b3.type === 'H+') { if(b3.side==='L') hl+=c; else hr+=c; } else { if(b3.side==='L') { hl+=c; ol+=c; } else { hr+=c; or+=c; } } }
    return { hl, ol, hr, or };
  };
  let atoms = getA(), dO = atoms.or - atoms.ol, b4 = null;
  if (dO > 0) b4 = { type: 'H2O', coeff: dO, side: 'L' }; else if (dO < 0) b4 = { type: 'H2O', coeff: Math.abs(dO), side: 'R' };
  return { cOx, cRed, cOxP, cRedP, dx, dr, molDx, molDr, L, balancer3: b3, balancer4: b4, oxSp, redSp, oxPSp, redPSp };
}

function runStep(n) {
  if (!rxn) return; 
  state.oxNum.cur = n; 
  updateStepBtns(n); 
  clearStepsData();
  if (n >= 1) { 
    document.getElementById('equation-workspace').classList.add('balancing'); 
    showTopic();
    applyStep1(); 
    if (n === 1) setExpl(getExpl1()); 
  }
  if (n >= 2) { applyStep2(); if (n === 2) setExpl(getExpl2()); }
  if (n >= 3) { applyStep3(); if (n === 3) setExpl(getExpl3()); }
  if (n >= 4) { applyStep4(); if (n === 4) setExpl(getExpl4()); }
  if (n === 5) { applyStep5(); setExpl('<h3>步驟 5：平衡完成</h3><p>反應式已完成平衡。請確認兩側原子數與電荷數皆相等。</p>'); }
  if (n >= 1 && n <= 4) setTimeout(() => drawLines(n >= 2), 50);
  if (n > state.oxNum.max) { state.oxNum.max = n; enableUpTo(n + 1); }
}

function applyStep5() {

function drawLines(withC) {
  const svg = document.getElementById('eq-svg'); svg.querySelectorAll('.line-group').forEach(e=>e.remove());
  const box = (r) => { const el=document.getElementById(`key-${r}`); if(!el) return null; const b=el.getBoundingClientRect(), c=document.getElementById('equation-workspace').getBoundingClientRect(); return { x: b.left + b.width/2 - c.left, yT: b.top - c.top, yB: b.bottom - c.top }; };
  const pOx=box('ox'), pOxP=box('oxP'), pRed=box('red'), pRedP=box('redP'); if (!pOx || !pOxP || !pRed || !pRedP) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'line-group');
  const yB = Math.max(pOx.yB, pOxP.yB)+40; pth(g, pOx.x, pOx.yB, pOxP.x, pOxP.yB, yB, 'arr-red', '#ff4d6d'); txt(g, (pOx.x+pOxP.x)/2, yB+18, lbl('red', withC), '#ff4d6d');
  const yT = Math.min(pRed.yT-25, pRedP.yT-25)-40; pth(g, pRed.x, pRed.yT-25, pRedP.x, pRedP.yT-25, yT, 'arr-blue', '#00b4d8'); txt(g, (pRed.x+pRedP.x)/2, yT-8, lbl('ox', withC), '#00b4d8');
  svg.appendChild(g);
}
function pth(g,x1,y1,x2,y2,ye,m,cl) { const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',`M${x1},${y1} V${ye} H${x2} V${y2}`); p.setAttribute('stroke',cl); p.setAttribute('stroke-width','2'); p.setAttribute('fill','none'); p.setAttribute('marker-end',`url(#${m})`); g.appendChild(p); }
function txt(g,x,y,tx,cl) { const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor','middle'); t.setAttribute('fill',cl); t.setAttribute('font-size','12'); t.setAttribute('font-weight','700'); t.innerHTML=tx; g.appendChild(t); }
function lbl(t,wC) { const col='#facc15'; const mul=String.fromCharCode(215); if(t==='ox') return wC ? `+${rxn.molDr} <tspan fill="${col}">${mul} ${rxn.cRed}</tspan> = +${rxn.L}` : `+${rxn.molDr}`; return wC ? `-${rxn.molDx} <tspan fill="${col}">${mul} ${rxn.cOx}</tspan> = -${rxn.L}` : `-${rxn.molDx}`; }
function getConjugatesFor(id, cond, role) {
  const res=[]; 
  HALF_REACTIONS.forEach(hr=>{ 
    if (cond && !hr.conds.includes(cond)) return;
    if (role === 'ox' && hr.oxForm === id) res.push(hr.redForm);
    else if (role === 'red' && hr.redForm === id) res.push(hr.oxForm);
  });
  return [...new Set(res)].map(pid=>{ const s=SPECIES[pid]; return { id:pid, formulaHTML: rndr(s.htmlParts), name:s.name||pid }; });
}
function rndr(pt) { return pt.map(p=>{ if(p.type==='sub') return `<sub>${p.text}</sub>`; if(p.type==='sup') return `<sup>${p.text}</sup>`; return p.text; }).join(''); }
function showTopic() {

function lcm(a, b) { return (a * b) / gcd(a, b); }

function renderSpeciesHTML(id, coeff = 1) {
  const sp = SPECIES[id]; if (!sp) return id;
  let html = coeff > 1 ? `<span class="coeff vis">${coeff}</span>` : '';
  sp.htmlParts.forEach(p => {
    if (p.type === 'key' || p.type === 'txt') html += p.text;
    else if (p.type === 'sub') html += `<sub>${p.text}</sub>`;
    else if (p.type === 'sup') html += `<sup>${p.text}</sup>`;
  });
  return html;
}

function renderHR() {
  const formatItems = (items) => {
    if (!items || items.length === 0) return '';
    return `<span>` + items.map(it => {
      if (it.id === 'e-') return `<span class="hr-e">${it.coeff > 1 ? it.coeff + '&nbsp;' : ''}e⁻</span>`;
      if (it.id === 'H+') return `<span>${it.coeff > 1 ? it.coeff + '&nbsp;' : ''}H⁺</span>`;
      if (it.id === 'OH-') return `<span>${it.coeff > 1 ? it.coeff + '&nbsp;' : ''}OH⁻</span>`;
      if (it.id === 'H2O') return `<span>${it.coeff > 1 ? it.coeff + '&nbsp;' : ''}H₂O</span>`;
      return renderSpeciesHTML(it.id, it.coeff);
    }).join(' + ') + `</span>`;
  };

  document.getElementById('hr-red-main-L').innerHTML = formatItems(hrRxn.red.mainL);
  document.getElementById('hr-red-main-R').innerHTML = formatItems(hrRxn.red.mainR);
  document.getElementById('hr-red-L').innerHTML = formatItems(hrRxn.red.extraL);
  document.getElementById('hr-red-R-content').innerHTML = formatItems(hrRxn.red.extraR);

  document.getElementById('hr-ox-main-L').innerHTML = formatItems(hrRxn.ox.mainL);
  document.getElementById('hr-ox-main-R').innerHTML = formatItems(hrRxn.ox.mainR);
  document.getElementById('hr-ox-L').innerHTML = formatItems(hrRxn.ox.extraL);
  document.getElementById('hr-ox-R-content').innerHTML = formatItems(hrRxn.ox.extraR);
}

function applyHRStep1() {
  // 步驟 1: 氧化劑與還原劑 (建立基礎框架)
  const gcdRed = gcd(rxn.oxSp.keyCount, rxn.oxPSp.keyCount);
  const cOx = rxn.oxPSp.keyCount / gcdRed;
  const cOxP = rxn.oxSp.keyCount / gcdRed;
  
  const gcdOx = gcd(rxn.redSp.keyCount, rxn.redPSp.keyCount);
  const cRed = rxn.redPSp.keyCount / gcdOx;
  const cRedP = rxn.redSp.keyCount / gcdOx;

  hrRxn.red = {
    mainL: [{ id: sel.ox, coeff: cOx }],
    mainR: [{ id: sel.oxP, coeff: cOxP }],
    extraL: [], extraR: []
  };
  hrRxn.ox = {
    mainL: [{ id: sel.red, coeff: cRed }],
    mainR: [{ id: sel.redP, coeff: cRedP }],
    extraL: [], extraR: []
  };

  renderHR();
  document.getElementById('hr-sum-line').style.display = 'block'; 
  setExpl(`<h3>步驟 1：氧化劑與還原劑</h3><p>標示還原半反應與氧化半反應的反應物及產物。</p>`);
}

function applyHRStep2() {
  // 步驟 2: 計算電子變化量
  const eRed = Math.abs(rxn.dx * lcm(rxn.oxSp.keyCount, rxn.oxPSp.keyCount));
  hrRxn.red.extraL.push({ id: 'e-', coeff: eRed });

  const eOx = Math.abs(rxn.dr * lcm(rxn.redSp.keyCount, rxn.redPSp.keyCount));
  hrRxn.ox.extraR.push({ id: 'e-', coeff: eOx });

  renderHR();
  setExpl(`<h3>步驟 2：計算電子變化量</h3><p>標示電子得失。還原半反應得到電子；氧化半反應失去電子。</p>`);
}

function applyHRStep3() {
  // 步驟 3: 平衡電荷
  const balanceCharge = (rxnSide) => {
    let qL = 0, qR = 0;
    const countQ = (items) => {
      let q = 0;
      items.forEach(it => { q += (it.id === 'e-' ? -1 : it.id === 'H+' ? 1 : it.id === 'OH-' ? -1 : (SPECIES[it.id]?.charge || 0)) * it.coeff; });
      return q;
    };
    qL = countQ(rxnSide.mainL) + countQ(rxnSide.extraL);
    qR = countQ(rxnSide.mainR) + countQ(rxnSide.extraR);
    
    let dq = qR - qL;
    if (sel.cond === 'acid') {
      if (dq > 0) rxnSide.extraL.push({ id: 'H+', coeff: dq });
      else if (dq < 0) rxnSide.extraR.push({ id: 'H+', coeff: Math.abs(dq) });
    } else {
      if (dq > 0) rxnSide.extraR.push({ id: 'OH-', coeff: dq });
      else if (dq < 0) rxnSide.extraL.push({ id: 'OH-', coeff: Math.abs(dq) });
    }
  };
  balanceCharge(hrRxn.red);
  balanceCharge(hrRxn.ox);
  renderHR();
  setExpl(`<h3>步驟 3：平衡電荷</h3><p>依據液性補入 H⁺ 或 OH⁻。</p>`);
}

function applyHRStep4() {
  // 步驟 4: 平衡原子數 (H2O)
  const balanceAtoms = (rxnSide) => {
    let oL = 0, oR = 0;
    const countO = (items) => {
      let o = 0;
      items.forEach(it => { o += (it.id === 'H2O' ? 1 : it.id === 'OH-' ? 1 : (SPECIES[it.id]?.O || 0)) * it.coeff; });
      return o;
    };
    oL = countO(rxnSide.mainL) + countO(rxnSide.extraL);
    oR = countO(rxnSide.mainR) + countO(rxnSide.extraR);
    
    let dO = oR - oL;
    if (dO > 0) rxnSide.extraL.push({ id: 'H2O', coeff: dO });
    else if (dO < 0) rxnSide.extraR.push({ id: 'H2O', coeff: Math.abs(dO) });
  };
  balanceAtoms(hrRxn.red);
  balanceAtoms(hrRxn.ox);
  renderHR();
  setExpl(`<h3>步驟 4：平衡原子數</h3><p>補入 H₂O 平衡氧原子。</p>`);
}

function applyHRStep5() {
  // 步驟 5: 平衡得失電子數
  document.getElementById('hr-bracket-red').style.opacity = '1';
  document.getElementById('hr-bracket-ox').style.opacity = '1';
  document.getElementById('hr-mult-red').innerText = ` ${String.fromCharCode(215)} ${rxn.cOx}`;
  document.getElementById('hr-mult-ox').innerText = ` ${String.fromCharCode(215)} ${rxn.cRed}`;
  setExpl(`<h3>步驟 5：平衡得失電子數</h3><p>通分使電子數相等。</p>`);
}

function applyHRStep6() {
  // 步驟 6: 完成反應
  document.getElementById('hr-sum-line').style.display = 'block';
  document.getElementById('hr-sum-result').style.opacity = '1';
  
  const getUnsimplifiedSide = (sideKey) => {
    const sideName = sideKey === 'reactants' ? 'L' : 'R';
    const formatItems = (items, mult) => {
      if (items.length === 0) return '';
      return items.map(it => {
        const totalCoeff = it.coeff * mult;
        if (it.id === 'e-') return `<span class="hr-e">${totalCoeff > 1 ? totalCoeff + '&nbsp;' : ''}e⁻</span>`;
        if (it.id === 'H+') return `<span>${totalCoeff > 1 ? totalCoeff + '&nbsp;' : ''}H⁺</span>`;
        if (it.id === 'OH-') return `<span>${totalCoeff > 1 ? totalCoeff + '&nbsp;' : ''}OH⁻</span>`;
        if (it.id === 'H2O') return `<span>${totalCoeff > 1 ? totalCoeff + '&nbsp;' : ''}H₂O</span>`;
        return renderSpeciesHTML(it.id, totalCoeff);
      }).join(' + ');
    };
    
    let redItems, oxItems;
    if (sideName === 'L') {
      redItems = [...hrRxn.red.extraL, ...hrRxn.red.mainL];
      oxItems = [...hrRxn.ox.extraL, ...hrRxn.ox.mainL];
    } else {
      redItems = [...hrRxn.red.mainR, ...hrRxn.red.extraR];
      oxItems = [...hrRxn.ox.mainR, ...hrRxn.ox.extraR];
    }
    
    const redHtml = formatItems(redItems, rxn.cOx);
    const oxHtml = formatItems(oxItems, rxn.cRed);
    
    let res = '';
    if (redHtml) res += `<span style="color: var(--accent-ox)">${redHtml}</span>`;
    if (redHtml && oxHtml) res += ' + ';
    if (oxHtml) res += `<span style="color: var(--accent-red)">${oxHtml}</span>`;
    return res;
  };

  const finalL = getUnsimplifiedSide('reactants');
  const finalR = getUnsimplifiedSide('products');
  
  document.getElementById('hr-sum-result').innerHTML = `${finalL} <span style="color: var(--text-main);">${String.fromCharCode(10230)}</span> ${finalR}`;
  setExpl(`<h3>步驟 6：完成反應</h3><p>將兩半反應相加（尚未消去相同粒子），還原半反應為<span style="color: var(--accent-ox)">粉紅色</span>，氧化半反應為<span style="color: var(--accent-red)">藍色</span>。</p>`);
}

function applyHRStep7() {
  // 步驟 7: 完成平衡
  document.getElementById('hr-sum-line').style.display = 'block';
  document.getElementById('hr-sum-result').style.opacity = '1';
  
  const combine = (sideKey) => {
    let map = new Map();
    const add = (id, c, mult) => { map.set(id, (map.get(id) || 0) + c * mult); };
    const sideName = sideKey === 'reactants' ? 'L' : 'R';
    hrRxn.red['main'+sideName].forEach(it => add(it.id, it.coeff, rxn.cOx));
    hrRxn.red['extra'+sideName].forEach(it => add(it.id, it.coeff, rxn.cOx));
    hrRxn.ox['main'+sideName].forEach(it => add(it.id, it.coeff, rxn.cRed));
    hrRxn.ox['extra'+sideName].forEach(it => add(it.id, it.coeff, rxn.cRed));
    return map;
  };

  let left = combine('reactants'), right = combine('products');
  left.delete('e-'); right.delete('e-');
  ['H2O', 'H+', 'OH-'].forEach(k => {
    let l = left.get(k) || 0, r = right.get(k) || 0;
    if (l > r) { left.set(k, l - r); right.delete(k); }
    else if (r > l) { right.set(k, r - l); left.delete(k); }
    else { left.delete(k); right.delete(k); }
  });

  const renderMap = (map) => Array.from(map.entries()).filter(([id, c]) => c > 0).map(([id, c]) => {
    if (id === 'H+') return `<span>${c > 1 ? c + '&nbsp;' : ''}H⁺</span>`;
    if (id === 'OH-') return `<span>${c > 1 ? c + '&nbsp;' : ''}OH⁻</span>`;
    if (id === 'H2O') return `<span>${c > 1 ? c + '&nbsp;' : ''}H₂O</span>`;
    return renderSpeciesHTML(id, c);
  }).join(' + ');

  const finalL = renderMap(left), finalR = renderMap(right);
  document.getElementById('hr-sum-result').innerHTML = `<span class="sum-reactant">${finalL}</span> <span style="color: var(--text-main);">\\u27F6</span> <span class="sum-product">${finalR}</span>`;
  document.getElementById('topic-display').innerHTML = `<b>平衡結果：</b> ${finalL} \\u27F6 ${finalR}`;
  setExpl(`<h3>步驟 7：完成平衡</h3><p>相加並消去相同粒子，得到最終平衡方程式。</p>`);
}

function exitToBlog() {
  window.location.href = '../../index.html';
}

// ── Auto fullscreen on entry (iPad uses webkit prefix) ──
function tryFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) req.call(el).catch(() => {});
}
tryFullscreen();
document.addEventListener('click', function onFirstClick() {
  tryFullscreen();
  document.removeEventListener('click', onFirstClick);
}, { once: true });
document.addEventListener('fullscreenchange', () => {});
document.addEventListener('webkitfullscreenchange', () => {});
</script>
