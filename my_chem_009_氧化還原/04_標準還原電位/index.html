<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>標準電位測量 - 互動式學習</title>
<meta name="description" content="互動式標準電化學電位測量過程展演，學習還原半反應與標準電位的原理">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  #btn-home {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 99999;
    background: rgba(255,255,255,0.12);
    color: #f8fafc;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 0.88rem;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #btn-home:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
<a id="btn-home" href="../../index.html" title="返回目錄">&#8592; 目錄</a>
<div id="app">

  <!-- LEFT PANEL: Standard Reduction Potential Scale -->
  <div id="left-panel">
    <div id="left-header">
      <h2>標準還原電位</h2>
      <p class="subtitle">還原半反應 E° (V vs SHE)</p>
    </div>
    <div id="potential-scale-container">
      <div id="potential-axis-label-top">E° 高 → 強氧化劑（易還原）</div>
      <div id="potential-scale-wrapper">
        <!-- Axis line -->
        <div id="potential-axis-line"></div>
        <!-- Tick marks and reaction labels rendered by JS -->
        <div id="potential-reactions"></div>
        <!-- Dynamic highlights and diff bars will be appended here -->
      </div>
      <div id="potential-axis-label-bottom">E° 低 → 強還原劑（易氧化）</div>
    </div>
    <div id="show-all-btn-container">
      <button id="show-all-btn" class="btn-outline">顯示所有標準電位值</button>
    </div>
  </div>

  <!-- RIGHT PANEL: Interactive Battery Setup -->
  <div id="right-panel">
    <div id="right-header">
      <h1>標準電位測量實驗</h1>
      <p class="subtitle">拖曳半電池材料包至左右兩個電解槽，兩槽備齊後按「測量」開關</p>
    </div>

    <!-- Battery SVG Canvas -->
    <div id="battery-area">
      <svg id="battery-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- Reaction equations overlay — appears between the two beakers when circuit closed -->
    <div id="reaction-overlay" class="hidden">
      <div id="reaction-box">
        <div id="anode-eq"   class="reaction-line anode"></div>
        <div id="cathode-eq" class="reaction-line cathode"></div>
        <div id="overall-eq" class="reaction-line overall"></div>
      </div>
    </div>

    <!-- Record button (near voltmeter, shown after circuit is closed) -->
    <div id="record-btn-container" class="hidden">
      <button id="record-btn" class="btn-primary">📊 記錄至電位條</button>
    </div>

    <!-- Half-cell material packs tray -->
    <div id="materials-section">
      <div id="materials-label">半電池材料包（拖曳至上方電解槽）</div>
      <div id="materials-grid">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

</div>

<!-- Drag ghost element -->
<div id="drag-ghost"></div>

<script src="app.js"></script>
<script>
  // ── Auto fullscreen on entry (supports iPad Safari webkit prefix) ──
  function tryFullscreen() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(function(){});
  }
  tryFullscreen();
  document.addEventListener('click', function onFirstClick() {
    tryFullscreen();
    document.removeEventListener('click', onFirstClick);
  }, { once: true });
  document.addEventListener('fullscreenchange', function(){});
  document.addEventListener('webkitfullscreenchange', function(){});
</script>
</body>
</html>
