<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>波耳原子模型 3D/動態互動模擬</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
      padding: 12px 24px;
      background: #090d16;
      flex-shrink: 0;
    }
    .badge {
      background: #10b981;
      color: #fff;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: clamp(1.2rem, 1.8vw, 1.6rem);
      font-weight: 800;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <span class="badge">互動模擬 02</span>
      <h1 style="display:inline-block; margin-left: 10px;">波耳原子模型動態模擬器</h1>
    </div>
    <div class="subtitle">互動模擬：電子公轉軌道、光子吸收激發跳躍與發射躍遷視覺化呈現</div>
  </div>

  <div class="iframe-wrapper">
    <iframe src="bohr_atom_model.html"></iframe>
  </div>

  <script src="../../unified_chem_spa/js/scroll_relay.js"></script>
</body>
</html>
