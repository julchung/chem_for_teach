<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-2 氫原子光譜與波耳模型 - 全方位互動講義</title>
  <meta name="description" content="高中化學 4-2 氫原子光譜與波耳模型：光的二象性、芮得柏方程式、波耳三大假設、能階躍遷互動模擬與範例詳解。">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #top-nav {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .nav-title { font-weight: 800; font-size: 0.95rem; color: #f8fafc; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .badge-num { background: #a855f7; color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; }
    .jump-buttons { display: flex; gap: 5px; overflow-x: auto; padding: 4px 0; max-width: 70vw; scrollbar-width: none; }
    .jump-buttons::-webkit-scrollbar { display: none; }
    .jump-btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 4px 10px;
      border-radius: 6px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; font-weight: 600; transition: all 0.2s ease;
    }
    .jump-btn:hover { background: #334155; color: #f1f5f9; }
    .jump-btn.active { background: #a855f7; border-color: #c084fc; color: #fff; box-shadow: 0 0 10px rgba(168,85,247,0.5); }
    .jump-btn.quiz-btn { background: #be185d; border-color: #f472b6; color: #fff; }
    .jump-btn.quiz-btn.active { background: #db2777; box-shadow: 0 0 12px rgba(236,72,153,0.6); }
    #slides-container {
      width: 100%; height: calc(100% - 52px); margin-top: 52px;
      overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth;
    }
    .slide-wrapper { width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; }
    .slide-frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <nav id="top-nav">
    <div class="nav-title">
      <span class="badge-num">4-2</span>
      <h1 style="font-size:inherit;font-weight:inherit;">氫原子光譜與波耳模型</h1>
    </div>
    <div class="jump-buttons">
      <button class="jump-btn active" data-index="1">1. 光的二象性</button>
      <button class="jump-btn" data-index="2">2. 範例1(光子能量)</button>
      <button class="jump-btn" data-index="3">3. 芮得柏方程式</button>
      <button class="jump-btn" data-index="4">4. 光譜實驗模擬</button>
      <button class="jump-btn" data-index="5">5. 範例2(波長極值)</button>
      <button class="jump-btn" data-index="6">6. 波耳三大假設</button>
      <button class="jump-btn" data-index="7">7. 波耳理論推導</button>
      <button class="jump-btn" data-index="8">8. 波耳模型模擬</button>
      <button class="jump-btn" data-index="9">9. 範例3(頻率比)</button>
      <button class="jump-btn" data-index="10">10. 範例4(譜線圖)</button>
      <button class="jump-btn quiz-btn" data-index="11">🎮 核心檢核</button>
    </div>
  </nav>

  <main id="slides-container">
    <section class="slide-wrapper" id="slide-1" data-slide="1"><iframe class="slide-frame" src="slidepage1.html" title="光的二象性與光譜"></iframe></section>
    <section class="slide-wrapper" id="slide-2" data-slide="2"><iframe class="slide-frame" data-src="slidepage2.html" title="範例1"></iframe></section>
    <section class="slide-wrapper" id="slide-3" data-slide="3"><iframe class="slide-frame" data-src="slidepage3.html" title="芮得柏方程式"></iframe></section>
    <section class="slide-wrapper" id="slide-4" data-slide="4"><iframe class="slide-frame" data-src="slidepage4.html" title="芮得柏光譜實驗模擬"></iframe></section>
    <section class="slide-wrapper" id="slide-5" data-slide="5"><iframe class="slide-frame" data-src="slidepage5.html" title="範例2"></iframe></section>
    <section class="slide-wrapper" id="slide-6" data-slide="6"><iframe class="slide-frame" data-src="slidepage6.html" title="波耳三大假設"></iframe></section>
    <section class="slide-wrapper" id="slide-7" data-slide="7"><iframe class="slide-frame" data-src="slidepage7.html" title="波耳理論推導"></iframe></section>
    <section class="slide-wrapper" id="slide-8" data-slide="8"><iframe class="slide-frame" data-src="slidepage8.html" title="波耳模型模擬"></iframe></section>
    <section class="slide-wrapper" id="slide-9" data-slide="9"><iframe class="slide-frame" data-src="slidepage9.html" title="範例3"></iframe></section>
    <section class="slide-wrapper" id="slide-10" data-slide="10"><iframe class="slide-frame" data-src="slidepage10.html" title="範例4"></iframe></section>
    <section class="slide-wrapper" id="slide-11" data-slide="11"><iframe class="slide-frame" data-src="quiz.html" title="核心通關檢核"></iframe></section>
  </main>

  <script>
    const container = document.getElementById('slides-container');
    const jumpBtns = document.querySelectorAll('.jump-btn');
    const wrappers = document.querySelectorAll('.slide-wrapper');

    jumpBtns.forEach(btn => btn.addEventListener('click', () => {
      const target = document.getElementById('slide-' + btn.dataset.index);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    }));

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const idx = entry.target.dataset.slide;
        const iframe = entry.target.querySelector('iframe');
        if (iframe && !iframe.getAttribute('src') && iframe.dataset.src) iframe.setAttribute('src', iframe.dataset.src);
        // 預載下一頁
        const next = document.getElementById('slide-' + (parseInt(idx) + 1));
        if (next) {
          const nf = next.querySelector('iframe');
          if (nf && !nf.getAttribute('src') && nf.dataset.src) nf.setAttribute('src', nf.dataset.src);
        }
        jumpBtns.forEach(b => {
          const on = b.dataset.index === idx;
          b.classList.toggle('active', on);
          if (on) b.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
        });
      });
    }, { root: container, threshold: 0.55 });
    wrappers.forEach(w => observer.observe(w));

    window.addEventListener('keydown', e => {
      if (['ArrowDown', 'PageDown'].includes(e.key)) {
        e.preventDefault(); container.scrollBy({ top: container.clientHeight, behavior: 'smooth' });
      } else if (['ArrowUp', 'PageUp'].includes(e.key)) {
        e.preventDefault(); container.scrollBy({ top: -container.clientHeight, behavior: 'smooth' });
      }
    });

    window.addEventListener('message', e => {
      if (e.data && (e.data.type === 'QUIZ_PASSED' || e.data.type === 'SECTION_COMPLETE')) {
        try { window.parent !== window && window.parent.postMessage(e.data, '*'); } catch (err) {}
      }
    });
  </script>

  <!-- ── 捲動位置中繼器與手寫板連動橋接 ── -->
  <script src="../../unified_chem_spa/js/scroll_relay.js"></script>
  <script id="__chem_scroll_bridge">
  (function() {
    if (window.__chemScrollBridgeInstalled) return;
    window.__chemScrollBridgeInstalled = true;

    function getContainer() {
      return document.getElementById('slides-container') ||
             document.getElementById('presentation-area') ||
             document.getElementById('main-scroller') ||
             document.scrollingElement ||
             document.documentElement;
    }

    function getScrollPos() {
      var c = getContainer();
      var sy = (c && c.scrollTop !== undefined && c !== document.documentElement && c !== document.body)
               ? c.scrollTop
               : (window.scrollY || window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || (document.body && document.body.scrollTop) || 0);
      var sx = (c && c.scrollLeft !== undefined && c !== document.documentElement && c !== document.body)
               ? c.scrollLeft
               : (window.scrollX || window.pageXOffset || (document.documentElement && document.documentElement.scrollLeft) || (document.body && document.body.scrollLeft) || 0);
      return { sx: sx, sy: sy };
    }

    function reportScroll() {
      if (window.parent && window.parent !== window) {
        var pos = getScrollPos();
        window.parent.postMessage({ type: '__chem_scroll', sy: pos.sy, sx: pos.sx }, '*');
      }
    }

    window.__chemReportScroll = reportScroll;

    try {
      Object.defineProperty(window, 'scrollY', {
        get: function() { return getScrollPos().sy; },
        configurable: true
      });
      Object.defineProperty(window, 'pageYOffset', {
        get: function() { return getScrollPos().sy; },
        configurable: true
      });
    } catch (e) {}

    var c = getContainer();
    if (c) {
      c.addEventListener('scroll', reportScroll, { passive: true });
    }
    window.addEventListener('scroll', reportScroll, { capture: true, passive: true });
    document.addEventListener('scroll', reportScroll, { capture: true, passive: true });

    window.addEventListener('wheel', function() {
      requestAnimationFrame(reportScroll);
      setTimeout(reportScroll, 40);
      setTimeout(reportScroll, 120);
    }, { capture: true, passive: true });

    window.addEventListener('touchmove', function() {
      requestAnimationFrame(reportScroll);
      setTimeout(reportScroll, 40);
      setTimeout(reportScroll, 120);
    }, { capture: true, passive: true });

    window.addEventListener('keydown', function(e) {
      if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space', 'Home', 'End'].indexOf(e.code) !== -1) {
        requestAnimationFrame(reportScroll);
        setTimeout(reportScroll, 60);
        setTimeout(reportScroll, 180);
      }
    }, { passive: true });

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === '__chem_scroll_by') {
        var dy = e.data.deltaY || 0;
        var dx = e.data.deltaX || 0;
        var cont = getContainer();
        if (cont && cont !== document.documentElement && cont !== document.body) {
          cont.scrollBy({ top: dy, left: dx, behavior: 'instant' });
        } else {
          window.scrollBy({ top: dy, left: dx, behavior: 'instant' });
        }
        reportScroll();
      } else if (e.data.type === '__chem_get_scroll') {
        reportScroll();
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', reportScroll);
    } else {
      reportScroll();
    }
    window.addEventListener('load', reportScroll);
    setTimeout(reportScroll, 100);
    setTimeout(reportScroll, 400);
    setTimeout(reportScroll, 1000);
  })();
  </script>
</body>
</html>
