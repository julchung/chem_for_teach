<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.2vw, 24px);
      box-sizing: border-box;
      background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: clamp(1.3rem, 2vw, 1.85rem);
      font-weight: 800;
      color: #f8fafc;
    }
    .subtitle {
      font-size: clamp(0.85rem, 1.1vw, 0.95rem);
      color: #94a3b8;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(14px, 2vw, 22px);
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 960px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: clamp(16px, 2vw, 22px);
      border: 1px solid #334155;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .card-title {
      font-size: clamp(1.05rem, 1.3vw, 1.25rem);
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .info-card {
      background: rgba(56, 189, 248, 0.08);
      border-radius: 12px;
      padding: 14px;
      border-left: 4px solid #38bdf8;
      font-size: clamp(0.95rem, 1.1vw, 1.05rem);
      line-height: 1.7;
    }
    .formula-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-left: 5px solid #38bdf8;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 1.25rem;
      color: #38bdf8;
      font-weight: 700;
    }
    .highlight-box {
      background: rgba(251, 191, 36, 0.08);
      border-left: 4px solid #fbbf24;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fde68a;
      line-height: 1.7;
    }
    /* Original components CSS */
    
        :root {
            --bg-dark: #070a16;
            --text-main: #f0f4ff;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-cyan: #22d3ee;
            --accent-orange: #fb923c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; min-height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background-image:
                radial-gradient(circle at 15% 45%, rgba(192,132,252,0.06) 0%, transparent 55%),
                radial-gradient(circle at 85% 15%, rgba(96,165,250,0.06) 0%, transparent 55%),
                radial-gradient(rgba(96,165,250,0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px;
        }

        #app { position: relative; width: 100%; min-height: 100vh; overflow-x: hidden; display: block; }

        /* ── Start Overlay ── */
        #start-overlay { display: none !important; }
        .start-badge {
            font-size: 1rem; color: var(--accent-cyan);
            background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.3);
            padding: 0.35rem 1.4rem; border-radius: 40px; margin-bottom: 1.5rem;
            letter-spacing: 0.15em; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(34,211,238,0.15);
        }
        .start-title {
            font-size: clamp(2.5rem, 6vw, 4.8rem); font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 50%, var(--accent-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; margin-bottom: 0.6rem; line-height: 1.1;
            filter: drop-shadow(0 4px 15px rgba(192,132,252,0.15));
        }
        .start-sub { font-size: 1.35rem; color: rgba(240,244,255,0.6); margin-bottom: 3.2rem; text-align: center; }
        
        .start-atoms {
            position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden;
            z-index: 1;
        }
        .atom-float {
            position: absolute; border-radius: 50%;
            border: 1.5px solid rgba(192,132,252,0.22);
            animation: floatAtom linear infinite;
        }
        .atom-core-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            box-shadow: 0 0 20px var(--accent-purple);
        }
        .atom-orbit {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 50%;
        }
        .atom-electron-glow {
            position: absolute; border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: rotateElectron linear infinite;
        }

        @keyframes floatAtom {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            50%  { opacity: 0.7; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(360deg); opacity: 0.3; }
        }
        @keyframes rotateElectron {
            from { transform: rotate(0deg) translate(var(--dist)) rotate(0deg); }
            to { transform: rotate(360deg) translate(var(--dist)) rotate(-360deg); }
        }

        .btn-start {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; border: none; padding: 1.1rem 3.6rem;
            border-radius: 60px; font-size: 1.4rem; font-weight: 800;
            cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px rgba(192,132,252,0.4), 0 0 80px rgba(96,165,250,0.25);
            z-index: 10;
        }
        .btn-start:hover { transform: scale(1.08); box-shadow: 0 0 60px rgba(192,132,252,0.6), 0 0 120px rgba(96,165,250,0.4); }
        
        .start-info {
            margin-top: 2.5rem; display: flex; gap: 2.2rem; flex-wrap: wrap; justify-content: center; z-index: 10;
        }
        .info-chip {
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.95rem; color: rgba(240,244,255,0.55);
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            padding: 0.4rem 1.1rem; border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .info-chip span:first-child { font-size: 1.15rem; }

        /* ── Presentation Area (continuous scroll) ── */
        #presentation-area { position: relative; width: 100%; min-height: 100vh; overflow: visible; }
        #slides-container { position: relative; width: 100%; padding: 2vh 3vw 5vh 3vw; }

        .slide {
            position: relative; width: 100%; min-height: 90vh;
            padding: 1rem 0.5rem 2.5rem 0.5rem;
            opacity: 1; pointer-events: auto;
            display: flex; flex-direction: column; overflow: visible;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.07);
            margin-bottom: 2.5rem;
        }
        .slide.active { opacity: 1; pointer-events: auto; }

        h1 {
            color: var(--accent-blue); font-size: clamp(1.4rem, 2.5vw, 2.1rem);
            margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.7rem;
            border-bottom: 2px solid rgba(96,165,250,0.18); padding-bottom: 0.4rem; flex-shrink: 0;
            text-shadow: 0 0 10px rgba(96,165,250,0.25);
        }
        h1::before { content: ""; width: 7px; height: 26px; background: linear-gradient(var(--accent-blue), var(--accent-purple)); border-radius: 4px; }
        h2 { color: var(--accent-yellow); font-size: clamp(1.05rem, 1.5vw, 1.3rem); margin: 0.35rem 0; font-weight: 700; flex-shrink: 0; }
        h3 { color: var(--accent-cyan); font-size: clamp(0.95rem, 1.2vw, 1.1rem); margin: 0.25rem 0; font-weight: 600; }

        p, li { font-size: clamp(0.85rem, 1.2vw, 1.08rem); line-height: 1.55; margin-bottom: 0.35rem; }
        strong { color: var(--accent-cyan); font-weight: 700; }
        em { color: var(--accent-orange); font-style: normal; font-weight: 600; }
        ul { margin-left: 1.3rem; }
        li { margin-bottom: 0.25rem; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1.1rem; flex: 1; min-height: 0; overflow: hidden; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.9rem; flex: 1; min-height: 0; overflow: hidden; }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border);
            border-radius: 18px; padding: 1rem 1.1rem;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .formula-box {
            background: rgba(0,0,0,0.45); border-radius: 12px;
            border-left: 6px solid var(--accent-green);
            padding: 0.85rem; margin: 0.5rem 0;
            text-align: center; font-size: clamp(1.2rem, 1.8vw, 1.6rem);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        .info-card {
            background: rgba(96,165,250,0.07); border-radius: 12px;
            padding: 0.75rem 0.85rem; border: 1px solid rgba(96,165,250,0.22); margin: 0.4rem 0; flex-shrink: 0;
        }
        .highlight-box {
            background: rgba(251,191,36,0.07); border-radius: 12px;
            padding: 0.75rem 0.85rem; border: 1px solid rgba(251,191,36,0.28); margin: 0.4rem 0; flex-shrink: 0;
        }
        .svg-container { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
        .svg-container svg { max-height: 100%; max-width: 100%; }

        /* ── 範例題改為左右分欄；fadeIn 仍供其他互動（如鋸齒彈窗）使用 ── */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        
        .btn-action {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; border: none; padding: 0.7rem 1.7rem;
            border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 1rem;
            transition: 0.2s; align-self: center; margin-top: auto; flex-shrink: 0;
            box-shadow: 0 0 15px rgba(192,132,252,0.3);
        }
        .btn-action:hover { filter: brightness(1.15); transform: scale(1.05); }
        .btn-action-outline {
            background: transparent; color: var(--accent-blue);
            border: 1.5px solid var(--accent-blue);
            padding: 0.65rem 1.5rem; border-radius: 10px;
            cursor: pointer; font-weight: 700; font-size: 0.95rem; transition: 0.2s;
        }
        .btn-action-outline:hover { background: rgba(96,165,250,0.12); }

        /* ── Scrollable panel ── */
        .scroll-panel { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
        .scroll-panel::-webkit-scrollbar { width: 5px; }
        .scroll-panel::-webkit-scrollbar-track { background: transparent; }
        .scroll-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }

        /* ── Interactive 1: Successive IE Simulator ── */
        .sim-tab-container { display: flex; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
        .sim-tab {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(240, 244, 255, 0.6); padding: 0.5rem 1.2rem; border-radius: 8px;
            cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: 0.2s;
        }
        .sim-tab.active {
            background: rgba(96, 165, 250, 0.2); border-color: var(--accent-blue);
            color: #fff; box-shadow: 0 0 10px rgba(96,165,250,0.25);
        }
        .sim-atom-area { flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; position: relative; min-height: 200px; }
        .sim-btn-area { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-shrink: 0; }
        .sim-badge-alert {
            position: relative;
            margin-top: 8px;
            background: rgba(248, 113, 113, 0.2); border: 1px solid var(--accent-red);
            color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 700; animation: bounce 0.6s ease infinite alternate;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.3); display: none; z-index: 10;
            width: fit-content;
            align-self: center;
            text-align: center;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }


        /* ── Interactive 2: Sawtooth Chart ── */
        .chart-node { cursor: pointer; transition: r 0.2s, stroke-width 0.2s; }
        .chart-node:hover { r: 8px; stroke-width: 3px; stroke: #fff; }
        .chart-node-active { r: 9px; stroke-width: 4px; stroke: #fff; fill: var(--accent-yellow) !important; filter: drop-shadow(0 0 8px var(--accent-yellow)); }
        
        /* ── Interactive 3: Orbital Diagram ── */
        .orbital-box-wrapper { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
        .orbital-label { font-size: 0.95rem; font-weight: 700; width: 35px; color: var(--accent-cyan); }
        .orbital-subshell { display: flex; gap: 4px; }
        .orbital-box {
            width: 42px; height: 42px; border: 2.2px solid var(--glass-border);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); font-size: 1.6rem; font-weight: bold; position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }
        .orbital-box.stable { border-color: var(--accent-green); background: rgba(52,211,153,0.06); }
        .orbital-arrow {
            display: flex; align-items: center; justify-content: center;
            font-family: serif; color: var(--accent-yellow); font-size: 1.5rem; text-shadow: 0 0 5px rgba(251,191,36,0.5);
            line-height: 1;
        }
        .orbital-arrow.up { color: var(--accent-yellow); }
        .orbital-arrow.down { color: var(--accent-red); text-shadow: 0 0 5px rgba(248,113,113,0.5); }

        /* ── Interactive 5: Periodic Table ── */
        .pt-cell {
            border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700; transition: 0.2s; cursor: default; aspect-ratio: 1;
            position: relative; border: 1px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .pt-cell:hover { transform: scale(1.16); z-index: 10; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .pt-cell-sym { font-size: 0.88rem; font-weight: 900; }
        .pt-cell-num { font-size: 0.55rem; opacity: 0.45; position: absolute; top: 2px; left: 3px; }
        .pt-cell-val { font-size: 0.52rem; opacity: 0.85; margin-top: 1px; font-weight: normal; }

        /* ── 單元 4-6 核心通關檢核區塊 CSS ── */
        .quiz-container-full {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .quiz-scenario-box {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 14px;
            padding: 14px 18px;
        }
        .problem-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .quiz-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }
        @media (max-width: 700px) {
            .quiz-grid-layout { grid-template-columns: 1fr; }
        }
        .quiz-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .quiz-card:hover { border-color: rgba(56, 189, 248, 0.4); }
        .quiz-card.card-correct {
            border-color: rgba(52, 211, 153, 0.7) !important;
            box-shadow: 0 0 16px rgba(52, 211, 153, 0.15) !important;
        }
        .quiz-card.card-wrong {
            border-color: rgba(248, 113, 113, 0.7) !important;
            box-shadow: 0 0 16px rgba(248, 113, 113, 0.15) !important;
        }
        .quiz-q {
            font-size: 0.97rem;
            line-height: 1.55;
            color: #f8fafc;
            font-weight: 500;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .quiz-opt {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 9px 14px;
            color: #cbd5e1;
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.18s;
            line-height: 1.4;
        }
        .quiz-opt:hover { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.5); color: #f8fafc; }
        .quiz-opt.selected { background: rgba(56, 189, 248, 0.18); border-color: #38bdf8; color: #38bdf8; font-weight: 600; }
        .quiz-opt.verified-pass { background: rgba(52, 211, 153, 0.22) !important; border-color: #34d399 !important; color: #34d399 !important; font-weight: 700; }
        .quiz-opt.verified-fail { background: rgba(248, 113, 113, 0.22) !important; border-color: #f87171 !important; color: #f87171 !important; font-weight: 700; }

        .quiz-action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            flex-wrap: wrap;
        }
        .quiz-feedback-msg {
            flex: 1;
            min-width: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .quiz-feedback-msg.success {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .quiz-feedback-msg.fail {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .btn-submit-exam {
            flex-shrink: 0;
            padding: 10px 24px;
            background: linear-gradient(135deg, #38bdf8, #34d399);
            color: #0b1120;
            font-size: 0.97rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-submit-exam:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit-exam:disabled { opacity: 0.55; cursor: default; transform: none; }

        .btn-retry-exam {
            flex-shrink: 0;
            padding: 10px 22px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            font-size: 0.97rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }
        .btn-retry-exam:hover { opacity: 0.9; transform: translateY(-1px); }

        @keyframes ie-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ── 觀念配對連連看互動區 CSS ── */
        .match-game-wrapper {
            position: relative;
            width: 100%;

    function buildConfigTrendChart() {
        const svg = document.getElementById('config-trend-svg');
        if (!svg) return;
        svg.innerHTML = '';

        const configs = [
            { label: 'ns¹', val: 10, note: '' },
            { label: 'ns²', val: 28, note: '全滿 (高)' },
            { label: 'ns²np¹', val: 22, note: '' },
            { label: 'ns²np²', val: 38, note: '' },
            { label: 'ns²np³', val: 56, note: '半滿 (高)' },
            { label: 'ns²np⁴', val: 46, note: '' },
            { label: 'ns²np⁵', val: 65, note: '' },
            { label: 'ns²np⁶', val: 85, note: '全滿 (最高)' }
        ];

        const W = 400, H = 250;
        const L = 45, R = 15, T = 35, B = 45;
        const cW = W - L - R, cH = H - T - B;

        const xOf = i => L + (i / 7) * cW;
        const yOf = val => T + cH - (val / 100) * cH;
        const mk = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);

        // Draw axes
        const xAxis = mk('line');
        xAxis.setAttribute('x1', L); xAxis.setAttribute('y1', T + cH);
        xAxis.setAttribute('x2', W - R + 10); xAxis.setAttribute('y2', T + cH);
        xAxis.setAttribute('stroke', 'rgba(255,255,255,0.3)');
        svg.appendChild(xAxis);

        const yAxis = mk('line');
        yAxis.setAttribute('x1', L); yAxis.setAttribute('y1', T + cH);
        yAxis.setAttribute('x2', L); yAxis.setAttribute('y2', T - 10);
        yAxis.setAttribute('stroke', 'rgba(255,255,255,0.3)');
        svg.appendChild(yAxis);

        // Labels
        const yTitle = mk('text');
        yTitle.setAttribute('x', L); yTitle.setAttribute('y', T - 15);
        yTitle.setAttribute('fill', 'rgba(255,255,255,0.5)');
        yTitle.setAttribute('font-size', '11');
        yTitle.setAttribute('text-anchor', 'middle');
        yTitle.textContent = 'IE相對值';
        svg.appendChild(yTitle);

        // Path
        let d = '';
        configs.forEach((c, i) => {
            const x = xOf(i), y = yOf(c.val);
            d += (i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`);
        });
        const path = mk('path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'var(--accent-orange)');
        path.setAttribute('stroke-width', '2.5');
        svg.appendChild(path);

        // Points and texts
        configs.forEach((c, i) => {
            const x = xOf(i), y = yOf(c.val);
            
            // Dot
            const dot = mk('circle');
            dot.setAttribute('cx', x);
            dot.setAttribute('cy', y);
            dot.setAttribute('r', '4.5');
            dot.setAttribute('fill', 'var(--accent-yellow)');
            svg.appendChild(dot);

            // X Label
            const text = mk('text');
            text.setAttribute('x', x);
            text.setAttribute('y', T + cH + 20);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', 'rgba(255,255,255,0.7)');
            text.setAttribute('font-size', '12');
            text.textContent = c.label;
            svg.appendChild(text);

            // Note
            if (c.note) {
                const noteText = mk('text');
                noteText.setAttribute('x', x);
                noteText.setAttribute('y', y - 10);
                noteText.setAttribute('text-anchor', 'middle');
                noteText.setAttribute('fill', 'var(--accent-green)');
                noteText.setAttribute('font-size', '11');
                noteText.setAttribute('font-weight', 'bold');
                noteText.textContent = c.note;
                svg.appendChild(noteText);
                
                // highlight dot
                dot.setAttribute('r', '6');
                dot.setAttribute('fill', 'var(--accent-green)');
            }
        });
    }

        const L = 42, R = 15, T = 20, B = 35;
        const cW = W - L - R, cH = H - T - B;

        const xOf = Z => L + ((Z - 1) / 19) * cW;
        const yOf = ie => T + cH - (ie / 16000) * cH;
        const mk = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);

        // Draw Y grid lines
        [2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000].forEach(ie => {
            const y = yOf(ie);
            const line = mk('line');
            line.setAttribute('x1', L);
            line.setAttribute('y1', y);
            line.setAttribute('x2', W - R);
            line.setAttribute('y2', y);
            line.setAttribute('stroke', 'rgba(255,255,255,0.06)');
            line.setAttribute('stroke-width', '1');
            svg.appendChild(line);

            const text = mk('text');
            text.setAttribute('x', L - 5);
            text.setAttribute('y', y + 3);
            text.setAttribute('text-anchor', 'end');
            text.setAttribute('fill', 'rgba(255,255,255,0.4)');
            text.setAttribute('font-size', '9');
            text.textContent = ie;
            svg.appendChild(text);
        });
        
        // Draw Y axis title
        const yTitle = mk('text');
        yTitle.setAttribute('x', 12);
        yTitle.setAttribute('y', T - 5);
        yTitle.setAttribute('fill', 'rgba(255,255,255,0.5)');
        yTitle.setAttribute('font-size', '9');
        yTitle.textContent = 'kJ/mol';
        svg.appendChild(yTitle);

        // Draw X ticks and labels (symbols)
        successiveData.forEach(el => {
            const x = xOf(el.Z);
            const tick = mk('line');
            tick.setAttribute('x1', x);
            tick.setAttribute('y1', T + cH);
            tick.setAttribute('x2', x);
            tick.setAttribute('y2', T + cH + 4);
            tick.setAttribute('stroke', 'rgba(255,255,255,0.2)');
            svg.appendChild(tick);

            const text = mk('text');
            text.setAttribute('x', x);
            text.setAttribute('y', T + cH + 14);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', 'rgba(255,255,255,0.6)');
            text.setAttribute('font-size', '9.5');
            text.setAttribute('font-weight', 'bold');
            text.textContent = el.sym;
            svg.appendChild(text);
        });

        // Plot Lines (IE1: red, IE2: green, IE3: blue)
        const colors = ['#ef4444', '#10b981', '#3b82f6'];
        
        for (let ieIdx = 0; ieIdx < 3; ieIdx++) {
            let points = [];
            successiveData.forEach(el => {
                const val = el.ies[ieIdx];
                if (val !== null && val !== undefined) {
                    points.push({ x: xOf(el.Z), y: yOf(val), el: el });
                }
            });
            
            if (points.length >= 2) {
                let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
                for (let i = 1; i < points.length; i++) {
                    d += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
                }
                const path = mk('path');
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', colors[ieIdx]);
                path.setAttribute('stroke-width', '2');
                path.setAttribute('opacity', '0.7');
                svg.appendChild(path);
            }
        }

        // Interactive Dots
        successiveData.forEach(el => {
            el.ies.forEach((val, ieIdx) => {
                if (val === null || val === undefined) return;
                const cx = xOf(el.Z).toFixed(1);
                const cy = yOf(val).toFixed(1);
                const color = colors[ieIdx];

                // Outer glow circle (visible when selected)
                const glow = mk('circle');
                glow.setAttribute('cx', cx);
                glow.setAttribute('cy', cy);
                glow.setAttribute('r', '8');
                glow.setAttribute('fill', 'none');
                glow.setAttribute('stroke', color);
                glow.setAttribute('stroke-width', '2');
                glow.setAttribute('opacity', '0');
                glow.setAttribute('class', `three-ie-glow`);
                glow.id = `3ie-glow-${el.Z}-${ieIdx}`;
                svg.appendChild(glow);

                // Inner solid dot
                const dot = mk('circle');
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                dot.setAttribute('r', '4');
                dot.setAttribute('fill', color);
                dot.setAttribute('stroke', '#070a16');
                dot.setAttribute('stroke-width', '1.5');
                dot.setAttribute('cursor', 'pointer');
                dot.setAttribute('class', `three-ie-dot`);
                dot.id = `3ie-dot-${el.Z}-${ieIdx}`;
                
                // Hover effect (scale slightly)
                dot.addEventListener('mouseenter', () => {
                    dot.setAttribute('r', '5.5');
                });
                dot.addEventListener('mouseleave', () => {
                    const detailContent = document.getElementById('three-ie-detail-content');
                    const activeId = detailContent ? detailContent.dataset.activeId : null;
                    const thisId = `${el.Z}-${ieIdx}`;
                    if (activeId !== thisId) {
                        dot.setAttribute('r', '4');
                    }
                });

                // Click action
                dot.addEventListener('click', () => {
                    selectThreeIEPoint(el, ieIdx, color);
                });

                svg.appendChild(dot);
                
                // Transparent larger click area
                const hit = mk('circle');
                hit.setAttribute('cx', cx);
                hit.setAttribute('cy', cy);
                hit.setAttribute('r', '9');
                hit.setAttribute('fill', 'transparent');
                hit.setAttribute('cursor', 'pointer');
                hit.addEventListener('click', () => {
                    selectThreeIEPoint(el, ieIdx, color);
                });
                svg.appendChild(hit);
            });
        });
    }

    function selectThreeIEPoint(el, ieIdx, color) {
        // 1. Reset all glows and dot sizes
        document.querySelectorAll('.three-ie-glow').forEach(g => g.setAttribute('opacity', '0'));
        document.querySelectorAll('.three-ie-dot').forEach(d => d.setAttribute('r', '4'));

        // 2. Highlight selected dot & glow
        const activeGlow = document.getElementById(`3ie-glow-${el.Z}-${ieIdx}`);
        if (activeGlow) activeGlow.setAttribute('opacity', '1');
        const activeDot = document.getElementById(`3ie-dot-${el.Z}-${ieIdx}`);
        if (activeDot) activeDot.setAttribute('r', '5.5');

        // 3. Show details panel
        const defaultMsg = document.getElementById('three-ie-default-msg');
        const detailContent = document.getElementById('three-ie-detail-content');
        
        if (defaultMsg) defaultMsg.style.display = 'none';
        if (detailContent) {
            detailContent.style.display = 'flex';
            detailContent.dataset.activeId = `${el.Z}-${ieIdx}`;
        }

        const ieNames = ['第一游離能 (IE₁)', '第二游離能 (IE₂)', '第三游離能 (IE₃)'];
        const valenceLabels = [
            '中性原子 ➔ 單價陽離子',
            '單價陽離子 ➔ 雙價陽離子',
            '雙價陽離子 ➔ 三價陽離子'
        ];

        const stateFrom = el.sym + (ieIdx === 0 ? '' : ieIdx === 1 ? '⁺' : '²⁺');
        const stateTo = el.sym + (ieIdx === 0 ? '⁺' : ieIdx === 1 ? '²⁺' : '³⁺');
        const cfgFrom = el.configs[ieIdx];
        const cfgTo = el.configs[ieIdx + 1];
        
        const isJump = el.notes[ieIdx].includes('💥') || el.notes[ieIdx].includes('破壞');
        const jumpStyle = isJump 
            ? `background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; padding: 8px 10px; border-radius: 4px;`
            : `background: rgba(255, 255, 255, 0.03); border-left: 4px solid ${color}; padding: 8px 10px; border-radius: 4px;`;

        if (detailContent) {
            detailContent.innerHTML = `
                <!-- Block 1: Basic Info -->
                <div style="display:flex; flex-direction:column; min-width:140px; border-right:1px solid rgba(255,255,255,0.1); padding-right:16px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:1.5rem; font-weight:900; color:#fff;">${el.sym}</span>
                        <span style="font-size:0.85rem; font-weight:bold; color:${color}; padding:2px 6px; background:${color}22; border:1px solid ${color}44; border-radius:4px;">${ieNames[ieIdx].split(' ')[0]}</span>
                    </div>
                    <div style="font-size:1.6rem; font-weight:900; color:var(--accent-yellow); font-family:var(--font-mono); margin-top:4px;">
                        ${el.ies[ieIdx]} <span style="font-size:0.85rem; font-weight:normal; color:rgba(255,255,255,0.6);">kJ/mol</span>
                    </div>
                </div>

                <!-- Block 2: Equation & Config -->
                <div style="display:flex; flex-direction:column; min-width:180px; padding:0 8px; gap:8px;">
                    <div style="font-size:1.05rem; color:#fff; font-weight:bold; display:flex; align-items:center; gap:8px;">
                        <span style="color:${color};">${stateFrom}</span> ➔ <span style="color:var(--accent-yellow);">${stateTo} + e⁻</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.2); padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.05); width:fit-content;">
                        <span style="font-family:monospace; font-size:1.1rem; color:var(--accent-cyan); font-weight:bold;">${cfgFrom}</span>
                        <span style="color:rgba(255,255,255,0.3); font-size:1.1rem;">➔</span>
                        <span style="font-family:monospace; font-size:1.1rem; color:var(--accent-cyan); font-weight:bold;">${cfgTo}</span>
                    </div>
                </div>

                <!-- Block 3: Note -->
                <div style="${jumpStyle} flex:1; font-size:0.9rem; line-height:1.45; color:rgba(255,255,255,0.9); height:100%; display:flex; align-items:center;">
                    ${el.notes[ieIdx]}
                </div>
            `;
        }
    }

    
document.addEventListener('DOMContentLoaded', () => {
  if (typeof initThreeIEChart === 'function') initThreeIEChart();
});
</script>

</body>
</html>
