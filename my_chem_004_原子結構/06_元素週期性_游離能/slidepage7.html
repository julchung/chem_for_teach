<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-6 前40號元素第一游離能對照 | 高中化學</title>
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.2vw, 24px);
      box-sizing: border-box;
      background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: clamp(1.3rem, 2vw, 1.85rem);
      font-weight: 800;
      color: #f8fafc;
    }
    .subtitle {
      font-size: clamp(0.85rem, 1.1vw, 0.95rem);
      color: #94a3b8;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(14px, 2vw, 22px);
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 960px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: clamp(16px, 2vw, 22px);
      border: 1px solid #334155;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .card-title {
      font-size: clamp(1.05rem, 1.3vw, 1.25rem);
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .info-card {
      background: rgba(56, 189, 248, 0.08);
      border-radius: 12px;
      padding: 14px;
      border-left: 4px solid #38bdf8;
      font-size: clamp(0.95rem, 1.1vw, 1.05rem);
      line-height: 1.7;
    }
    .formula-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-left: 5px solid #38bdf8;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 1.25rem;
      color: #38bdf8;
      font-weight: 700;
    }
    .highlight-box {
      background: rgba(251, 191, 36, 0.08);
      border-left: 4px solid #fbbf24;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fde68a;
      line-height: 1.7;
    }
    /* Original components CSS */
    
        :root {
            --bg-dark: #070a16;
            --text-main: #f0f4ff;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-cyan: #22d3ee;
            --accent-orange: #fb923c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; min-height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background-image:
                radial-gradient(circle at 15% 45%, rgba(192,132,252,0.06) 0%, transparent 55%),
                radial-gradient(circle at 85% 15%, rgba(96,165,250,0.06) 0%, transparent 55%),
                radial-gradient(rgba(96,165,250,0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px;
        }

        #app { position: relative; width: 100%; min-height: 100vh; overflow-x: hidden; display: block; }

        /* ── Start Overlay ── */
        #start-overlay { display: none !important; }
        .start-badge {
            font-size: 1rem; color: var(--accent-cyan);
            background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.3);
            padding: 0.35rem 1.4rem; border-radius: 40px; margin-bottom: 1.5rem;
            letter-spacing: 0.15em; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(34,211,238,0.15);
        }
        .start-title {
            font-size: clamp(2.5rem, 6vw, 4.8rem); font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 50%, var(--accent-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; margin-bottom: 0.6rem; line-height: 1.1;
            filter: drop-shadow(0 4px 15px rgba(192,132,252,0.15));
        }
        .start-sub { font-size: 1.35rem; color: rgba(240,244,255,0.6); margin-bottom: 3.2rem; text-align: center; }
        
        .start-atoms {
            position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden;
            z-index: 1;
        }
        .atom-float {
            position: absolute; border-radius: 50%;
            border: 1.5px solid rgba(192,132,252,0.22);
            animation: floatAtom linear infinite;
        }
        .atom-core-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            box-shadow: 0 0 20px var(--accent-purple);
        }
        .atom-orbit {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 50%;
        }
        .atom-electron-glow {
            position: absolute; border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: rotateElectron linear infinite;
        }

        @keyframes floatAtom {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
            50%  { opacity: 0.7; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(360deg); opacity: 0.3; }
        }
        @keyframes rotateElectron {
            from { transform: rotate(0deg) translate(var(--dist)) rotate(0deg); }
            to { transform: rotate(360deg) translate(var(--dist)) rotate(-360deg); }
        }

        .btn-start {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; border: none; padding: 1.1rem 3.6rem;
            border-radius: 60px; font-size: 1.4rem; font-weight: 800;
            cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px rgba(192,132,252,0.4), 0 0 80px rgba(96,165,250,0.25);
            z-index: 10;
        }
        .btn-start:hover { transform: scale(1.08); box-shadow: 0 0 60px rgba(192,132,252,0.6), 0 0 120px rgba(96,165,250,0.4); }
        
        .start-info {
            margin-top: 2.5rem; display: flex; gap: 2.2rem; flex-wrap: wrap; justify-content: center; z-index: 10;
        }
        .info-chip {
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.95rem; color: rgba(240,244,255,0.55);
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            padding: 0.4rem 1.1rem; border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .info-chip span:first-child { font-size: 1.15rem; }

        /* ── Presentation Area (continuous scroll) ── */
        #presentation-area { position: relative; width: 100%; min-height: 100vh; overflow: visible; }
        #slides-container { position: relative; width: 100%; padding: 2vh 3vw 5vh 3vw; }

        .slide {
            position: relative; width: 100%; min-height: 90vh;
            padding: 1rem 0.5rem 2.5rem 0.5rem;
            opacity: 1; pointer-events: auto;
            display: flex; flex-direction: column; overflow: visible;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.07);
            margin-bottom: 2.5rem;
        }
        .slide.active { opacity: 1; pointer-events: auto; }

        h1 {
            color: var(--accent-blue); font-size: clamp(1.4rem, 2.5vw, 2.1rem);
            margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.7rem;
            border-bottom: 2px solid rgba(96,165,250,0.18); padding-bottom: 0.4rem; flex-shrink: 0;
            text-shadow: 0 0 10px rgba(96,165,250,0.25);
        }
        h1::before { content: ""; width: 7px; height: 26px; background: linear-gradient(var(--accent-blue), var(--accent-purple)); border-radius: 4px; }
        h2 { color: var(--accent-yellow); font-size: clamp(1.05rem, 1.5vw, 1.3rem); margin: 0.35rem 0; font-weight: 700; flex-shrink: 0; }
        h3 { color: var(--accent-cyan); font-size: clamp(0.95rem, 1.2vw, 1.1rem); margin: 0.25rem 0; font-weight: 600; }

        p, li { font-size: clamp(0.85rem, 1.2vw, 1.08rem); line-height: 1.55; margin-bottom: 0.35rem; }
        strong { color: var(--accent-cyan); font-weight: 700; }
        em { color: var(--accent-orange); font-style: normal; font-weight: 600; }
        ul { margin-left: 1.3rem; }
        li { margin-bottom: 0.25rem; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1.1rem; flex: 1; min-height: 0; overflow: hidden; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.9rem; flex: 1; min-height: 0; overflow: hidden; }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border);
            border-radius: 18px; padding: 1rem 1.1rem;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .formula-box {
            background: rgba(0,0,0,0.45); border-radius: 12px;
            border-left: 6px solid var(--accent-green);
            padding: 0.85rem; margin: 0.5rem 0;
            text-align: center; font-size: clamp(1.2rem, 1.8vw, 1.6rem);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        .info-card {
            background: rgba(96,165,250,0.07); border-radius: 12px;
            padding: 0.75rem 0.85rem; border: 1px solid rgba(96,165,250,0.22); margin: 0.4rem 0; flex-shrink: 0;
        }
        .highlight-box {
            background: rgba(251,191,36,0.07); border-radius: 12px;
            padding: 0.75rem 0.85rem; border: 1px solid rgba(251,191,36,0.28); margin: 0.4rem 0; flex-shrink: 0;
        }
        .svg-container { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
        .svg-container svg { max-height: 100%; max-width: 100%; }

        /* ── 範例題改為左右分欄；fadeIn 仍供其他互動（如鋸齒彈窗）使用 ── */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        
        .btn-action {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; border: none; padding: 0.7rem 1.7rem;
            border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 1rem;
            transition: 0.2s; align-self: center; margin-top: auto; flex-shrink: 0;
            box-shadow: 0 0 15px rgba(192,132,252,0.3);
        }
        .btn-action:hover { filter: brightness(1.15); transform: scale(1.05); }
        .btn-action-outline {
            background: transparent; color: var(--accent-blue);
            border: 1.5px solid var(--accent-blue);
            padding: 0.65rem 1.5rem; border-radius: 10px;
            cursor: pointer; font-weight: 700; font-size: 0.95rem; transition: 0.2s;
        }
        .btn-action-outline:hover { background: rgba(96,165,250,0.12); }

        /* ── Scrollable panel ── */
        .scroll-panel { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
        .scroll-panel::-webkit-scrollbar { width: 5px; }
        .scroll-panel::-webkit-scrollbar-track { background: transparent; }
        .scroll-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }

        /* ── Interactive 1: Successive IE Simulator ── */
        .sim-tab-container { display: flex; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
        .sim-tab {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(240, 244, 255, 0.6); padding: 0.5rem 1.2rem; border-radius: 8px;
            cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: 0.2s;
        }
        .sim-tab.active {
            background: rgba(96, 165, 250, 0.2); border-color: var(--accent-blue);
            color: #fff; box-shadow: 0 0 10px rgba(96,165,250,0.25);
        }
        .sim-atom-area { flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; position: relative; min-height: 200px; }
        .sim-btn-area { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-shrink: 0; }
        .sim-badge-alert {
            position: relative;
            margin-top: 8px;
            background: rgba(248, 113, 113, 0.2); border: 1px solid var(--accent-red);
            color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;
            font-weight: 700; animation: bounce 0.6s ease infinite alternate;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.3); display: none; z-index: 10;
            width: fit-content;
            align-self: center;
            text-align: center;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }


        /* ── Interactive 2: Sawtooth Chart ── */
        .chart-node { cursor: pointer; transition: r 0.2s, stroke-width 0.2s; }
        .chart-node:hover { r: 8px; stroke-width: 3px; stroke: #fff; }
        .chart-node-active { r: 9px; stroke-width: 4px; stroke: #fff; fill: var(--accent-yellow) !important; filter: drop-shadow(0 0 8px var(--accent-yellow)); }
        
        /* ── Interactive 3: Orbital Diagram ── */
        .orbital-box-wrapper { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
        .orbital-label { font-size: 0.95rem; font-weight: 700; width: 35px; color: var(--accent-cyan); }
        .orbital-subshell { display: flex; gap: 4px; }
        .orbital-box {
            width: 42px; height: 42px; border: 2.2px solid var(--glass-border);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); font-size: 1.6rem; font-weight: bold; position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }
        .orbital-box.stable { border-color: var(--accent-green); background: rgba(52,211,153,0.06); }
        .orbital-arrow {
            display: flex; align-items: center; justify-content: center;
            font-family: serif; color: var(--accent-yellow); font-size: 1.5rem; text-shadow: 0 0 5px rgba(251,191,36,0.5);
            line-height: 1;
        }
        .orbital-arrow.up { color: var(--accent-yellow); }
        .orbital-arrow.down { color: var(--accent-red); text-shadow: 0 0 5px rgba(248,113,113,0.5); }

        /* ── Interactive 5: Periodic Table ── */
        .pt-cell {
            border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700; transition: 0.2s; cursor: default; aspect-ratio: 1;
            position: relative; border: 1px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .pt-cell:hover { transform: scale(1.16); z-index: 10; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .pt-cell-sym { font-size: 0.88rem; font-weight: 900; }
        .pt-cell-num { font-size: 0.55rem; opacity: 0.45; position: absolute; top: 2px; left: 3px; }
        .pt-cell-val { font-size: 0.52rem; opacity: 0.85; margin-top: 1px; font-weight: normal; }

        /* ── 單元 4-6 核心通關檢核區塊 CSS ── */
        .quiz-container-full {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .quiz-scenario-box {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 14px;
            padding: 14px 18px;
        }
        .problem-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .quiz-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }
        @media (max-width: 700px) {
            .quiz-grid-layout { grid-template-columns: 1fr; }
        }
        .quiz-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .quiz-card:hover { border-color: rgba(56, 189, 248, 0.4); }
        .quiz-card.card-correct {
            border-color: rgba(52, 211, 153, 0.7) !important;
            box-shadow: 0 0 16px rgba(52, 211, 153, 0.15) !important;
        }
        .quiz-card.card-wrong {
            border-color: rgba(248, 113, 113, 0.7) !important;
            box-shadow: 0 0 16px rgba(248, 113, 113, 0.15) !important;
        }
        .quiz-q {
            font-size: 0.97rem;
            line-height: 1.55;
            color: #f8fafc;
            font-weight: 500;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .quiz-opt {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 9px 14px;
            color: #cbd5e1;
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.18s;
            line-height: 1.4;
        }
        .quiz-opt:hover { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.5); color: #f8fafc; }
        .quiz-opt.selected { background: rgba(56, 189, 248, 0.18); border-color: #38bdf8; color: #38bdf8; font-weight: 600; }
        .quiz-opt.verified-pass { background: rgba(52, 211, 153, 0.22) !important; border-color: #34d399 !important; color: #34d399 !important; font-weight: 700; }
        .quiz-opt.verified-fail { background: rgba(248, 113, 113, 0.22) !important; border-color: #f87171 !important; color: #f87171 !important; font-weight: 700; }

        .quiz-action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            flex-wrap: wrap;
        }
        .quiz-feedback-msg {
            flex: 1;
            min-width: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .quiz-feedback-msg.success {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .quiz-feedback-msg.fail {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .btn-submit-exam {
            flex-shrink: 0;
            padding: 10px 24px;
            background: linear-gradient(135deg, #38bdf8, #34d399);
            color: #0b1120;
            font-size: 0.97rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-submit-exam:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit-exam:disabled { opacity: 0.55; cursor: default; transform: none; }

        .btn-retry-exam {
            flex-shrink: 0;
            padding: 10px 22px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            font-size: 0.97rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }
        .btn-retry-exam:hover { opacity: 0.9; transform: translateY(-1px); }

        @keyframes ie-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ── 觀念配對連連看互動區 CSS ── */
        .match-game-wrapper {
            position: relative;
            width: 100%;
            margin-top: 8px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: visible;
        }
        .match-game-cols {
            display: flex;
            justify-content: space-between;
            position: relative;
            gap: 28px;
            z-index: 2;
        }
        .match-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 44%;
        }
        .match-item {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 9px 14px;
            display: flex;

            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.22);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }
        .match-item.connected {
            border-color: rgba(56, 189, 248, 0.65);
            background: rgba(56, 189, 248, 0.12);
        }
        .match-item.match-correct {
            border-color: #34d399 !important;
            background: rgba(52, 211, 153, 0.18) !important;
            color: #6ee7b7 !important;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.3) !important;
        }
        .match-item.match-wrong {
            border-color: #f87171 !important;
            background: rgba(248, 113, 113, 0.18) !important;
            color: #fca5a5 !important;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.3) !important;
        }
        .match-item-text {
            flex: 1;
            pointer-events: none;
        }
        .match-item-badge {
            font-size: 0.9rem;
            font-weight: 800;
            margin: 0 4px;
            pointer-events: none;
        }
        .match-dot {
            width: 16px;
            height: 16px;
            background: #38bdf8;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;

            transform: translateY(-50%);
            transition: all 0.2s;
            z-index: 5;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }
        .match-item[data-side="left"] .match-dot {
            right: -8px;
        }
        .match-item[data-side="right"] .match-dot {
            left: -8px;

        .match-dot.active {
            transform: translateY(-50%) scale(1.3);
            background: #fbbf24;
            box-shadow: 0 0 12px #fbbf24;
        }
        .match-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;

        /* ── Input sliders ── */
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 5px;
            border-radius: 3px; background: rgba(255,255,255,0.15); outline: none; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: var(--accent-blue);
            box-shadow: 0 0 10px rgba(96,165,250,0.7); cursor: pointer;

        /* ── Tags ── */

            display: inline-block; padding: 0.15rem 0.6rem; border-radius: 20px;
            font-size: 0.78rem; font-weight: 700; margin: 0.15rem;

        .tag-blue { background: rgba(96,165,250,0.16); border: 1px solid rgba(96,165,250,0.4); color: var(--accent-blue); }
        .tag-green { background: rgba(52,211,153,0.14); border: 1px solid rgba(52,211,153,0.35); color: var(--accent-green); }
        .tag-red { background: rgba(248,113,113,0.14); border: 1px solid rgba(248,113,113,0.35); color: var(--accent-red); }
        .tag-yellow { background: rgba(251,191,36,0.14); border: 1px solid rgba(251,191,36,0.35); color: var(--accent-yellow); }
        .tag-purple { background: rgba(192,132,252,0.14); border: 1px solid rgba(192,132,252,0.35); color: var(--accent-purple); }

<body>
  <div class="header-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="badge">概念 07</span>
      <h1>前40號元素第一游離能對照</h1>
    </div>
    <div class="subtitle">原子序 1–40 週期表網格點選與折線圖即時交叉對比</div>
  </div>

  
<div style="display: flex; gap: 14px; flex: 1; min-height: 0;">
  <!-- 左側：互動週期表 -->
  <div class="card" style="flex: 0 0 54%; display: flex; flex-direction: column;">
    <div class="card-title">🗺️ 週期表元素選取 (Z = 1–40)</div>
    <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">
      點擊任一元素，即時於右側折線圖聯動高亮對應數值與電子組態：
    </div>
    <div id="ptable-cross-grid" style="display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; flex: 1; align-content: start;">
      <!-- JS 生成週期表方格 -->
    </div>
  </div>

  <!-- 右側：折線圖 -->
  <div class="card" style="flex: 1; display: flex; flex-direction: column;">
    <div class="card-title">📈 前 40 號元素第一游離能折線走勢</div>
    <div style="flex: 1; min-height: 280px; position: relative; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); padding: 8px;">
      <svg id="ie-line-svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid meet" style="width:100%; height:100%; display:block; overflow:visible;"></svg>
    </div>
  </div>
</div>


  <script src="../../unified_chem_spa/js/scroll_relay.js"></script>
  
<script>
// ═══════════════ 互動組件 5: 週期表 + 折線圖 跨元件對照 (Z = 1–40) ═══════════════
    const crossIEData = [
        {Z:1,  sym:'H',  period:1, group:1,  val:1312, cfg:'1s¹'},
        {Z:2,  sym:'He', period:1, group:18, val:2372, cfg:'1s²'},
        {Z:3,  sym:'Li', period:2, group:1,  val:520,  cfg:'[He]2s¹'},
        {Z:4,  sym:'Be', period:2, group:2,  val:900,  cfg:'[He]2s²'},
        {Z:5,  sym:'B',  period:2, group:13, val:801,  cfg:'[He]2s²2p¹'},
        {Z:6,  sym:'C',  period:2, group:14, val:1086, cfg:'[He]2s²2p²'},
        {Z:7,  sym:'N',  period:2, group:15, val:1402, cfg:'[He]2s²2p³'},
        {Z:8,  sym:'O',  period:2, group:16, val:1314, cfg:'[He]2s²2p⁴'},
        {Z:9,  sym:'F',  period:2, group:17, val:1681, cfg:'[He]2s²2p⁵'},
        {Z:10, sym:'Ne', period:2, group:18, val:2081, cfg:'[He]2s²2p⁶'},
        {Z:11, sym:'Na', period:3, group:1,  val:496,  cfg:'[Ne]3s¹'},
        {Z:12, sym:'Mg', period:3, group:2,  val:738,  cfg:'[Ne]3s²'},
        {Z:13, sym:'Al', period:3, group:13, val:578,  cfg:'[Ne]3s²3p¹'},
        {Z:14, sym:'Si', period:3, group:14, val:786,  cfg:'[Ne]3s²3p²'},
        {Z:15, sym:'P',  period:3, group:15, val:1012, cfg:'[Ne]3s²3p³'},
        {Z:16, sym:'S',  period:3, group:16, val:1000, cfg:'[Ne]3s²3p⁴'},
        {Z:17, sym:'Cl', period:3, group:17, val:1251, cfg:'[Ne]3s²3p⁵'},
        {Z:18, sym:'Ar', period:3, group:18, val:1521, cfg:'[Ne]3s²3p⁶'},
        {Z:19, sym:'K',  period:4, group:1,  val:419,  cfg:'[Ar]4s¹'},
        {Z:20, sym:'Ca', period:4, group:2,  val:590,  cfg:'[Ar]4s²'},
        {Z:21, sym:'Sc', period:4, group:3,  val:633,  cfg:'[Ar]3d¹4s²'},
        {Z:22, sym:'Ti', period:4, group:4,  val:659,  cfg:'[Ar]3d²4s²'},
        {Z:23, sym:'V',  period:4, group:5,  val:651,  cfg:'[Ar]3d³4s²'},
        {Z:24, sym:'Cr', period:4, group:6,  val:653,  cfg:'[Ar]3d⁵4s¹'},
        {Z:25, sym:'Mn', period:4, group:7,  val:717,  cfg:'[Ar]3d⁵4s²'},
        {Z:26, sym:'Fe', period:4, group:8,  val:762,  cfg:'[Ar]3d⁶4s²'},
        {Z:27, sym:'Co', period:4, group:9,  val:760,  cfg:'[Ar]3d⁷4s²'},
        {Z:28, sym:'Ni', period:4, group:10, val:737,  cfg:'[Ar]3d⁸4s²'},
        {Z:29, sym:'Cu', period:4, group:11, val:745,  cfg:'[Ar]3d¹⁰4s¹'},
        {Z:30, sym:'Zn', period:4, group:12, val:906,  cfg:'[Ar]3d¹⁰4s²'},
        {Z:31, sym:'Ga', period:4, group:13, val:579,  cfg:'[Ar]3d¹⁰4s²4p¹'},
        {Z:32, sym:'Ge', period:4, group:14, val:762,  cfg:'[Ar]3d¹⁰4s²4p²'},
        {Z:33, sym:'As', period:4, group:15, val:947,  cfg:'[Ar]3d¹⁰4s²4p³'},
        {Z:34, sym:'Se', period:4, group:16, val:941,  cfg:'[Ar]3d¹⁰4s²4p⁴'},
        {Z:35, sym:'Br', period:4, group:17, val:1140, cfg:'[Ar]3d¹⁰4s²4p⁵'},
        {Z:36, sym:'Kr', period:4, group:18, val:1351, cfg:'[Ar]3d¹⁰4s²4p⁶'},
        {Z:37, sym:'Rb', period:5, group:1,  val:403,  cfg:'[Kr]5s¹'},
        {Z:38, sym:'Sr', period:5, group:2,  val:550,  cfg:'[Kr]5s²'},
        {Z:39, sym:'Y',  period:5, group:3,  val:600,  cfg:'[Kr]4d¹5s²'},
        {Z:40, sym:'Zr', period:5, group:4,  val:640,  cfg:'[Kr]4d²5s²'},
    ];

    const crossPeriodColors = {1:'#22d3ee', 2:'#c084fc', 3:'#60a5fa', 4:'#34d399', 5:'#fb923c'};
    let crossHighlightZ = null;

    function highlightElement(Z, color) {
        if (crossHighlightZ === Z) return;
        clearHighlight();
        crossHighlightZ = Z;

        // Glow PT cell
        const ptCell = document.getElementById(`ptc-${Z}`);
        if (ptCell) {
            ptCell.style.transform = 'scale(1.4)';
            ptCell.style.zIndex = '25';
            ptCell.style.boxShadow = `0 0 16px ${color}, 0 0 6px rgba(255,255,255,0.5)`;
            ptCell.style.borderColor = 'rgba(255,255,255,0.95)';
        }

        // Glow chart dot
        const dot = document.getElementById(`chd-${Z}`);
        if (dot) {
            dot.setAttribute('r', '7');
            dot.setAttribute('stroke', '#ffffff');
            dot.setAttribute('stroke-width', '2');
            dot.style.filter = `drop-shadow(0 0 6px ${color})`;
        }

        // Info bar
        const el = crossIEData.find(e => e.Z === Z);
        if (el) {
            const bar = document.getElementById('cross-info-bar');
            const txt = document.getElementById('cross-info-text');
            if (bar) { bar.style.borderColor = color; bar.style.background = `rgba(0,0,0,0.5)`; }
            if (txt) txt.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:4px; align-items:center; width:100%;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <strong style="color:${color}; font-size:1.6rem; text-shadow:0 0 6px ${color};">${el.sym}</strong>
                        <span style="color:rgba(255,255,255,0.6); font-size:1.1rem;">(Z = ${el.Z})</span>
                        <span style="padding:2px 8px; background:rgba(255,255,255,0.1); border-radius:4px; color:rgba(255,255,255,0.8); font-size:0.95rem;">第 ${el.period} 週期 · 第 ${el.group} 族</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px; font-size:1.1rem;">
                        <span>電子組態: <span style="font-family:monospace; color:var(--accent-cyan); font-size:1.2rem;">${el.cfg}</span></span>
                        <span style="color:rgba(255,255,255,0.4);">|</span>
                        <span>第一游離能: <strong style="color:var(--accent-yellow); font-size:1.35rem;">${el.val} <span style="font-size:0.95rem; font-weight:normal;">kJ/mol</span></strong></span>
                    </div>
                </div>
            `;
        }
    }

    function clearHighlight() {
        if (crossHighlightZ !== null) {
            const ptCell = document.getElementById(`ptc-${crossHighlightZ}`);
            if (ptCell) {
                ptCell.style.transform = '';
                ptCell.style.zIndex = '';
                ptCell.style.boxShadow = '';
                ptCell.style.borderColor = ptCell.dataset.origBorder || '';
            }
            const dot = document.getElementById(`chd-${crossHighlightZ}`);
            if (dot) {
                dot.setAttribute('r', '4');
                dot.setAttribute('stroke', '#070a16');
                dot.setAttribute('stroke-width', '1.5');
                dot.style.filter = '';
            }
            crossHighlightZ = null;
        }
        const bar = document.getElementById('cross-info-bar');
        const txt = document.getElementById('cross-info-text');
        if (bar) { bar.style.borderColor = ''; bar.style.background = ''; }
        if (txt) { txt.innerHTML = '<div style="font-size:1.15rem; line-height:1.5;">💡 移動滑鼠至週期表或折線圖上的任一元素<br><span style="font-size:0.95rem; color:rgba(255,255,255,0.3);">兩者將同步發亮對照，並在此顯示詳細數據</span></div>'; txt.style.color = 'rgba(255,255,255,0.38)'; }
    }

    let ptableInited = false;
    function initPTable() {
        if (ptableInited) return;
        ptableInited = true;

        const minIE = 403, maxIE = 2372;

        // Period × Group lookup
        const lookup = {};
        crossIEData.forEach(el => {
            if (!lookup[el.period]) lookup[el.period] = {};
            lookup[el.period][el.group] = el;
        });

        // ── Periodic Table Grid (5 rows × 18 columns) ──────────────────
        const grid = document.getElementById('ptable-cross-grid');
        grid.innerHTML = '';

        for (let period = 1; period <= 5; period++) {
            for (let group = 1; group <= 18; group++) {
                const div = document.createElement('div');
                const el = lookup[period] && lookup[period][group];

                if (el) {
                    const frac = (el.val - minIE) / (maxIE - minIE);
                    const pColor = crossPeriodColors[el.period];
                    const r = Math.round(210 * frac + 25);
                    const g = Math.round(55 * (1 - Math.abs(frac - 0.5) * 2));
                    const b = Math.round(225 * (1 - frac) + 30);
                    const bg = `rgba(${r},${g},${b},0.55)`;
                    const border = `rgba(${r},${g},${b},0.9)`;

                    div.id = `ptc-${el.Z}`;
                    div.dataset.origBorder = border;
                    div.style.cssText = `
                        border-radius:5px; display:flex; flex-direction:column;
                        align-items:center; justify-content:center; aspect-ratio:1;
                        background:${bg}; border:1.5px solid ${border};
                        cursor:pointer; position:relative; overflow:hidden;
                        transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
                    `;
                    div.innerHTML = `
                        <span style="font-size:clamp(0.34rem,0.65vw,0.48rem); opacity:0.5; position:absolute; top:1px; left:2px; line-height:1;">${el.Z}</span>
                        <span style="font-size:clamp(0.56rem,1.05vw,0.82rem); font-weight:900; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.7); line-height:1.1;">${el.sym}</span>
                        <span style="font-size:clamp(0.28rem,0.52vw,0.42rem); color:rgba(255,255,255,0.65); margin-top:1px; font-weight:600;">${el.val}</span>
                    `;
                    div.addEventListener('mouseenter', () => highlightElement(el.Z, pColor));
                    div.addEventListener('mouseleave', clearHighlight);
                } else {
                    div.style.cssText = 'aspect-ratio:1; background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.04); border-radius:4px;';
                }
                grid.appendChild(div);
            }
        }

        // ── IE Line Chart SVG ───────────────────────────────────────────
        buildIELineChart();
    }

    function buildIELineChart() {
        const svg = document.getElementById('ie-line-svg');
        svg.innerHTML = '';

        // 適合右側較窄較高面板的尺寸
        const W = 400, H = 280;
        const L = 38, R = 8, T = 14, B = 30;
        const cW = W - L - R, cH = H - T - B;

        const xOf = Z  => L + ((Z - 1) / 39) * cW;
        const yOf = ie => T + cH - (ie / 2500) * cH;
        const mk  = tag => document.createElementNS('http://www.w3.org/2000/svg', tag);

        // Horizontal grid lines + Y labels
        [500, 1000, 1500, 2000, 2500].forEach(ie => {
            const y = yOf(ie);
            const gl = mk('line');
            gl.setAttribute('x1', L); gl.setAttribute('y1', y);
            gl.setAttribute('x2', W-R); gl.setAttribute('y2', y);
            gl.setAttribute('stroke', 'rgba(255,255,255,0.07)'); gl.setAttribute('stroke-width', '1');
            svg.appendChild(gl);
            const t = mk('text');
            t.setAttribute('x', L-4); t.setAttribute('y', y+3);
            t.setAttribute('text-anchor', 'end');
            t.setAttribute('fill', 'rgba(255,255,255,0.4)'); t.setAttribute('font-size', '9');
            t.textContent = ie;
            svg.appendChild(t);
        });

        // Y-axis title
        const yTtl = mk('text');
        yTtl.setAttribute('x', 8); yTtl.setAttribute('y', T + cH/2);
        yTtl.setAttribute('text-anchor', 'middle');
        yTtl.setAttribute('fill', 'rgba(255,255,255,0.35)'); yTtl.setAttribute('font-size', '9');
        yTtl.setAttribute('transform', `rotate(-90 8 ${T + cH/2})`);
        yTtl.textContent = 'kJ/mol';
        svg.appendChild(yTtl);

        // Period shaded bands & labels
        const periodDefs = [
            {start:1,  end:2,  color:'#22d3ee', label:'第1週期'},
            {start:3,  end:10, color:'#c084fc', label:'第2週期'},
            {start:11, end:18, color:'#60a5fa', label:'第3週期'},
            {start:19, end:36, color:'#34d399', label:'第4週期'},
            {start:37, end:40, color:'#fb923c', label:'第5週期'},
        ];
        periodDefs.forEach(p => {
            const x1 = xOf(p.start - 0.42), x2 = xOf(p.end + 0.42);
            const band = mk('rect');
            band.setAttribute('x', x1); band.setAttribute('y', T);
            band.setAttribute('width', x2-x1); band.setAttribute('height', cH);
            band.setAttribute('fill', p.color); band.setAttribute('opacity', '0.055');
            svg.appendChild(band);
            const lbl = mk('text');
            lbl.setAttribute('x', (x1+x2)/2); lbl.setAttribute('y', T+cH+20);
            lbl.setAttribute('text-anchor', 'middle');
            lbl.setAttribute('fill', p.color); lbl.setAttribute('font-size', '7.5');
            lbl.setAttribute('font-weight', '700'); lbl.setAttribute('opacity', '0.88');
            lbl.textContent = p.label;
            svg.appendChild(lbl);
        });

        // Period boundary dashes
        [2.5, 10.5, 18.5, 36.5].forEach(z => {
            const vl = mk('line');
            vl.setAttribute('x1', xOf(z)); vl.setAttribute('y1', T);
            vl.setAttribute('x2', xOf(z)); vl.setAttribute('y2', T+cH);
            vl.setAttribute('stroke', 'rgba(255,255,255,0.18)');
            vl.setAttribute('stroke-width', '1'); vl.setAttribute('stroke-dasharray', '3,2');
            svg.appendChild(vl);
        });

        // X-axis ticks & labels (every 5)
        for (let Z = 5; Z <= 40; Z += 5) {
            const x = xOf(Z);
            const tk = mk('line');
            tk.setAttribute('x1', x); tk.setAttribute('y1', T+cH);
            tk.setAttribute('x2', x); tk.setAttribute('y2', T+cH+5);
            tk.setAttribute('stroke', 'rgba(255,255,255,0.3)'); tk.setAttribute('stroke-width', '1');
            svg.appendChild(tk);
            const xt = mk('text');
            xt.setAttribute('x', x); xt.setAttribute('y', T+cH+13);
            xt.setAttribute('text-anchor', 'middle');
            xt.setAttribute('fill', 'rgba(255,255,255,0.45)'); xt.setAttribute('font-size', '9');
            xt.textContent = Z;
            svg.appendChild(xt);
        }

        // X-axis title
        const xLbl = mk('text');
        xLbl.setAttribute('x', L+cW/2); xLbl.setAttribute('y', H-1);
        xLbl.setAttribute('text-anchor', 'middle');
        xLbl.setAttribute('fill', 'rgba(255,255,255,0.35)'); xLbl.setAttribute('font-size', '9');
        xLbl.textContent = '原子序 Z';
        svg.appendChild(xLbl);

        // Period-colored line segments
        periodDefs.forEach(p => {
            const els = crossIEData.filter(e => e.Z >= p.start && e.Z <= p.end).sort((a,b) => a.Z - b.Z);
            if (els.length < 2) return;
            let d = `M ${xOf(els[0].Z).toFixed(1)} ${yOf(els[0].val).toFixed(1)}`;
            els.slice(1).forEach(e => { d += ` L ${xOf(e.Z).toFixed(1)} ${yOf(e.val).toFixed(1)}`; });
            const path = mk('path');
            path.setAttribute('d', d); path.setAttribute('fill', 'none');
            path.setAttribute('stroke', p.color); path.setAttribute('stroke-width', '2.2');
            path.setAttribute('stroke-linejoin', 'round'); path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('opacity', '0.85');
            svg.appendChild(path);
        });

        // Noble gas symbol landmarks (above the dot)
        [2, 10, 18, 36].forEach(Z => {
            const el = crossIEData.find(e => e.Z === Z);
            if (!el) return;
            const t = mk('text');
            t.setAttribute('x', xOf(Z).toFixed(1));
            t.setAttribute('y', (yOf(el.val) - 9).toFixed(1));
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('fill', crossPeriodColors[el.period]);
            t.setAttribute('font-size', '9'); t.setAttribute('font-weight', '800');
            t.setAttribute('opacity', '0.9');
            t.textContent = el.sym;
            svg.appendChild(t);
        });

        // Data dots + invisible hit areas (drawn last → on top)
        crossIEData.forEach(el => {
            const pColor = crossPeriodColors[el.period];
            const cx = xOf(el.Z).toFixed(1);
            const cy = yOf(el.val).toFixed(1);

            // Main dot
            const dot = mk('circle');
            dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
            dot.setAttribute('r', '4.5');
            dot.setAttribute('fill', pColor);
            dot.setAttribute('stroke', '#070a16'); dot.setAttribute('stroke-width', '1.5');
            dot.setAttribute('cursor', 'pointer');
            dot.id = `chd-${el.Z}`;
            svg.appendChild(dot);

            // Larger transparent hit area
            const hit = mk('circle');
            hit.setAttribute('cx', cx); hit.setAttribute('cy', cy);
            hit.setAttribute('r', '10');
            hit.setAttribute('fill', 'transparent');
            hit.setAttribute('cursor', 'pointer');
            hit.addEventListener('mouseenter', () => highlightElement(el.Z, pColor));
            hit.addEventListener('mouseleave', clearHighlight);
            svg.appendChild(hit);
        });
    }




    
document.addEventListener('DOMContentLoaded', () => {
  if (typeof initPTable === 'function') initPTable();
});
</script>
