<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>光的色散細微模擬｜稜鏡 vs 光柵</title>
<meta name="description" content="互動式光的色散模擬，支援滑鼠拖曳光源調整入射角，展示垂直面入光與雙重折射物理原理。"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#050a14;
  --panel-bg:#0a1220;
  --surface:#101a2d;
  --border:#1e2d4d;
  --accent:#3a80f8;
  --text:#c8d8f8;
  --text-dim:#5a80b8;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  font-family:'Noto Sans TC',sans-serif;
  user-select:none;
  color:var(--text);
}
#app{
  display:flex;flex-direction:column;
  width:100vw;height:100dvh;
}
#header{
  flex:0 0 52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:linear-gradient(90deg,#091428,#0c1a3a,#091428);
  border-bottom:1px solid var(--border);
}
.header-title{
  display:flex;align-items:center;gap:12px;
  font-size:16px;letter-spacing:1px;font-weight:700;
  color:#8ab4f8;
}
.mode-tabs{display:flex;gap:6px;}
.tab-btn{
  padding:6px 16px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--text-dim);
  font-size:12px;cursor:pointer;transition:all .3s;
}
.tab-btn.active{
  background:var(--accent);border-color:var(--accent);
  color:#fff;box-shadow:0 0 15px rgba(58,128,248,0.4);
}

#main{flex:1;display:flex;overflow:hidden;}
#controls{
  flex:0 0 220px;
  background:var(--panel-bg);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:16px 12px;
  gap:12px;
  overflow-y:auto;
}
.ctrl-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}
.ctrl-title{
  font-size:11px;letter-spacing:1px;
  color:var(--text-dim);font-weight:500;
  margin-bottom:10px;text-transform:uppercase;
}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.col-chip{
  height:34px;border-radius:8px;cursor:pointer;
  border:2px solid transparent;position:relative;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.col-chip.active{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,0.4);}
.col-chip .chip-label{font-size:9px;color:#fff;font-weight:700;text-shadow:0 0 4px #000;}
.white-chip{background:linear-gradient(135deg,#ff3a3a,#ffff00,#44ff88,#2255ff,#9922cc);}

.slider-row{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.slider-label-row{display:flex;justify-content:space-between;font-size:11px;}
.slider-val{color:var(--accent);font-family:'JetBrains Mono';}
input[type=range]{
  width:100%;height:4px;border-radius:2px;appearance:none;
  background:var(--border);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid #fff;
}

#canvas-area{flex:1;position:relative;background:#000;overflow:hidden;}
#canvas-wrap{width:100%;height:100%;display:flex;}
.pane{flex:1;position:relative;overflow:hidden;}
.pane+.pane{border-left:1px solid var(--border);}
canvas{display:block;}
.instr-overlay{
  position:absolute;bottom:100px;left:20px;
  pointer-events:none;color:rgba(255,255,255,0.5);
  font-size:11px;display:flex;align-items:center;gap:8px;
}

#bottom-bar{
  flex:0 0 36px;background:var(--panel-bg);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:30px;
}
.info-item{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-title">🌈 <span>光的色散模擬｜稜鏡 &amp; 光柵</span></div>
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-compare" onclick="setMode('compare')">對照</button>
      <button class="tab-btn" id="tab-prism" onclick="setMode('prism')">稜鏡折射</button>
      <button class="tab-btn" id="tab-grating" onclick="setMode('grating')">光柵繞射</button>
    </div>
  </header>

  <main id="main">
    <aside id="controls">
      <div class="ctrl-section">
        <div class="ctrl-title">入 射 光 顏 色</div>
        <div class="color-grid">
          <div class="col-chip white-chip active" id="chip-white" onclick="setColor('white')"><span class="chip-label">白</span></div>
          <div class="col-chip" id="chip-red" onclick="setColor('red')" style="background:#ff3a3a;"><span class="chip-label">紅</span></div>
          <div class="col-chip" id="chip-orange" onclick="setColor('orange')" style="background:#ff9020;"><span class="chip-label">橙</span></div>
          <div class="col-chip" id="chip-yellow" onclick="setColor('yellow')" style="background:#ffe000;"><span class="chip-label">黃</span></div>
          <div class="col-chip" id="chip-green" onclick="setColor('green')" style="background:#22e055;"><span class="chip-label">綠</span></div>
          <div class="col-chip" id="chip-cyan" onclick="setColor('cyan')" style="background:#00ccee;"><span class="chip-label">青</span></div>
          <div class="col-chip" id="chip-blue" onclick="setColor('blue')" style="background:#2255ff;"><span class="chip-label">藍</span></div>
          <div class="col-chip" id="chip-violet" onclick="setColor('violet')" style="background:#9922cc;"><span class="chip-label">紫</span></div>
        </div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-title">稜 鏡 參 數</div>
        <div class="slider-row">
          <div class="slider-label-row"><span>基準折射率 n</span><span class="slider-val" id="val-n">1.60</span></div>
          <input type="range" id="sl-n" min="1.4" max="2.0" value="1.6" step="0.01" oninput="onSlider('n',this)"/>
        </div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-title">光 柵 參 數</div>
        <div class="slider-row">
          <div class="slider-label-row"><span>縫距 d (μm)</span><span class="slider-val" id="val-d">2.0</span></div>
          <input type="range" id="sl-d" min="0.5" max="5.0" value="2.0" step="0.1" oninput="onSlider('d',this)"/>
        </div>
      </div>
    </aside>

    <section id="canvas-area">
      <div id="canvas-wrap">
        <div class="pane" id="pane-left">
          <canvas id="cv-left"></canvas>

          <div class="instr-overlay">🖱️ 在左側區域上下拖曳滑鼠以調整光源位置</div>
        </div>
        <div class="pane" id="pane-right">
          <canvas id="cv-right"></canvas>

        </div>
      </div>
    </section>
  </main>

  <footer id="bottom-bar">
    <div class="info-item"><div class="dot" style="background:#44ccff;"></div><span>稜鏡：垂直面入光 (Snell's Law)</span></div>
    <div class="info-item"><div class="dot" style="background:#cc88ff;"></div><span>光柵：繞射公式 (d sinθ = mλ)</span></div>
  </footer>
</div>

<script>
const WAVELENGTHS = {
  red:    { nm: 700, hex: '#ff3a3a', n_offset: 0.00 },
  orange: { nm: 620, hex: '#ff9020', n_offset: 0.01 },
  yellow: { nm: 580, hex: '#ffe000', n_offset: 0.02 },
  green:  { nm: 530, hex: '#22e055', n_offset: 0.035 },
  cyan:   { nm: 490, hex: '#00ccee', n_offset: 0.05 },
  blue:   { nm: 450, hex: '#2255ff', n_offset: 0.07 },
  violet: { nm: 400, hex: '#9922cc', n_offset: 0.10 },
};
const SPECTRUM_ORDER = ['red','orange','yellow','green','cyan','blue','violet'];

let mode='compare', selectedColors=['white']; 
let prismN=1.60, gratingD=2.0;
let sourceYL=250, sourceYR=200, prismY=250, gratingX=200; 
let gratingPriX = null;
let isDragging=false, dragMode=null, dragSide=null; 
let animTime = 0; // Animation time for wavefronts

const cvL=document.getElementById('cv-left'), cvR=document.getElementById('cv-right');
const ctxL=cvL.getContext('2d'), ctxR=cvR.getContext('2d');
const paneL=document.getElementById('pane-left'), paneR=document.getElementById('pane-right');

function resizeCanvases() {
  cvL.width=paneL.clientWidth; cvL.height=paneL.clientHeight;
  cvR.width=paneR.clientWidth; cvR.height=paneR.clientHeight;
  if(!gratingPriX) gratingPriX = cvL.width * 0.7;
  // 初始水平入光設定
  if (mode==='grating') sourceYL = cvL.height * 0.5;
  else sourceYR = cvR.height * 0.45 - 75;
  redrawAll();
}
window.addEventListener('resize', resizeCanvases);
window.onload=()=>{
  resizeCanvases();
  setupMouseListeners();
};

function setupMouseListeners(){
  const handleStart=(e, canvasName)=>{
    const canvas = (canvasName === 'L') ? cvL : cvR;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    isDragging = true;
    dragSide = canvasName;
    
    if (mx < 80 && mode !== 'grating') {
      dragMode = 'source';
    } else if (mode === 'grating') {
      const sourceX = Math.max(310, gratingPriX - 250);
      if (Math.abs(mx - sourceX) < 40) dragMode = 'source';
      else dragMode = 'grating';
    } else {
      if (mode === 'compare') {
        dragMode = (canvasName === 'L') ? 'prism' : 'grating';
      } else if (mode === 'prism') {
        dragMode = 'prism';
      }
    }
  };
  const handleMove=(e)=>{
    if(!isDragging) return;
    const refCanvas = (dragMode === 'grating' && mode === 'compare') ? cvR : cvL;
    const rect = refCanvas.getBoundingClientRect(); 
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if(dragMode==='source') {
      let targetY = my;
      const snapY = (mode === 'grating') ? (refCanvas.height * 0.5) : 
                    (dragSide === 'R' ? (refCanvas.height * 0.45 - 75) : (refCanvas.height/2));
      // 🧲 Magnetic Snap
      if (Math.abs(targetY - snapY) < 15) targetY = snapY;
      
      if (dragSide === 'L') sourceYL = Math.max(0, Math.min(cvL.height, targetY));
      else sourceYR = Math.max(0, Math.min(cvL.height, targetY));
    }
    else if(dragMode==='prism') prismY = Math.max(0, Math.min(cvL.height, my));
    else if(dragMode==='grating') {
      if (mode === 'grating') {
        gratingPriX = Math.max(450, Math.min(refCanvas.width - 150, mx));
      } else {
        gratingX = Math.max(100, Math.min(refCanvas.width - 150, mx));
      }
    }
    if (dragMode === 'source' || dragMode === 'grating') animTime = 0; // 重置動畫
    redrawAll();
  };
  cvL.addEventListener('mousedown',(e)=>handleStart(e, 'L'));
  cvR.addEventListener('mousedown',(e)=>handleStart(e, 'R'));
  window.addEventListener('mousemove',handleMove);
  window.addEventListener('mouseup',()=> { isDragging=false; dragMode=null; dragSide=null; });
}

function setMode(m){
  mode=m;
  animTime = 0; // 重置動畫
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.id==='tab-'+m));
  paneR.style.display=(m==='compare'?'block':'none');
  resizeCanvases();
}
function setColor(c){
  if (c === 'white') {
    selectedColors = ['white'];
  } else {
    // Remove white if it exists
    const idxW = selectedColors.indexOf('white');
    if (idxW > -1) selectedColors.splice(idxW, 1);

    const idx = selectedColors.indexOf(c);
    if (idx > -1) {
      // Toggle off
      selectedColors.splice(idx, 1);
      if (selectedColors.length === 0) selectedColors = ['white'];
    } else {
      // Toggle on, max 2
      if (selectedColors.length >= 2) selectedColors.shift();
      selectedColors.push(c);
    }
  }
  
  // UI Update
  document.querySelectorAll('.col-chip').forEach(el => {
    const cid = el.id.replace('chip-', '');
    el.classList.toggle('active', selectedColors.includes(cid));
  });
  animTime = 0; // 重置動畫
  redrawAll();
}
function onSlider(w,el){
  const v=parseFloat(el.value);
  if(w==='n'){prismN=v; document.getElementById('val-n').textContent=v.toFixed(2);}
  if(w==='d'){gratingD=v; document.getElementById('val-d').textContent=v.toFixed(1);}
  animTime = 0; // 重置動畫
  redrawAll();
}

function snell(theta_deg, n1, n2) {
  const sinIn = Math.sin(theta_deg * Math.PI/180);
  const sinOut = (n1 * sinIn) / n2;
  return (Math.abs(sinOut)>1) ? null : Math.asin(sinOut)*180/Math.PI;
}

function intersect(p1, p2, p3, p4) {
  const x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y,x3=p3.x,y3=p3.y,x4=p4.x,y4=p4.y;
  const den = (y4-y3)*(x2-x1)-(x4-x3)*(y2-y1);
  if(Math.abs(den)<1e-10) return null;
  const ua = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/den;
  const ub = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/den;
  // 🔬 Use a small epsilon (0.001) to prevent "self-collision" or boundary misses
  return (ua > 0.001 && ub >= 0 && ub <= 1) ? {x:x1+ua*(x2-x1), y:y1+ua*(y2-y1), t:ua} : null;
}

function drawPrism(ctx, w, h) {
  ctx.fillStyle='#050a14'; ctx.fillRect(0,0,w,h);
  // Grid
  ctx.strokeStyle='#101a2d'; ctx.lineWidth=0.5;
  for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  const pX=w*0.35, side=210;
  const H = side * Math.sqrt(3) / 2;
  // 頂點座標改為基於 prismY
  const V1={x:pX, y:prismY - side/2}; 
  const V2={x:pX, y:prismY + side/2};
  const V3={x:pX + H, y:prismY};
  
  const faces=[
    {p1:V1, p2:V2, n:'L', norm:{x:-1, y:0}},
    {p1:V1, p2:V3, n:'TR', norm:{x:0.5, y:-Math.sqrt(3)/2}},
    {p1:V2, p2:V3, n:'BR', norm:{x:0.5, y:Math.sqrt(3)/2}}
  ];

  // Draw Prism Shape
  ctx.save();
  ctx.beginPath();ctx.moveTo(V1.x,V1.y);ctx.lineTo(V2.x,V2.y);ctx.lineTo(V3.x,V3.y);ctx.closePath();
  ctx.fillStyle='rgba(30,45,80,0.6)'; ctx.fill();
  ctx.strokeStyle='#44ccff'; ctx.lineWidth=2;
  ctx.shadowColor='#44ccff'; ctx.shadowBlur=12; ctx.stroke();
  ctx.restore();

  // Entry at 1/3 of vertical face (V1 to V2)
  const entryP={x:V1.x, y:V1.y + side/3};
  const srcX=40;
  const curSourceY = (mode === 'compare' || mode === 'prism') ? sourceYL : sourceYR;
  const rayInAng_rad = Math.atan2(entryP.y-curSourceY, entryP.x-srcX);
  const theta1_deg = rayInAng_rad * 180 / Math.PI;

  // Source & Arrival
  ctx.save();
  const mainCol = selectedColors[selectedColors.length-1];
  const cHex = mainCol === 'white' ? '#fff' : WAVELENGTHS[mainCol].hex;
  ctx.shadowColor=cHex; ctx.shadowBlur=15; ctx.fillStyle=cHex;
  ctx.beginPath();ctx.arc(srcX,curSourceY,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=cHex; ctx.globalAlpha=0.6; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(srcX,curSourceY);ctx.lineTo(entryP.x,entryP.y);ctx.stroke();
  ctx.restore();

  // Normal at entry (Horizontal)
  ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(138,180,248,0.5)';
  ctx.beginPath();ctx.moveTo(entryP.x-60, entryP.y);ctx.lineTo(entryP.x+80, entryP.y);ctx.stroke();
  ctx.restore();

  const hitPoints = [];
  const cols = selectedColors.includes('white') ? SPECTRUM_ORDER : selectedColors;
  cols.forEach(c => {
    const wl=WAVELENGTHS[c], n=prismN+wl.n_offset;
    const t2_deg=snell(theta1_deg, 1.0, n);
    if(t2_deg===null) return;

    let curP = {x: entryP.x, y: entryP.y};
    let curAng_rad = t2_deg * Math.PI / 180;
    let lastFaceN = 'L';
    const MAX_BOUNCES = 10;

    for (let b = 0; b < MAX_BOUNCES; b++) {
      let bH = null, bF = null;
      faces.forEach(f => {
        if (f.n === lastFaceN) return;
        const hiti = intersect(curP, { x: curP.x + 1000 * Math.cos(curAng_rad), y: curP.y + 1000 * Math.sin(curAng_rad) }, f.p1, f.p2);
        if (hiti && (!bH || hiti.t < bH.t)) { bH = hiti; bF = f; }
      });
      if (!bH) break;

      // Draw segment from curP to bH
      ctx.save(); ctx.strokeStyle = wl.hex; ctx.lineWidth = 2; ctx.shadowColor = wl.hex; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(curP.x, curP.y); ctx.lineTo(bH.x, bH.y); ctx.stroke();
      ctx.restore();

      const neAng_rad = Math.atan2(bF.norm.y, bF.norm.x);
      const tI_deg = (curAng_rad - neAng_rad) * 180 / Math.PI;
      const tT_deg = snell(tI_deg, n, 1.0);

      if (tT_deg !== null) {
        // Successful exit
        const outAng_rad = neAng_rad + tT_deg * Math.PI / 180;
        const screenX = w - 40;
        const yHit = bH.y + (screenX - bH.x) * Math.tan(outAng_rad);
        ctx.save(); ctx.strokeStyle = wl.hex; ctx.lineWidth = 2; ctx.shadowColor = wl.hex; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(bH.x, bH.y); ctx.lineTo(screenX, yHit); ctx.stroke();
        ctx.restore();
        hitPoints.push({ y: yHit, color: wl.hex, order: 1 });
        break; 
      } else {
        // Total Internal Reflection (TIR)
        if (b === 0 && (selectedColors.includes('white') || c === 'red' || c === 'violet')) {
           ctx.save(); ctx.fillStyle = '#ff4444'; ctx.font = '10px Noto Sans TC'; ctx.textAlign = 'center';
           ctx.fillText('全反射 (TIR)', bH.x, bH.y - 15); ctx.restore();
        }
        // 🔄 Specular Reflection
        curAng_rad = 2 * neAng_rad - curAng_rad + Math.PI;
        curP = { x: bH.x - bF.norm.x * 0.1, y: bH.y - bF.norm.y * 0.1 };
        lastFaceN = bF.n;
      }
    }
  });

  // 📍 底端投影屏視圖 (置於最底層)
  const stripH = 30, stripY = h - 35;
  ctx.save();
  ctx.fillStyle='rgba(15,25,45,0.9)'; ctx.fillRect(0, stripY, w, stripH);
  ctx.strokeStyle='rgba(58,128,248,0.4)'; ctx.strokeRect(0, stripY, w, stripH);
  hitPoints.forEach(p => {
    const px = w/2 + (p.y - entryP.y); 
    ctx.save(); ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(px, stripY + stripH/2, 5, 0, Math.PI*2); ctx.fill(); ctx.restore();
  });
  ctx.fillStyle='#8ab4f8'; ctx.font='bold 10px Noto Sans TC'; ctx.textAlign='left';
  ctx.fillText(' 1D 投影光譜帶', 10, stripY + 20);
  ctx.restore();

}

function drawGrating(ctx, w, h) {
  ctx.fillStyle='#050a14'; ctx.fillRect(0,0,w,h);
  // Grid
  ctx.strokeStyle='#101a2d'; ctx.lineWidth=0.5;
  for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

  const gx=gratingX, gy=h*0.45 - 75, gH=180; // Raise by 1.5 grid squares (75px)
  // Draw Grating Line
  ctx.save();
  ctx.strokeStyle='#cc88ff'; ctx.lineWidth=5; ctx.shadowColor='#cc88ff'; ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(gx, gy-gH/2);ctx.lineTo(gx, gy+gH/2);ctx.stroke();
  ctx.restore();

  // Dynamic Incident Angle from Source
  const srcX=40;
  const curSourceY = (mode === 'compare' || mode === 'grating') ? sourceYR : sourceYL;
  const rayInAng_rad = Math.atan2(gy - curSourceY, gx - srcX);
  const sinIn = Math.sin(rayInAng_rad);

  // Source & Incident Ray
  ctx.save();
  const mainCol = selectedColors[selectedColors.length-1];
  const cHex = mainCol === 'white' ? '#fff' : WAVELENGTHS[mainCol].hex;
  ctx.shadowColor=cHex; ctx.shadowBlur=15; ctx.fillStyle=cHex;
  ctx.beginPath();ctx.arc(srcX,curSourceY,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=cHex; ctx.globalAlpha=0.6; ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(srcX,curSourceY);ctx.lineTo(gx, gy);ctx.stroke();
  ctx.restore();

  const screenX = w - 40;
  const hitPoints = []; 
  const cols = selectedColors.includes('white') ? SPECTRUM_ORDER : selectedColors;
  cols.forEach(c => {
    const wl=WAVELENGTHS[c], hex=wl.hex, wavNm=wl.nm;
    [-2,-1,1,2].forEach(m => {
      const sinOut = (m * wavNm * 1e-3) / gratingD + sinIn;
      if (Math.abs(sinOut) <= 1) {
        const outA = Math.asin(sinOut);
        const yHit = gy + (screenX - gx) * Math.tan(outA);
        
        ctx.save(); 
        ctx.strokeStyle=hex; ctx.lineWidth=2; 
        if (Math.abs(m) === 2) { ctx.globalAlpha = 0.4; ctx.shadowBlur = 3; }
        else { ctx.shadowColor = hex; ctx.shadowBlur = 8; }
        ctx.beginPath();ctx.moveTo(gx, gy);
        ctx.lineTo(screenX, yHit);
        ctx.stroke();
        ctx.restore();
        hitPoints.push({ y: yHit, color: hex, order: m });
      }
    });

    // Zero-order (central spot)
    const yHit0 = gy + (screenX - gx) * Math.tan(rayInAng_rad);
    ctx.save(); ctx.strokeStyle=cHex; ctx.globalAlpha=0.3; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(gx, gy);ctx.lineTo(screenX, yHit0);ctx.stroke();
    ctx.restore();
    if(c==='red') hitPoints.push({ y: yHit0, color: '#fff', order: 0 }); // Just push white once
  });

  // 屏 (Screen) 垂直線
  ctx.save(); ctx.strokeStyle = '#3a4a6a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(screenX, 20); ctx.lineTo(screenX, h - 110); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '10px JetBrains Mono';
  ctx.textAlign = 'right'; ctx.fillText('接收屏 (Screen)', screenX - 10, 35); ctx.restore();

  // 📍 底端投影屏視圖 (置於最底層)
  const stripH = 30, stripY = h - 35;
  ctx.save();
  ctx.fillStyle='rgba(15,25,45,0.9)'; ctx.fillRect(0, stripY, w, stripH);
  ctx.strokeStyle='rgba(58,128,248,0.4)'; ctx.strokeRect(0, stripY, w, stripH);
  
  hitPoints.forEach(p => {
    const py = stripY + stripH/2;
    const screenCenterY = gy; 
    const px = w/2 + (p.y - screenCenterY); 
    ctx.save();
    ctx.fillStyle = p.color;
    if(Math.abs(p.order)===2) ctx.globalAlpha = 0.4;
    ctx.shadowBlur = (Math.abs(p.order)===0)?15:8;
    ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(px, py, (p.order===0?6:4), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
  ctx.fillStyle='#8ab4f8'; ctx.font='bold 10px Noto Sans TC'; ctx.textAlign='left';
  ctx.fillText(' 1D 投影光譜帶', 10, stripY + 20);
  ctx.restore();
}

function drawGratingPrinciple(ctx, w, h) {
  ctx.fillStyle='#050a14'; ctx.fillRect(0,0,w,h);
  // 📐 [LAYOUT] 拓撲重排：[UI] | [Source] | [Grating] | [Screen]
  const centerX = gratingPriX;
  const centerY = h * 0.5;
  const screenX = w - 30;
  const sourceX = Math.max(310, centerX - 250);
  const SIM_SCALE = 100;
  const d_px = gratingD * SIM_SCALE;

  const isWhiteMode = selectedColors.includes('white');
  const cols = isWhiteMode ? SPECTRUM_ORDER : selectedColors;
  
  const cycle = 480; 
  const phaseT = animTime % cycle;
  const buildT = 320; 
  const isFinished = (animTime >= 480);

  ctx.strokeStyle='rgba(58,128,248,0.08)'; ctx.lineWidth=0.5;
  for(let x=0; x<w; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }

  // 共用入射參數
  const curSourceY = sourceYL;
  const rayInAng_rad = Math.atan2(centerY - curSourceY, centerX - sourceX);
  const sinIn = Math.sin(rayInAng_rad);

  // 🔬 [LAYOUT] 入射光始於 UI 右側 (動畫：0 ~ 80 frames 發射到光柵)
  const srcCol = isWhiteMode ? '#fff' : WAVELENGTHS[selectedColors[selectedColors.length-1]].hex;
  ctx.save();
  // 光源點 (拖曳熱區)
  ctx.fillStyle = srcCol; ctx.beginPath(); ctx.arc(sourceX, curSourceY, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

  // 雷射發射動畫
  const incPhase = isFinished ? 1.0 : Math.min(1.0, phaseT / 80);
  if (incPhase > 0) {
    const currentX = sourceX + (centerX - sourceX) * incPhase;
    const currentY = curSourceY + (centerY - curSourceY) * incPhase;
    ctx.strokeStyle = srcCol; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(sourceX, curSourceY); ctx.lineTo(currentX, currentY); ctx.stroke();
  }
  ctx.restore();

  cols.forEach((colKey, colIdx) => {
    const wl = WAVELENGTHS[colKey]; 
    const colHex = wl.hex;
    const offset = 0; // 強制為 0，確保多色光的物理原點與推導三角形精確重合
    
    const wl_um = wl.nm / 1000;
    const wfSpacing = wl_um * SIM_SCALE;
    const pathDiffIn = d_px * sinIn;
    const numMarkers = 6;
    const maxRadius = numMarkers * wfSpacing;

    if (isWhiteMode) {
      // 白光狀態：等候 80 後，零級白與光譜同步綻放
      drawPrincipleRays(ctx, centerX, centerY, screenX, wl, sinIn, offset, colHex, 1.0, true, phaseT, buildT, isFinished);
    } else {
      // 單色光動畫：等候入射光抵達狹縫 (phaseT >= 80) 後再開始繞射
      if (isFinished || phaseT >= 80) {
        const effAnimTime = Math.max(0, animTime - 80);
        const effPhaseT = isFinished ? 400 : Math.max(0, phaseT - 80);
        
        const speed = 1.2;
        const movePhase = (effAnimTime * speed) % wfSpacing;

        // 1. 繪製圓形子波
        ctx.save();
        ctx.lineWidth = 1; ctx.strokeStyle = colHex; ctx.globalAlpha = 0.15;
        for(let s=-1; s<=1; s++){
          const sy = centerY + s*d_px;
          for(let j=1; j<8; j++){
            const r = j*wfSpacing + movePhase - s*pathDiffIn;
            if (r > 0 && r < maxRadius + 80) {
              ctx.beginPath(); ctx.arc(centerX, sy, r, -Math.PI/2.2, Math.PI/2.2); ctx.stroke();
            }
          }
        }
        ctx.restore();

        // 2. 繪製固定亮圓弧 (建設性干涉點)
        ctx.save();
        ctx.lineWidth = 2.5; ctx.strokeStyle = colHex;
        for(let k=1; k<=numMarkers; k++){
          const targetR = k * wfSpacing;
          if (isFinished || effPhaseT >= (k/numMarkers * buildT) || effPhaseT >= buildT) {
             ctx.globalAlpha = isFinished ? 0.15 : 0.6; ctx.shadowColor = colHex; ctx.shadowBlur = isFinished ? 2 : 8;
             for(let s=-1; s<=1; s++){
               const sy = centerY + s*d_px;
               const rWithPhase = targetR - s*pathDiffIn;
               if (rWithPhase > 0) {
                 ctx.beginPath(); ctx.arc(centerX, sy, rWithPhase, -Math.PI/4, Math.PI/4); ctx.stroke();
               }
             }
          }
        }
        ctx.restore();

        // 3. 繪製幾何三角形與射線 (Phase 2 & 定格狀態)
        if (isFinished || effPhaseT > buildT) {
          const rayAlpha = isFinished ? 1.0 : Math.min(1.0, (effPhaseT - buildT) / 40);
          
          // 繪製光程差三角形 (核心推導圖)
          drawPathTriangle(ctx, centerX, centerY, d_px, wl_um, sinIn, colHex, rayAlpha);
          
          // 繪製射線與巨觀波前線
          drawPrincipleRays(ctx, centerX, centerY, screenX, wl, sinIn, offset, colHex, rayAlpha, false, effPhaseT, buildT, isFinished);
        }
      }
    }
  });

  // 🏗️ 狹縫結構 (修正對位：光波應從縫隙出射)
  ctx.save();
  ctx.strokeStyle='#cc88ff'; ctx.lineWidth=8; ctx.lineCap='butt';
  // 繪製遮光條 (位於狹縫中心點之間)
  const barHalfWidth = d_px * 0.4; // 遮光條佔 80% 寬度
  const slitIndices = [-2, -1, 0, 1]; // 在狹縫 -1, 0, 1 之間及其外側繪製遮光部分
  slitIndices.forEach(i => {
    const barCenterY = centerY + (i + 0.5) * d_px;
    ctx.beginPath();
    ctx.moveTo(centerX, barCenterY - barHalfWidth);
    ctx.lineTo(centerX, barCenterY + barHalfWidth);
    ctx.stroke();
  });

  // 標註 d (狹縫與狹縫中心之距離)
  ctx.fillStyle='#cc88ff'; ctx.font='bold 12px JetBrains Mono';
  ctx.textAlign='right';
  ctx.fillText('d', centerX - 25, centerY + d_px/2 + 5);
  // 輔助標註線
  ctx.strokeStyle='rgba(204,136,255,0.4)'; ctx.lineWidth=1; ctx.setLineDash([2,2]);
  ctx.beginPath(); ctx.moveTo(centerX-20, centerY); ctx.lineTo(centerX, centerY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(centerX-20, centerY + d_px); ctx.lineTo(centerX, centerY + d_px); ctx.stroke();
  ctx.restore();

  drawPrincipleUI(ctx, w, h, cols, screenX);
}

// 📐 繪製光程差三角形
function drawPathTriangle(ctx, cx, cy, d_px, wl_um, sinIn, colHex, alpha) {
  const m = 1; // 第一級
  const sinOut = (m * wl_um) / gratingD + sinIn;
  if (Math.abs(sinOut) > 1) return;
  const theta = Math.asin(sinOut);

  ctx.save();
  ctx.globalAlpha = alpha * 0.9;
  const s0y = cy, s1y = cy + d_px;
  
  // 1. 狹縫間距邊 (d)
  ctx.strokeStyle = '#cc88ff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, s0y); ctx.lineTo(cx, s1y); ctx.stroke();
  
  // 2. 射線方向平行輔助線
  ctx.strokeStyle = colHex; ctx.setLineDash([4,2]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, s0y); ctx.lineTo(cx + 60, s0y + 60*Math.tan(theta)); ctx.stroke();
  
  // 3. 對邊 (光程差 λ)
  const pd_px = (m * wl_um) * 100; // SIM_SCALE
  const fx = cx + pd_px * Math.cos(theta);
  const fy = s0y + pd_px * Math.sin(theta);
  ctx.setLineDash([]); ctx.strokeStyle = colHex; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, s0y); ctx.lineTo(fx, fy); ctx.stroke(); 
  
  // 4. 通過 s1 做垂直於射線的「波前邊」 (淡綠色)
  ctx.strokeStyle = '#90ee90'; ctx.lineWidth = 3; 
  ctx.beginPath(); ctx.moveTo(cx, s1y); ctx.lineTo(fx, fy); ctx.stroke(); 

  // 5. 繪製直角符號 ∟
  ctx.strokeStyle = '#90ee90'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  const boxS = 8;
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(theta);
  ctx.beginPath();
  ctx.moveTo(-boxS, 0); ctx.lineTo(-boxS, boxS); ctx.lineTo(0, boxS);
  ctx.stroke();
  ctx.restore();
  
  // 標註
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 12px JetBrains Mono';
  ctx.fillText(`\u03B8`, cx + 25, s0y + 10);
  ctx.fillStyle = colHex;
  ctx.fillText(`\u03BB`, (cx+fx)/2 - 15, (s0y+fy)/2 - 5);
  ctx.restore();
}

function drawPrincipleRays(ctx, cx, cy, sx, wl, sinIn, offset, colHex, alpha, isWhite, phaseT, buildT, isFinished) {
  const orders = [0, 1, 2, -1, -2];
  orders.forEach(m => {
    const sinOut = (m * wl.nm * 1e-3) / gratingD + sinIn;
    if (Math.abs(sinOut) <= 1) {
      const theta = Math.asin(sinOut);
      const endY = cy + (sx - cx) * Math.tan(theta);
      
      ctx.save();
      // 🔬 [FIX] 零級展示為白光
      const curCol = (m===0) ? '#fff' : colHex;

      let baseAlpha = 1.0;
      if (isWhite) {
        baseAlpha = isFinished ? 1.0 : Math.max(0, Math.min(1.0, (phaseT - 100) / 60));
      } else {
        baseAlpha = alpha;
      }

      if (baseAlpha <= 0 && !isFinished) {
        ctx.restore();
        return;
      }

      ctx.globalAlpha = (Math.abs(m)===2 ? 0.3 : 0.7) * baseAlpha;
      ctx.strokeStyle = curCol; ctx.lineWidth = (m===0?1.5:2);
      if (m!==0 && !isWhite) { ctx.shadowColor = curCol; ctx.shadowBlur = 10; }
      
      ctx.beginPath(); ctx.moveTo(cx, cy + offset);
      ctx.lineTo(sx, endY + offset); ctx.stroke();
      
      // 繪製與射線垂直的「巨觀波前線」
      if (!isWhite && (isFinished || phaseT > buildT)) {
        ctx.save();
        ctx.strokeStyle = curCol; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4 * alpha;
        const progress = isFinished ? 0.8 : (phaseT - buildT) / (400 - buildT);
        const distance = progress * (sx - cx) * 0.8;
        const wfx = cx + distance * Math.cos(theta);
        const wfy = cy + distance * Math.sin(theta);
        const wing = 40;
        ctx.beginPath();
        ctx.moveTo(wfx + wing*Math.sin(theta), wfy - wing*Math.cos(theta));
        ctx.lineTo(wfx - wing*Math.sin(theta), wfy + wing*Math.cos(theta));
        ctx.stroke();
        ctx.restore();
      }

      // 角度標註 θ₁、θ₂ (白光時因為各色角度不同，避免疊加混亂所以不繪製字樣)
      if (!isWhite && isFinished && m > 0 && m <= 2) {
        ctx.save();
        ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1; ctx.globalAlpha = 0.8;
        const arcR = 40 + m*25;
        ctx.beginPath(); ctx.arc(cx, cy, arcR, 0, theta); ctx.stroke();
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 11px JetBrains Mono';
        ctx.fillText(`\u03B8${m}`, cx + arcR*Math.cos(theta/2) + 5, cy + arcR*Math.sin(theta/2));
        ctx.restore();
      }

      ctx.globalAlpha = baseAlpha;
      ctx.fillStyle = curCol; ctx.beginPath();
      ctx.arc(sx, endY + offset, (m===0?4:6), 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
}

function drawPrincipleUI(ctx, w, h, cols, screenX) {
  ctx.save();
  // 🔬 [MOVE] 移至左上方
  const uiX = 20, uiY = 30;
  ctx.fillStyle='rgba(10,25,45,0.95)'; ctx.fillRect(uiX, uiY, 280, 200);
  ctx.strokeStyle='#3a80f8'; ctx.lineWidth=2; ctx.strokeRect(uiX, uiY, 280, 200);
  ctx.fillStyle='#fff'; ctx.font='700 16px Noto Sans TC';
  ctx.fillText('光柵繞射\uFF1A推導演示', uiX + 20, uiY + 35);
  
  const isWhiteMode = selectedColors.includes('white');
  if (isWhiteMode) {
    ctx.fillStyle='#8ab4f8'; ctx.font='12px Noto Sans TC';
    ctx.fillText('白光模式\uFF1A多波長干涉疊加', uiX + 20, uiY + 60);

    ctx.font = 'bold 16px JetBrains Mono';
    ctx.fillStyle = '#cc88ff'; ctx.fillText('d', uiX + 20, uiY + 90);
    ctx.fillStyle = '#fff'; ctx.fillText(' sin ', uiX + 35, uiY + 90);
    ctx.fillStyle = '#ffcc00'; ctx.fillText('\u03B8', uiX + 75, uiY + 90);
    ctx.fillStyle = '#fff'; ctx.fillText(' = m', uiX + 90, uiY + 90);
    ctx.fillStyle = '#fff'; ctx.fillText('\u03BB', uiX + 130, uiY + 90);

    ctx.fillStyle = '#aad4f8'; ctx.font = '11px Noto Sans TC';
    ctx.fillText('(各色光因 \u03BB 不同\uFF0C繞射角 \u03B8 隨之扇出)', uiX + 20, uiY + 120);
  } else {
    cols.forEach((c, i) => {
      const wl = WAVELENGTHS[c];
      const sin1 = (1 * wl.nm * 1e-3) / gratingD; 
      const sin2 = (2 * wl.nm * 1e-3) / gratingD;
      const th1 = Math.asin(Math.min(0.99, sin1)) * 180 / Math.PI;
      const th2 = Math.asin(Math.min(0.99, Math.abs(sin2))) * 180 / Math.PI;
      
      ctx.font = 'bold 16px JetBrains Mono';
      // 公式顏色同步
      ctx.fillStyle = '#cc88ff'; ctx.fillText('d', uiX + 20, uiY + 75 + i*60);
      ctx.fillStyle = '#fff'; ctx.fillText(' sin ', uiX + 35, uiY + 75 + i*60);
      ctx.fillStyle = '#ffcc00'; ctx.fillText('\u03B8', uiX + 75, uiY + 75 + i*60);
      ctx.fillStyle = '#fff'; ctx.fillText(' = m', uiX + 90, uiY + 75 + i*60);
      ctx.fillStyle = wl.hex; ctx.fillText('\u03BB', uiX + 130, uiY + 75 + i*60);

      ctx.font = '12px JetBrains Mono'; ctx.fillStyle = '#aad4f8';
      ctx.fillText(`\u03B8\u2081 \u2248 ${th1.toFixed(1)}\u00B0`, uiX + 20, uiY + 100 + i*60);
      if(Math.abs(sin2)<=1) ctx.fillText(`\u03B8\u2082 \u2248 ${th2.toFixed(1)}\u00B0`, uiX + 100, uiY + 100 + i*60);
    });
  }
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='11px Noto Sans TC';
  ctx.fillText('\u203B 幾何\uFF1A\u221F 為波前與射線之直角關係', uiX + 20, uiY + 180);
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(screenX, 10); ctx.lineTo(screenX, h-120); ctx.stroke();
}

function redrawAll(){
  if (mode === 'compare') {
    drawPrism(ctxL, cvL.width, cvL.height);
    drawGrating(ctxR, cvR.width, cvR.height);
  } else if (mode === 'prism') {
    drawPrism(ctxL, cvL.width, cvL.height);
  } else if (mode === 'grating') {
    drawGratingPrinciple(ctxL, cvL.width, cvL.height);
  }
}

function animate() {
  if (animTime < 480) {
    animTime += 1;
    if (mode === 'grating') {
      redrawAll();
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
