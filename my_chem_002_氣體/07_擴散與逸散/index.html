<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2-7 擴散與逸散</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent: #22d3ee;
            --accent2: #a78bfa;
            --text-color: #f8fafc;
            --card-border: rgba(255, 255, 255, 0.12);
            --header-height: 52px;
            --slide-height: calc(100vh - var(--header-height));
            --toolbar-space: 82px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #chapter-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 0 20px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent2);
            background: rgba(167,139,250,0.12);
            border: 1px solid rgba(167,139,250,0.35);
            padding: 2px 10px;
            border-radius: 40px;
            letter-spacing: 0.06em;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.04em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #page-counter {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 700;
        }

        #jump-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .jump-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.6);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .jump-btn:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .jump-btn.active-pg { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .jump-btn.quiz-btn { border-color: var(--accent2); color: var(--accent2); }
        .jump-btn.quiz-btn.active-pg { background: var(--accent2); color: #0f172a; }

        #main-scroller {
            margin-top: var(--header-height);
            display: flex;
            flex-direction: column;
            gap: 0;
            background: var(--primary-bg);
        }

        .slide-frame-wrap {
            width: 100%;
            height: var(--slide-height);
            min-height: 540px;
            box-sizing: border-box;
            padding: 10px var(--toolbar-space) 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid var(--card-border);
            scroll-margin-top: var(--header-height);
            overflow: hidden;
        }

        .slide-frame-wrap iframe {
            width: 100%;
            max-width: 1440px;
            height: 100%;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            display: block;
            background: var(--primary-bg);
            transition: box-shadow 0.3s ease;
        }

        .slide-frame-wrap iframe:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent), 0 10px 35px rgba(0,0,0,0.6);
        }

        .quiz-frame-wrap {
            height: auto;
            min-height: var(--slide-height);
            padding-bottom: 40px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 3px solid var(--accent2);
            overflow: visible;
        }

        .quiz-frame-wrap iframe {
            min-height: 860px;
            max-width: 1150px;
        }

        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255,255,255,0.35);
            font-size: 0.95rem;
            gap: 10px;
        }
        .loading-placeholder::before {
            content: '';
            width: 18px; height: 18px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header id="chapter-header">
        <div class="header-left">
            <span class="header-badge">選修化學三 · 第二章 氣體</span>
            <span class="header-title">2-7 擴散與逸散</span>
        </div>
        <div class="header-right">
            <div id="jump-bar"></div>
            <div id="page-counter">— / —</div>
        </div>
    </header>

    <main id="main-scroller"></main>

    <script>
    (() => {
        const scroller      = document.getElementById('main-scroller');
        const pageCounter   = document.getElementById('page-counter');
        const jumpBar       = document.getElementById('jump-bar');

        const SLIDES = [];
        let currentVisible = 0;
        const wrappers = [];

        async function detectSlides() {
            const detected = [];
            let idx = 1;
            const MAX_DETECT = 25;
            let probeBlocked = false;

            while (idx <= MAX_DETECT) {
                const filename = `slidepage${idx}.html`;
                let exists = false;
                try {
                    let res = await fetch(filename, { method: 'HEAD' });
                    if (res.status === 405) {
                        res = await fetch(filename, { method: 'GET' });
                    }
                    exists = res.ok;
                } catch (e) {
                    exists = false;
                    if (idx === 1) probeBlocked = true;
                }

                if (exists) {
                    detected.push({ file: filename, label: String(idx) });
                    idx++;
                } else {
                    break;
                }
            }

            if (probeBlocked || detected.length === 0) {
                console.warn('[AutoDetect] 本地 fetch 受限，啟用預設備援頁數（8頁）');
                for (let k = 1; k <= 8; k++) {
                    detected.push({ file: `slidepage${k}.html`, label: String(k) });
                }
            }

            detected.push({ file: 'quiz.html', label: '🎮 檢核', isQuiz: true });
            return detected;
        }

        function buildUI(slideList) {
            slideList.forEach((item, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'slide-frame-wrap' + (item.isQuiz ? ' quiz-frame-wrap' : '');
                wrap.id = `slide-wrap-${index}`;

                const placeholder = document.createElement('div');
                placeholder.className = 'loading-placeholder';
                placeholder.textContent = `載入第 ${index + 1} 頁中...`;
                wrap.appendChild(placeholder);

                scroller.appendChild(wrap);
                wrappers.push(wrap);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'jump-btn' + (item.isQuiz ? ' quiz-btn' : '');
                btn.textContent = item.label;
                btn.title = item.isQuiz ? '前往單元檢核' : `第 ${item.label} 頁`;
                btn.addEventListener('click', () => {
                    ensureLoaded(index);
                    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                jumpBar.appendChild(btn);
            });

            pageCounter.textContent = `1 / ${slideList.length}`;
            setupObserver();
            ensureLoaded(0);
            if (slideList.length > 1) ensureLoaded(1);
        }

        function ensureLoaded(index) {
            if (index < 0 || index >= SLIDES.length) return;
            const wrap = wrappers[index];
            if (!wrap || wrap.querySelector('iframe')) return;

            wrap.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = SLIDES[index].file;
            iframe.title = `Slide ${index + 1}`;
            iframe.setAttribute('loading', 'lazy');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('tabindex', '0');
            iframe.addEventListener('load', () => {
                try {
                    iframe.contentWindow.focus();
                } catch (e) {}
            });
            wrap.appendChild(iframe);
        }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const idx = wrappers.indexOf(entry.target);
                    if (idx === -1) return;

                    if (entry.isIntersecting) {
                        ensureLoaded(idx);
                        if (idx + 1 < SLIDES.length) ensureLoaded(idx + 1);

                        currentVisible = idx;
                        pageCounter.textContent = `${idx + 1} / ${SLIDES.length}`;

                        const btns = jumpBar.querySelectorAll('.jump-btn');
                        btns.forEach((b, bIdx) => {
                            b.classList.toggle('active-pg', bIdx === idx);
                        });
                    }
                });
            }, {
                root: null,
                threshold: 0.35
            });

            wrappers.forEach(w => observer.observe(w));
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowDown', 'PageDown'].includes(e.key)) {
                if (currentVisible < SLIDES.length - 1) {
                    e.preventDefault();
                    wrappers[currentVisible + 1].scrollIntoView({ behavior: 'smooth' });
                }
            } else if (['ArrowUp', 'PageUp'].includes(e.key)) {
                if (currentVisible > 0) {
                    e.preventDefault();
                    wrappers[currentVisible - 1].scrollIntoView({ behavior: 'smooth' });
                }
            }
        });

        // 接收來自子頁面的通關事件與尺寸調整
        window.addEventListener('message', (e) => {
            if (!e.data) return;
            if (e.data.type === 'SECTION_COMPLETE') {
                const quizBtn = jumpBar.querySelector('.quiz-btn');
                if (quizBtn) {
                    quizBtn.textContent = '✅ 已通關';
                    quizBtn.style.borderColor = '#34d399';
                    quizBtn.style.color = '#34d399';
                }
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(e.data, '*');
                }
            }
            if (e.data.type === 'RESIZE_IFRAME' && e.data.height) {
                const quizEntry = wrappers[wrappers.length - 1];
                if (quizEntry) {
                    const iframe = quizEntry.querySelector('iframe');
                    if (iframe) iframe.style.height = (e.data.height + 60) + 'px';
                }
            }
        });

        detectSlides().then(list => {
            SLIDES.push(...list);
            buildUI(SLIDES);
        });
    })();
    </script>

    <!-- 捲動位置同步中繼器 -->
    <script src="../../unified_chem_spa/js/scroll_relay.js"></script>

</body>
</html>
