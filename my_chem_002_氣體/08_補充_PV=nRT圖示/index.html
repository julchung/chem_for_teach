<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV=nRT 理想氣體互動演示</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Left Panel: 3D Visualization -->
        <div class="panel left-panel">
            <header style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>理想氣體三維關係圖 (PV=nRT)</h1>
                    <p>1 莫耳理想氣體之 P-V-T 關係表面</p>
                </div>
                <a href="water.html" class="nav-link">進入：水的相圖互動演示 →</a>
            </header>
            <div id="plot3d" class="chart-container"></div>
            <div class="info-overlay">
                <div class="info-item">
                    <span class="label">狀態方程式:</span>
                    <span class="value">PV = nRT</span>
                </div>
            </div>
        </div>

        <!-- Right Panel: 2D Projections and Controls -->
        <div class="panel right-panel">
            <!-- Top: P-V Plot -->
            <div class="sub-panel">
                <div class="chart-header">
                    <h2>等溫線剖面 (P-V 圖)</h2>
                    <div class="control-group">
                        <label for="temp-slider">溫度 (T): <span id="temp-val">300</span> K</label>
                        <input type="range" id="temp-slider" min="100" max="600" value="300" step="10">
                    </div>
                </div>
                <div id="plot-pv" class="chart-container-small"></div>
            </div>

            <!-- Middle: V-T Plot -->
            <div class="sub-panel">
                <div class="chart-header">
                    <h2>等壓線剖面 (V-T 圖)</h2>
                    <div class="control-group">
                        <label for="pres-slider">壓力 (P): <span id="pres-val">1.0</span> atm</label>
                        <input type="range" id="pres-slider" min="0.1" max="10" value="1.0" step="0.1">
                    </div>
                </div>
                <div id="plot-vt" class="chart-container-small"></div>
            </div>

            <!-- Bottom: P-T Plot -->
            <div class="sub-panel">
                <div class="chart-header">
                    <h2>等容線剖面 (P-T 圖)</h2>
                    <div class="control-group">
                        <label for="vol-slider">體積 (V): <span id="vol-val">24.6</span> L</label>
                        <input type="range" id="vol-slider" min="0.5" max="50" value="24.6" step="0.1">
                    </div>
                </div>
                <div id="plot-pt" class="chart-container-small"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.body.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            }
        });
    </script>
    <script src="../../unified_chem_spa/js/scroll_relay.js"></script>

<!-- Chem Whiteboard Scroll Sync Bridge -->
<script id="__chem_scroll_bridge">
(function() {
  if (window.__chemScrollBridgeInstalled) return;
  window.__chemScrollBridgeInstalled = true;

  function getScrollPos() {
    var sy = window.scrollY || window.pageYOffset || 0;
    var sx = window.scrollX || window.pageXOffset || 0;
    if (document.documentElement) {
      sy = Math.max(sy, document.documentElement.scrollTop || 0);
      sx = Math.max(sx, document.documentElement.scrollLeft || 0);
    }
    if (document.body) {
      sy = Math.max(sy, document.body.scrollTop || 0);
      sx = Math.max(sx, document.body.scrollLeft || 0);
    }
    var stream = document.getElementById('presentation-stream') ||
                 document.getElementById('presentation-area') ||
                 document.getElementById('slides-container') ||
                 document.getElementById('app');
    if (stream) {
      sy = Math.max(sy, stream.scrollTop || 0);
      sx = Math.max(sx, stream.scrollLeft || 0);
    }
    return { sx: sx, sy: sy };
  }

  function reportScroll() {
    if (window.parent && window.parent !== window) {
      var pos = getScrollPos();
      window.parent.postMessage({ type: '__chem_scroll', sy: pos.sy, sx: pos.sx }, '*');
    }
  }

  // 監聽各種觸發捲動之事件
  window.addEventListener('scroll', reportScroll, { capture: true, passive: true });
  document.addEventListener('scroll', reportScroll, { capture: true, passive: true });
  window.addEventListener('wheel', function() {
    requestAnimationFrame(reportScroll);
    setTimeout(reportScroll, 40);
    setTimeout(reportScroll, 120);
  }, { capture: true, passive: true });
  window.addEventListener('touchmove', function() {
    requestAnimationFrame(reportScroll);
    setTimeout(reportScroll, 40);
  }, { capture: true, passive: true });
  window.addEventListener('keydown', function(e) {
    if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space', 'Home', 'End'].indexOf(e.code) !== -1) {
      requestAnimationFrame(reportScroll);
      setTimeout(reportScroll, 60);
      setTimeout(reportScroll, 180);
    }
  }, { passive: true });

  // 監聽來自母頁面 (index.html) 的命令
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === '__chem_scroll_by') {
      var dy = e.data.deltaY || 0;
      var dx = e.data.deltaX || 0;
      window.scrollBy({ top: dy, left: dx, behavior: 'instant' });
      if (document.documentElement) document.documentElement.scrollTop += dy;
      if (document.body) document.body.scrollTop += dy;
      var stream = document.getElementById('presentation-stream') ||
                   document.getElementById('presentation-area') ||
                   document.getElementById('slides-container') ||
                   document.getElementById('app');
      if (stream) stream.scrollTop += dy;
      reportScroll();
    } else if (e.data.type === '__chem_get_scroll') {
      reportScroll();
    }
  });

  // 初始時與載入後回報
  reportScroll();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', reportScroll);
  }
  window.addEventListener('load', reportScroll);
})();
</script>

</body>
</html>
