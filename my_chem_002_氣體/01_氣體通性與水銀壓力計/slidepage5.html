<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2-1 氣體通性與水銀壓力計 · 開口式水銀壓力計 | 互動教學</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #presentation-area { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container {
            position: absolute;
            top: 1.2vh; left: 1.8vw; right: 1.8vw; bottom: 1.2vh;
        }
        .slide {
            position: absolute; inset: 0; padding: 0.15rem 0.15rem;
            opacity: 1; pointer-events: auto;
            display: flex; flex-direction: column; overflow: hidden; height: 100%;
        }
        h1 {
            color: var(--accent-cyan); font-size: clamp(1.35rem, 1.8vw, 1.75rem);
            margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.6rem;
            border-bottom: 2px solid rgba(34,211,238,0.25); padding-bottom: 0.25rem; flex-shrink: 0;
        }
        h1::before { content: ""; width: 8px; height: 26px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.1rem;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border); border-radius: 16px;
            padding: 1rem 1.3rem; backdrop-filter: blur(12px);
            display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            min-height: 0; gap: 0.8rem; height: 100%;
            overflow: hidden; justify-content: space-between;
        }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid rgba(255,255,255,0.12); padding-bottom: 0.45rem; flex-shrink: 0;
        }
        .panel-header h2 {
            font-size: clamp(1.18rem, 1.38vw, 1.45rem);
            font-weight: 700; margin: 0;
        }
        .badge {
            font-size: clamp(0.88rem, 1vw, 1.02rem);
            padding: 3px 12px; border-radius: 20px; font-weight: 800; letter-spacing: 0.5px;
        }

        .svg-container {
            flex: 1;
            min-height: 0;
            background: rgba(0,0,0,0.32);
            border-radius: 14px;
            border: 1.5px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
        }
        .manometer-svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            display: block;
        }

        .formula-box {
            background: rgba(0,0,0,0.55); border-radius: 12px; border-left: 6px solid var(--accent-cyan);
            padding: 0.7rem 1.2rem; text-align: center;
            font-size: clamp(1.45rem, 1.85vw, 2.05rem); font-weight: 800; flex-shrink: 0;
            box-shadow: 0 4px 18px rgba(0,0,0,0.35);
        }

        mjx-container[jax="CHTML"][display="true"] {
            margin: 0.1em 0 !important;
        }

        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr !important; overflow-y: auto; }
            body, html, #app, #presentation-area { overflow: auto; }
            .slide { position: relative; height: auto; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="presentation-area">
        <div id="slides-container">
            <div class="slide active">
                <h1>2-1 氣體通性與水銀壓力計 · 開口式水銀壓力計 (Open Manometer)</h1>
                <div class="grid-2">
                    <!-- 左欄：情況 (A) Pgas > Patm -->
                    <div class="panel">
                        <div class="panel-header" style="border-bottom-color: rgba(56,189,248,0.3);">
                            <h2 style="color: var(--accent-cyan);">
                                <span>📈</span> (A) 氣室壓力大於大氣壓 ($P_{\text{gas}} > P_{\text{atm}}$)
                            </h2>
                            <span class="badge" style="background: rgba(56,189,248,0.18); color: var(--accent-cyan); border: 1.5px solid var(--accent-cyan);">
                                右高左低
                            </span>
                        </div>

                        <!-- 修正後向量圖 A：直接以 polygon 繪製箭頭，方向 100% 垂直正確 -->
                        <div class="svg-container">
                            <svg viewBox="0 0 440 280" class="manometer-svg">
                                <defs>
                                    <linearGradient id="mercuryGradA" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#475569"/>
                                        <stop offset="30%" stop-color="#94a3b8"/>
                                        <stop offset="50%" stop-color="#e2e8f0"/>
                                        <stop offset="70%" stop-color="#94a3b8"/>
                                        <stop offset="100%" stop-color="#334155"/>
                                    </linearGradient>
                                </defs>

                                <!-- 實驗檯桌面 -->
                                <rect x="25" y="250" width="100" height="6" rx="2" fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

                                <!-- 氣室與玻璃導管一體成型路徑（無交錯重疊） -->
                                <path d="M 312,45 V 225 A 57,57 0 0 1 198,225 V 97 C 198,93 194,89 190,89 H 102 C 96,89 92,93 92,97 V 120 L 112,245 L 38,245 L 68,120 V 77 C 68,71 72,65 78,65 H 210 C 216,65 222,71 222,77 V 225 A 33,33 0 0 0 288,225 V 45 Z"
                                      fill="rgba(56,189,248,0.06)" />

                                <!-- 玻璃管壁外輪廓線（乾淨俐落白線） -->
                                <path d="M 312,45 V 225 A 57,57 0 0 1 198,225 V 97 C 198,93 194,89 190,89 H 102 C 96,89 92,93 92,97 V 120 L 112,245 L 38,245 L 68,120 V 77 C 68,71 72,65 78,65 H 210 C 216,65 222,71 222,77 V 225 A 33,33 0 0 0 288,225 V 45"
                                      fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="butt" />

                                <!-- 右管頂端開口唇環 (Open Tube) -->
                                <ellipse cx="300" cy="45" rx="12" ry="3.5" fill="rgba(56,189,248,0.15)" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>

                                <!-- 水銀柱：右高左低 (左 meniscus y=190, 右 meniscus y=100) -->
                                <path d="M 210,190 V 225 A 45,45 0 0 0 300,225 V 100" fill="none" stroke="url(#mercuryGradA)" stroke-width="23.5" stroke-linecap="butt" />
                                <ellipse cx="210" cy="190" rx="11.5" ry="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
                                <ellipse cx="300" cy="100" rx="11.5" ry="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

                                <!-- 氣室文字標註 -->
                                <text x="75" y="172" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">氣室</text>
                                <text x="75" y="198" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="800">P<tspan font-size="14" dy="3">gas</tspan></text>

                                <!-- 等壓基準線 (對齊左水銀面 y=190) -->
                                <line x1="180" y1="190" x2="385" y2="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
                                <rect x="305" y="196" width="85" height="19" rx="4" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1"/>
                                <text x="347" y="210" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">等壓基準線</text>

                                <!-- 右水銀面高度虛線 (y=100) -->
                                <line x1="285" y1="100" x2="385" y2="100" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5,3" />

                                <!-- 高度差 h 雙向標註（精確頂天立地箭頭） -->
                                <line x1="365" y1="108" x2="365" y2="182" stroke="#fbbf24" stroke-width="2.5" />
                                <polygon points="365,100 359,110 371,110" fill="#fbbf24" />
                                <polygon points="365,190 359,180 371,180" fill="#fbbf24" />
                                <text x="378" y="152" fill="#fbbf24" font-size="20" font-weight="800">h</text>

                                <!-- 大氣壓直射向下箭頭（直接繪製向下多邊形三角形，絕不偏向） -->
                                <line x1="300" y1="12" x2="300" y2="35" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
                                <polygon points="300,43 293,33 307,33" fill="#38bdf8" />
                                <text x="300" y="8" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">Patm (外壓)</text>
                            </svg>
                        </div>

                        <!-- 滿版公式 -->
                        <div class="formula-box">
                            $$P_{\text{gas}} = P_{\text{atm}} + h$$
                        </div>
                    </div>

                    <!-- 右欄：情況 (B) Pgas < Patm -->
                    <div class="panel">
                        <div class="panel-header" style="border-bottom-color: rgba(248,113,113,0.3);">
                            <h2 style="color: var(--accent-red);">
                                <span>📉</span> (B) 氣室壓力小於大氣壓 ($P_{\text{gas}} < P_{\text{atm}}$)
                            </h2>
                            <span class="badge" style="background: rgba(248,113,113,0.18); color: var(--accent-red); border: 1.5px solid var(--accent-red);">
                                左高右低
                            </span>
                        </div>

                        <!-- 修正後向量圖 B：直接以 polygon 繪製箭頭，方向 100% 垂直正確 -->
                        <div class="svg-container">
                            <svg viewBox="0 0 440 280" class="manometer-svg">
                                <defs>
                                    <linearGradient id="mercuryGradB" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#475569"/>
                                        <stop offset="30%" stop-color="#94a3b8"/>
                                        <stop offset="50%" stop-color="#e2e8f0"/>
                                        <stop offset="70%" stop-color="#94a3b8"/>
                                        <stop offset="100%" stop-color="#334155"/>
                                    </linearGradient>
                                </defs>

                                <!-- 實驗檯桌面 -->
                                <rect x="25" y="250" width="100" height="6" rx="2" fill="#334155" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

                                <!-- 氣室與玻璃導管一體成型路徑（無交錯重疊） -->
                                <path d="M 312,45 V 225 A 57,57 0 0 1 198,225 V 97 C 198,93 194,89 190,89 H 102 C 96,89 92,93 92,97 V 120 L 112,245 L 38,245 L 68,120 V 77 C 68,71 72,65 78,65 H 210 C 216,65 222,71 222,77 V 225 A 33,33 0 0 0 288,225 V 45 Z"
                                      fill="rgba(248,113,113,0.06)" />

                                <!-- 玻璃管壁外輪廓線（乾淨俐落白線） -->
                                <path d="M 312,45 V 225 A 57,57 0 0 1 198,225 V 97 C 198,93 194,89 190,89 H 102 C 96,89 92,93 92,97 V 120 L 112,245 L 38,245 L 68,120 V 77 C 68,71 72,65 78,65 H 210 C 216,65 222,71 222,77 V 225 A 33,33 0 0 0 288,225 V 45"
                                      fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="butt" />

                                <!-- 右管頂端開口唇環 (Open Tube) -->
                                <ellipse cx="300" cy="45" rx="12" ry="3.5" fill="rgba(248,113,113,0.15)" stroke="rgba(255,255,255,0.9)" stroke-width="1.8"/>

                                <!-- 水銀柱：左高右低 (左 meniscus y=100, 右 meniscus y=190) -->
                                <path d="M 210,100 V 225 A 45,45 0 0 0 300,225 V 190" fill="none" stroke="url(#mercuryGradB)" stroke-width="23.5" stroke-linecap="butt" />
                                <ellipse cx="210" cy="100" rx="11.5" ry="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
                                <ellipse cx="300" cy="190" rx="11.5" ry="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

                                <!-- 氣室文字標註 -->
                                <text x="75" y="172" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">氣室</text>
                                <text x="75" y="198" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="800">P<tspan font-size="14" dy="3">gas</tspan></text>

                                <!-- 等壓基準線 (對齊右水銀面 y=190) -->
                                <line x1="120" y1="190" x2="330" y2="190" stroke="#f87171" stroke-width="2" stroke-dasharray="6,4" />
                                <rect x="125" y="196" width="85" height="19" rx="4" fill="rgba(15,23,42,0.9)" stroke="#f87171" stroke-width="1"/>
                                <text x="167" y="210" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">等壓基準線</text>

                                <!-- 左水銀面高度虛線 (y=100) -->
                                <line x1="120" y1="100" x2="225" y2="100" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5,3" />

                                <!-- 高度差 h 雙向標註（精確頂天立地箭頭） -->
                                <line x1="145" y1="108" x2="145" y2="182" stroke="#fbbf24" stroke-width="2.5" />
                                <polygon points="145,100 139,110 151,110" fill="#fbbf24" />
                                <polygon points="145,190 139,180 151,180" fill="#fbbf24" />
                                <text x="156" y="152" fill="#fbbf24" font-size="20" font-weight="800">h</text>

                                <!-- 大氣壓直射向下箭頭（直接繪製向下多邊形三角形，絕不偏向） -->
                                <line x1="300" y1="12" x2="300" y2="35" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
                                <polygon points="300,43 293,33 307,33" fill="#f87171" />
                                <text x="300" y="8" text-anchor="middle" fill="#f87171" font-size="14" font-weight="800">Patm (外壓)</text>
                            </svg>
                        </div>

                        <!-- 滿版公式：Pgas + h = Patm -->
                        <div class="formula-box" style="border-left-color: var(--accent-red);">
                            $$P_{\text{gas}} + h = P_{\text{atm}}$$
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
