<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1-1 化學反應與守恆 · 五大化學反應基本類型 | 互動教學</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a; --text-main: #f8fafc;
            --accent-blue: #38bdf8; --accent-green: #34d399; --accent-red: #f87171;
            --accent-yellow: #fbbf24; --accent-purple: #a78bfa; --accent-cyan: #22d3ee;
            --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #presentation-area { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container {
            position: absolute;
            top: 1.2vh; left: 1.8vw; right: 1.8vw; bottom: 1.2vh;
        }
        .slide {
            position: absolute; inset: 0; padding: 0.15rem 0.15rem;
            opacity: 1; pointer-events: auto;
            display: flex; flex-direction: column; overflow: hidden; height: 100%;
        }
        h1 {
            color: var(--accent-cyan); font-size: clamp(1.3rem, 1.85vw, 1.75rem);
            margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.6rem;
            border-bottom: 2px solid rgba(34,211,238,0.25); padding-bottom: 0.25rem; flex-shrink: 0;
        }
        h1::before { content: ""; width: 7px; height: 24px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }
        h2 { font-size: clamp(1.05rem, 1.35vw, 1.3rem); margin-bottom: 0.3rem; font-weight: 700; flex-shrink: 0; }
        p, li { font-size: clamp(0.9rem, 1.05vw, 1.05rem); line-height: 1.55; }
        strong { color: var(--accent-cyan); font-weight: 700; }
        em { color: var(--accent-yellow); font-style: normal; font-weight: 600; }

        .grid-2 {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            gap: 0.85rem;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border); border-radius: 14px;
            padding: 0.95rem 1.2rem; backdrop-filter: blur(12px);
            display: flex; flex-direction: column; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
            min-height: 0; overflow-y: auto; gap: 0.65rem;
        }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }

        .tab-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.75); border-radius: 8px; padding: 9px 14px;
            font-size: 0.9rem; font-weight: 600; text-align: left; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: space-between;
        }
        .tab-btn:hover {
            background: rgba(56,189,248,0.12); border-color: var(--accent-cyan); color: #fff;
            transform: translateX(3px);
        }
        .tab-btn.active {
            background: linear-gradient(90deg, rgba(34,211,238,0.2), rgba(167,139,250,0.2));
            border-color: var(--accent-cyan); color: #fff; font-weight: 700;
            box-shadow: 0 0 12px rgba(34,211,238,0.25);
        }

        .formula-box {
            background: rgba(0,0,0,0.38); border-radius: 10px; border-left: 4.5px solid var(--accent-green);
            padding: 0.65rem 0.9rem; text-align: center;
            font-size: 1.15rem; flex-shrink: 0;
        }

        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr !important; overflow-y: auto; }
            body, html, #app, #presentation-area { overflow: auto; }
            .slide { position: relative; height: auto; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="presentation-area">
        <div id="slides-container">
            <div class="slide active">
                <h1>1-1 化學反應與守恆 · 五大化學反應基本類型</h1>
                <div class="grid-2">
                    <!-- 左欄：分類按鈕與通式架構 -->
                    <div class="panel">
                        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 0.4rem;">
                            <h2 style="color: var(--accent-cyan); margin: 0;">反應類型選擇清單</h2>
                            <span style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">點擊切換右側解析</span>
                        </div>

                        <p style="color: #94a3b8; font-size: 0.88rem; margin-bottom: 0.2rem;">
                            化學反應依反應物與生成物的組成變化模式，可系統化歸納為五大基礎型態：
                        </p>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="tab-btn active" data-type="synthesis">
                                <span>1. 化合反應 (Synthesis)</span>
                                <span style="font-size:0.8rem; color:var(--accent-green);">$A + B \rightarrow AB$</span>
                            </button>
                            <button class="tab-btn" data-type="decomp">
                                <span>2. 分解反應 (Decomposition)</span>
                                <span style="font-size:0.8rem; color:var(--accent-yellow);">$AB \rightarrow A + B$</span>
                            </button>
                            <button class="tab-btn" data-type="single">
                                <span>3. 單置換反應 (Single Displacement)</span>
                                <span style="font-size:0.8rem; color:var(--accent-blue);">$A + BC \rightarrow AC + B$</span>
                            </button>
                            <button class="tab-btn" data-type="double">
                                <span>4. 雙置換反應 (Double Displacement)</span>
                                <span style="font-size:0.8rem; color:var(--accent-purple);">$AB + CD \rightarrow AD + CB$</span>
                            </button>
                            <button class="tab-btn" data-type="combustion">
                                <span>5. 燃燒反應 (Combustion)</span>
                                <span style="font-size:0.8rem; color:var(--accent-red);">烴類 $+ \mathrm{O_2} \rightarrow \mathrm{CO_2} + \mathrm{H_2O}$</span>
                            </button>
                        </div>

                        <div style="background: rgba(167,139,250,0.08); border-left: 3.5px solid var(--accent-purple); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.88rem; line-height: 1.6; margin-top: auto;">
                            📌 <strong>記憶口訣：</strong><br>
                            化合<strong>「多變一」</strong>、分解<strong>「一變多」</strong>、<br>
                            單置換<strong>「強搶弱」</strong>、雙置換<strong>「互換伴」</strong>、燃燒<strong>「放光熱」</strong>！
                        </div>
                    </div>

                    <!-- 右欄：動態反應詳解展示卡 -->
                    <div class="panel" id="rxn-detail-panel" style="background: rgba(255,255,255,0.025);">
                        <div id="rxn-content-box">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const RXN_DATA = {
    synthesis: {
        title: "🔗 1. 化合反應 (Synthesis / Combination)",
        color: "var(--accent-green)",
        sub: "兩種或多種物質（單質或化合物）相互化合，生成一種新物質的反應：",
        general: "A + B \\longrightarrow AB",
        eq: "2\\,\\mathrm{H_{2(g)}} + \\mathrm{O_{2(g)}} \\longrightarrow 2\\,\\mathrm{H_2O_{(l)}} \\quad (\\Delta H < 0)",
        details: [
            "<strong>金屬氧化：</strong>鎂帶在空氣中劇烈燃燒發出強烈白光：$2\\,\\mathrm{Mg_{(s)}} + \\mathrm{O_{2(g)}} \\rightarrow 2\\,\\mathrm{MgO_{(s)}}$",
            "<strong>非金屬氧化：</strong>硫磺燃燒產生刺激性二氧化硫：$\\mathrm{S_{(s)}} + \\mathrm{O_{2(g)}} \\rightarrow \\mathrm{SO_{2(g)}}$",
            "<strong>工業哈伯法合成氨：</strong>高壓高溫鐵觸媒下：$\\mathrm{N_{2(g)}} + 3\\,\\mathrm{H_{2(g)}} \\rightleftharpoons 2\\,\\mathrm{NH_{3(g)}}$"
        ],
        badge: "特徵：反應物多項，生成物僅單一項"
    },
    decomp: {
        title: "💥 2. 分解反應 (Decomposition)",
        color: "var(--accent-yellow)",
        sub: "一種化合物在受熱、通電或催化劑作用下，分解成兩種或多種較簡單物質的反應：",
        general: "AB \\longrightarrow A + B",
        eq: "2\\,\\mathrm{KClO_{3(s)}} \\xrightarrow{\\mathrm{MnO_2},\\,\\Delta} 2\\,\\mathrm{KCl_{(s)}} + 3\\,\\mathrm{O_{2(g)}}",
        details: [
            "<strong>碳酸鈣高溫煅燒：</strong>石灰石受熱分解製備生石灰：$\\mathrm{CaCO_{3(s)}} \\xrightarrow{\\Delta} \\mathrm{CaO_{(s)}} + \\mathrm{CO_{2(g)}}$",
            "<strong>電解水：</strong>直流電促使水分解為氫氣與氧氣：$2\\,\\mathrm{H_2O_{(l)}} \\xrightarrow{\\text{電解}} 2\\,\\mathrm{H_{2(g)}} + \\mathrm{O_{2(g)}}$",
            "<strong>雙氧水催化分解：</strong>二氧化錳催化生成氧氣：$2\\,\\mathrm{H_2O_{2(aq)}} \\xrightarrow{\\mathrm{MnO_2}} 2\\,\\mathrm{H_2O_{(l)}} + \\mathrm{O_{2(g)}}$"
        ],
        badge: "特徵：反應物僅單一項，生成物有多項"
    },
    single: {
        title: "🔄 3. 單置換反應 (Single Displacement)",
        color: "var(--accent-blue)",
        sub: "由一種單質與一種化合物反應，置換出化合物中的另一種單質：",
        general: "A + BC \\longrightarrow AC + B",
        eq: "\\mathrm{Zn_{(s)}} + 2\\,\\mathrm{HCl_{(aq)}} \\longrightarrow \\mathrm{ZnCl_{2(aq)}} + \\mathrm{H_{2(g)}}",
        details: [
            "<strong>金屬活性規律（強換弱）：</strong>鋅金屬活性大於氫，能置換出酸中的氫離子產生氫氣泡。",
            "<strong>浸銅實驗：</strong>鐵釘置入藍色硫酸銅溶液中，表面析出紅褐色金屬銅，溶液轉為淡綠色亞鐵離子：$\\mathrm{Fe_{(s)}} + \\mathrm{CuSO_{4(aq)}} \\rightarrow \\mathrm{FeSO_{4(aq)}} + \\mathrm{Cu_{(s)}}$",
            "<strong>鹵素活性置換：</strong>較活潑的氯氣可置換出溴化鈉中的溴單質：$\\mathrm{Cl_{2(g)}} + 2\\,\\mathrm{NaBr_{(aq)}} \\rightarrow 2\\,\\mathrm{NaCl_{(aq)}} + \\mathrm{Br_{2(aq)}}$"
        ],
        badge: "特徵：單質 + 化合物 $\\rightarrow$ 新化合物 + 新單質"
    },
    double: {
        title: "🤝 4. 雙置換反應 (Double Displacement)",
        color: "var(--accent-purple)",
        sub: "兩種化合物在水溶液中互相交換離子成分，生成另外兩種新化合物：",
        general: "AB + CD \\longrightarrow AD + CB",
        eq: "\\mathrm{AgNO_{3(aq)}} + \\mathrm{NaCl_{(aq)}} \\longrightarrow \\mathrm{AgCl_{(s)}\\downarrow} + \\mathrm{NaNO_{3(aq)}}",
        details: [
            "<strong>反應三大驅動力：</strong>通常伴隨生成<strong>難溶性沉澱</strong>（如 $\\mathrm{AgCl\\downarrow}$、$\\mathrm{BaSO_4\\downarrow}$）、<strong>難解離弱電解質水</strong>或<strong>逸出氣體</strong>。",
            "<strong>酸鹼中和反應：</strong>強酸與強鹼生成鹽與水：$\\mathrm{HCl_{(aq)}} + \\mathrm{NaOH_{(aq)}} \\rightarrow \\mathrm{NaCl_{(aq)}} + \\mathrm{H_2O_{(l)}}$",
            "<strong>生成氣體：</strong>碳酸鹽遇酸產生二氧化碳氣泡：$\\mathrm{CaCO_{3(s)}} + 2\\,\\mathrm{HCl_{(aq)}} \\rightarrow \\mathrm{CaCl_{2(aq)}} + \\mathrm{H_2O_{(l)}} + \\mathrm{CO_{2(g)}\\uparrow}$"
        ],
        badge: "特徵：離子互換配對，各元素氧化數不變"
    },
    combustion: {
        title: "🔥 5. 燃燒反應 (Combustion)",
        color: "var(--accent-red)",
        sub: "物質與助燃劑（通常為氧氣）進行之劇烈氧化還原反應，並伴隨大量熱能與可見光釋放：",
        general: "\\text{燃料} + \\mathrm{O_2} \\longrightarrow \\text{氧化物產物} + \\text{光熱}",
        eq: "\\mathrm{C_3H_{8(g)}} + 5\\,\\mathrm{O_{2(g)}} \\longrightarrow 3\\,\\mathrm{CO_{2(g)}} + 4\\,\\mathrm{H_2O_{(l)}} \\quad (\\Delta H = -2220\\,\\mathrm{kJ})",
        details: [
            "<strong>烴類完全燃燒：</strong>只含有碳、氫兩元素的有機物，在氧氣充足下完全燃燒產物必為 $\\mathrm{CO_2}$ 與 $\\mathrm{H_2O}$。",
            "<strong>不完全燃燒之危害：</strong>氧氣供應不足時，燃燒不完全會生成具強毒性的一氧化碳 ($\\mathrm{CO}$) 或碳黑煙塵粒。",
            "<strong>燃燒必為放熱反應：</strong>反應焓變 $\\Delta H < 0$，體系向環境釋放大量熱能。"
        ],
        badge: "特徵：劇烈發光放熱，氧氣參與氧化還原"
    }
};

function renderDetail(typeKey) {
    const data = RXN_DATA[typeKey];
    if (!data) return;
    const box = document.getElementById('rxn-content-box');

    box.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 0.4rem;">
            <h2 style="color: ${data.color}; margin: 0;">${data.title}</h2>
            <span style="font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e2e8f0;">
                ${data.badge}
            </span>
        </div>

        <p style="color: #cbd5e1; line-height: 1.6; margin-top: 0.6rem;">${data.sub}</p>

        <div class="formula-box" style="border-left-color: ${data.color}; margin: 0.4rem 0;">
            $$${data.eq}$$
        </div>

        <div style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 0.75rem 1rem; margin-top: 0.5rem;">
            <strong style="color: var(--accent-yellow); font-size: 0.95rem; display: block; margin-bottom: 0.35rem;">典型化學反應實例：</strong>
            <ul style="margin-left: 1.2rem; line-height: 1.7; font-size: 0.9rem; color: #e2e8f0;">
                ${data.details.map(d => `<li style="margin-bottom:0.25rem;">${d}</li>`).join('')}
            </ul>
        </div>
    `;

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([box]).catch(function(){});
    }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDetail(btn.dataset.type);
    });
});

window.addEventListener('DOMContentLoaded', () => renderDetail('synthesis'));
</script>
</body>
</html>
