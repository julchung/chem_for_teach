<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>氫鍵 | 互動教學</title>
    <meta name="description" content="選修化學二：氫鍵的定義、形成條件、分類與對物性的影響互動教學">
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://3dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a; --text-main: #f8fafc;
            --accent-blue: #38bdf8; --accent-green: #34d399; --accent-red: #f87171;
            --accent-yellow: #fbbf24; --accent-purple: #a78bfa; --accent-cyan: #22d3ee;
            --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #start-overlay { display: none !important; }
        .start-badge {
            font-size: 0.92rem; color: var(--accent-purple);
            background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.35);
            padding: 0.3rem 1.1rem; border-radius: 40px; margin-bottom: 1rem; letter-spacing: 0.06em;
        }
        .start-title {
            font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 900; text-align: center; line-height: 1.15;
            color: var(--accent-blue); text-shadow: 0 0 40px rgba(56,189,248,0.35);
        }
        .start-sub { font-size: 1.15rem; color: rgba(248,250,252,0.55); margin: 0.7rem 0 2rem; text-align: center; max-width: 90%; }
        .btn-start {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: #0f172a; border: none;
            padding: 1.1rem 3rem; border-radius: 60px; font-size: 1.35rem; font-weight: 800;
            box-shadow: 0 0 35px rgba(56,189,248,0.5); cursor: pointer; touch-action: manipulation;
            transition: 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .btn-start:hover { transform: scale(1.06); }
        .start-info { margin-top: 1.6rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        .info-chip { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: rgba(248,250,252,0.5); }

        #presentation-area { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container { position: absolute; top: 1.5vh; left: 3vw; right: 4px; bottom: 2vh; }
        .slide {
            position: absolute; inset: 0; padding: 0.6rem 0.3rem;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease; transform: scale(0.99);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .slide.active { opacity: 1; pointer-events: auto; z-index: 10; transform: scale(1); }

        h1 {
            color: var(--accent-blue); font-size: clamp(1.35rem, 2.3vw, 1.95rem);
            margin-bottom: 0.55rem; display: flex; align-items: center; gap: 0.6rem;
            border-bottom: 2px solid rgba(56,189,248,0.25); padding-bottom: 0.3rem; flex-shrink: 0;
        }
        h1::before { content: ""; width: 7px; height: 26px; background: var(--accent-blue); border-radius: 4px; flex-shrink: 0; }
        h2 { color: var(--accent-yellow); font-size: clamp(0.95rem, 1.45vw, 1.2rem); margin: 0.25rem 0; font-weight: 700; flex-shrink: 0; }
        p, li { font-size: clamp(0.84rem, 1.12vw, 1.02rem); line-height: 1.48; margin-bottom: 0.3rem; }
        strong { color: var(--accent-cyan); font-weight: 700; }
        em { color: var(--accent-blue); font-style: normal; font-weight: 600; }
        ul { margin-left: 1.2rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; flex: 1; min-height: 0; overflow: hidden; }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border); border-radius: 16px;
            padding: 0.9rem 1rem; backdrop-filter: blur(12px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.35);
        }
        .scroll-panel { overflow-y: auto; }
        .scroll-panel::-webkit-scrollbar { width: 4px; }
        .scroll-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }
        .formula-box {
            background: rgba(0,0,0,0.38); border-radius: 10px; border-left: 5px solid var(--accent-green);
            padding: 0.65rem; margin: 0.4rem 0; text-align: center;
            font-size: clamp(1rem, 1.5vw, 1.3rem); flex-shrink: 0;
        }
        .info-card {
            background: rgba(56,189,248,0.08); border-radius: 11px;
            padding: 0.65rem; border: 1px solid rgba(56,189,248,0.28); margin: 0.35rem 0; flex-shrink: 0;
        }
        .highlight-box {
            background: rgba(167,139,250,0.08); border-radius: 11px;
            padding: 0.65rem; border: 1px solid rgba(167,139,250,0.3); margin: 0.35rem 0; flex-shrink: 0;
        }
        .tag { display: inline-block; padding: 0.08rem 0.5rem; border-radius: 18px; font-size: 0.74rem; font-weight: 700; margin-right: 0.2rem; }
        .tag-blue { background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.45); color: var(--accent-blue); }
        .tag-green { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.4); color: var(--accent-green); }
        .tag-red { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.4); color: var(--accent-red); }
        .tag-purple { background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.4); color: var(--accent-purple); }
        table.data-table { width: 100%; border-collapse: collapse; font-size: clamp(0.75rem, 0.95vw, 0.9rem); }
        table.data-table th, table.data-table td { border: 1px solid rgba(255,255,255,0.12); padding: 0.35rem 0.4rem; text-align: center; }
        table.data-table th { background: rgba(56,189,248,0.12); color: var(--accent-blue); }
        .svg-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .svg-wrap svg { max-width: 100%; max-height: 100%; display: block; }
        .diagram-panel {
            flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.32); border-radius: 12px; padding: 0.35rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .quiz-item {
            background: rgba(0,0,0,0.22); border-radius: 12px; padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1); flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative;
        }
        .quiz-options { list-style: none; margin: 0.4rem 0 0; padding: 0; }
        .quiz-options li { font-size: clamp(0.86rem, 1.1vw, 0.98rem); padding: 0.3rem 0.45rem; margin-bottom: 0.12rem; border-radius: 7px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
        .quiz-options li span.opt-label { color: var(--accent-blue); font-weight: 700; min-width: 2em; display: inline-block; }
        .ans-overlay {
            display: none; position: absolute; inset: 0; background: rgba(15,23,42,0.97); z-index: 100;
            flex-direction: column; padding: 1.1rem; border-radius: 16px; border: 2px solid var(--accent-green);
            animation: fadeIn 0.3s ease; overflow-y: auto;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .btn-action {
            background: var(--accent-blue); color: #0f172a; border: none; padding: 0.6rem 1.3rem;
            border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 0.92rem;
            align-self: flex-start; margin-top: 0.35rem; flex-shrink: 0; position: relative; z-index: 110; touch-action: manipulation;
        }
        .btn-action:hover { filter: brightness(1.1); transform: scale(1.03); }
        /* Game */
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.2); border-radius: 20px; overflow: hidden; margin-top: 0.5rem; min-height: 0; }
        .game-columns { display: flex; justify-content: space-between; height: 100%; padding: 16px 32px; position: relative; z-index: 10; }
        #left-column, #right-column { width: 40%; display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
        .game-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px; border-radius: 12px; display: flex; align-items: center;
            width: 100%; min-height: 45px; height: 9vh; max-height: 72px; position: relative;
            font-size: clamp(0.78rem, 1.1vw, 1rem);
        }
        #left-column .game-item { justify-content: flex-start; text-align: left; }
        #right-column .game-item { justify-content: flex-end; text-align: right; }
        .dot {
            width: 16px; height: 16px; background: #fff; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5); transition: 0.2s; flex-shrink: 0; z-index: 5; touch-action: none;
        }
        .left-dot { margin-left: auto; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); }
        .right-dot { margin-right: auto; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); }
        .dot.active { background: var(--accent-green); box-shadow: 0 0 15px var(--accent-green); pointer-events: none; }
        #game-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #game-feedback {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(52,211,153,0.95); padding: 1.5rem 3rem; border-radius: 20px;
            font-size: clamp(1.2rem, 3vw, 2rem); color: #0f172a; font-weight: 900;
            box-shadow: 0 0 50px rgba(52,211,153,0.5); z-index: 100; text-align: center;
        }
        /* Toolbar */
        #toolbar {
            position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
            background: rgba(15,23,42,0.9); padding: 12px 6px; border-radius: 30px;
            display: flex; flex-direction: column; gap: 9px; align-items: center; z-index: 9000;
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            backdrop-filter: blur(20px); width: 50px;
        }
        .btn-tool {
            background: transparent; color: rgba(255,255,255,0.65);
            border: 1px solid rgba(255,255,255,0.15); width: 34px; height: 34px;
            border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.25s; font-size: 1rem;
        }
        .btn-tool:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-tool.active-tool { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(56,189,248,0.5); }
        .btn-tool:focus { outline: none; }
        #drag-handle { width: 100%; text-align: center; color: rgba(255,255,255,0.4); cursor: grab; font-size: 1.3rem; line-height: 0.5; }
        #slide-info {
            position: fixed; bottom: 16px; right: 16px; z-index: 9000; text-align: right;
            font-size: 0.92rem; color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5); padding: 5px 14px; border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.15); font-weight: 700;
        }
        #drawing-layer { position: fixed; inset: 0; z-index: 5; pointer-events: none; touch-action: none; }
        #drawing-layer.drawing-active { pointer-events: auto; z-index: 120; }
        /* Slide intro larger font */
        .slide-intro h1 { font-size: clamp(1.85rem, 3.2vw, 2.6rem); }
        .slide-intro h2 { font-size: clamp(1.2rem, 1.95vw, 1.55rem); }
        .slide-intro p, .slide-intro li { font-size: clamp(1.05rem, 1.55vw, 1.22rem); line-height: 1.55; }
        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr !important; }
            #slides-container { right: 4px; }
            .game-columns { padding: 12px 16px; }
        }
        /* H-bond glow */
        .hbond-line { stroke: var(--accent-purple); stroke-width: 3.5; stroke-dasharray: 8,5; filter: drop-shadow(0 0 4px var(--accent-purple)); }
        .delta-plus { fill: #93c5fd; font-weight: 700; }
        .delta-minus { fill: #fca5a5; font-weight: 700; }
    </style>
</head>
<style>
/* random draw styles */
.draw-ball { width:40px;height:40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, #cbd5e1); color:#0b1120; font-weight:bold; font-size:1.2rem; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 6px rgba(0,0,0,0.3), inset -2px -2px 6px rgba(0,0,0,0.2); border:2px solid #94a3b8; transition:all 0.3s ease; }
.draw-ball.flicker { background:radial-gradient(circle at 30% 30%, #fff, var(--accent-gold)); border-color:var(--accent-gold); box-shadow:0 0 15px var(--accent-gold); transform:scale(1.1); color:#fff; }
.draw-ball.winner { background:radial-gradient(circle at 30% 30%, #fff, var(--accent-green)); border-color:var(--accent-green); box-shadow:0 0 20px var(--accent-green); transform:scale(1.2); color:#fff; z-index:10; }
.draw-ball.drawn { background:radial-gradient(circle at 30% 30%, #475569, #1e293b); border-color:#0f172a; color:#94a3b8; box-shadow:none; opacity:0.6; }
</style>
<body>
<div id="app">
    <div id="presentation-area">
        <div id="slides-container">
<div class="slide active" id="slide-special">
                <h1>特殊的氫鍵例子</h1>
                <div style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.9rem; flex: 1; min-height: 0;">
                    
                    <!-- (1) HCN -->
                    <div class="panel" style="display: flex; flex-direction: column;">
                        <div style="color:var(--accent-blue); font-weight:700; font-size:1.1rem; margin-bottom:0.2rem;">(1) HCN（氰化氫）</div>
                        <p style="font-size:0.85rem; color:rgba(255,255,255,0.85); margin-bottom:0.4rem; line-height:1.4;">本應不會有氫鍵，但因 C、N 間為參鍵極易吸引電子，使 H 帶部分正電荷，造成分子間有氫鍵的形成。</p>
                        <div class="svg-wrap" style="flex:1; background:rgba(0,0,0,0.25); border-radius:8px; padding:0.5rem; border:1px solid rgba(255,255,255,0.05);">
                            <svg viewBox="0 0 350 120" style="width:100%; height:100%;">
                                <g transform="translate(30, 15) scale(0.9)">
                                    <text x="30" y="55" fill="#fff" font-size="18" font-weight="700">H</text>
                                    <line x1="45" y1="49" x2="70" y2="49" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <text x="75" y="55" fill="#fff" font-size="18" font-weight="700">C</text>
                                    <line x1="95" y1="43" x2="120" y2="43" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <line x1="95" y1="49" x2="120" y2="49" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <line x1="95" y1="55" x2="120" y2="55" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <text x="125" y="55" fill="var(--accent-cyan)" font-size="18" font-weight="700">N</text>
                                    
                                    <line x1="145" y1="49" x2="195" y2="49" stroke="var(--accent-purple)" stroke-width="3" stroke-dasharray="6,5"/>
                                    <text x="170" y="38" fill="var(--accent-purple)" font-size="12" text-anchor="middle">氫鍵</text>
                                    
                                    <text x="205" y="55" fill="#fff" font-size="18" font-weight="700">H</text>
                                    <line x1="220" y1="49" x2="245" y2="49" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <text x="250" y="55" fill="#fff" font-size="18" font-weight="700">C</text>
                                    <line x1="270" y1="43" x2="295" y2="43" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <line x1="270" y1="49" x2="295" y2="49" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <line x1="270" y1="55" x2="295" y2="55" stroke="#cbd5e1" stroke-width="2.5"/>
                                </g>
                            </svg>
                        </div>
                    </div>

                    <!-- (2) CHCl3 + Acetone -->
                    <div class="panel" style="display: flex; flex-direction: column;">
                        <div style="color:var(--accent-green); font-weight:700; font-size:1.1rem; margin-bottom:0.2rem;">(2) 三氯甲烷與丙酮</div>
                        <p style="font-size:0.85rem; color:rgba(255,255,255,0.85); margin-bottom:0.4rem; line-height:1.4;">氯仿溶於丙酮時，因三個氯強拉電子，使 C-H 鍵的 H 帶正電與丙酮的 O 產生氫鍵，造成溶液蒸氣壓呈負偏差。</p>
                        <div class="svg-wrap" style="flex:1; display:flex; flex-direction:row; background:rgba(0,0,0,0.25); border-radius:8px; padding:0.5rem; border:1px solid rgba(255,255,255,0.05); align-items:center; justify-content:space-between;">
                            <!-- Molecule -->
                            <svg viewBox="0 0 250 120" style="width:40%; height:100%;">
                                <g transform="translate(0, 10) scale(0.8)">
                                    <text x="10" y="55" fill="#fca5a5" font-size="18">Cl</text>
                                    <line x1="30" y1="49" x2="45" y2="49" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="50" y="55" fill="#fff" font-size="18">C</text>
                                    <line x1="58" y1="35" x2="58" y2="15" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="52" y="10" fill="#fca5a5" font-size="18">Cl</text>
                                    <line x1="58" y1="60" x2="58" y2="80" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="52" y="95" fill="#fca5a5" font-size="18">Cl</text>
                                    <line x1="68" y1="49" x2="85" y2="49" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="90" y="55" fill="#fff" font-size="18">H</text>
                                    
                                    <line x1="110" y1="49" x2="160" y2="49" stroke="var(--accent-purple)" stroke-width="4" stroke-dasharray="6,5"/>
                                    <text x="135" y="38" fill="var(--accent-purple)" font-size="14" text-anchor="middle">氫鍵</text>
                                    
                                    <text x="165" y="55" fill="var(--accent-red)" font-size="18" font-weight="700">O</text>
                                    <line x1="185" y1="45" x2="205" y2="45" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <line x1="185" y1="53" x2="205" y2="53" stroke="#cbd5e1" stroke-width="2.5"/>
                                    <text x="210" y="55" fill="#fff" font-size="18">C</text>
                                    <line x1="225" y1="42" x2="250" y2="20" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="255" y="20" fill="#cbd5e1" font-size="15">CH₃</text>
                                    <line x1="225" y1="58" x2="250" y2="80" stroke="#cbd5e1" stroke-width="2"/>
                                    <text x="255" y="90" fill="#cbd5e1" font-size="15">CH₃</text>
                                </g>
                            </svg>

                            <!-- Detailed Raoult's Curve -->
                            <svg viewBox="-40 -20 280 200" style="width:60%; height:100%;">
                                <!-- Axes -->
                                <line x1="0" y1="0" x2="0" y2="140" stroke="#fff" stroke-width="1.5"/>
                                <line x1="200" y1="0" x2="200" y2="140" stroke="#fff" stroke-width="1.5"/>
                                <line x1="0" y1="140" x2="200" y2="140" stroke="#fff" stroke-width="1.5"/>
                                
                                <!-- Ticks -->
                                <line x1="0" y1="140" x2="0" y2="135" stroke="#fff" stroke-width="1.5"/>
                                <line x1="40" y1="140" x2="40" y2="135" stroke="#fff" stroke-width="1.5"/>
                                <line x1="80" y1="140" x2="80" y2="135" stroke="#fff" stroke-width="1.5"/>
                                <line x1="120" y1="140" x2="120" y2="135" stroke="#fff" stroke-width="1.5"/>
                                <line x1="160" y1="140" x2="160" y2="135" stroke="#fff" stroke-width="1.5"/>
                                <line x1="200" y1="140" x2="200" y2="135" stroke="#fff" stroke-width="1.5"/>

                                <line x1="0" y1="0" x2="5" y2="0" stroke="#fff" stroke-width="1.5"/>
                                <line x1="0" y1="35" x2="5" y2="35" stroke="#fff" stroke-width="1.5"/>
                                <line x1="0" y1="70" x2="5" y2="70" stroke="#fff" stroke-width="1.5"/>
                                <line x1="0" y1="105" x2="5" y2="105" stroke="#fff" stroke-width="1.5"/>

<script>

/* ---- Chart drawing (same as 04 reference) ---- */
function drawChartGeneral(canvasId, type, dataset, groups, highlightIdx) {
    highlightIdx = highlightIdx !== undefined ? highlightIdx : -1;
    const cvs = document.getElementById(canvasId);
    if (!cvs) return;
    const rect = cvs.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const dpr = window.devicePixelRatio || 1;
    cvs.width = rect.width * dpr; cvs.height = rect.height * dpr;
    const g = cvs.getContext('2d');
    g.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    g.clearRect(0, 0, w, h);
    const pad = { l: 42, r: 18, t: 18, b: 28 };
    const gw = w - pad.l - pad.r, gh = h - pad.t - pad.b;
    const valsAll = dataset.flatMap(ds => type === 'bp' ? ds.bp : ds.mp);
    const minT = Math.floor(Math.min(...valsAll) / 50) * 50;
    const maxT = Math.ceil(Math.max(...valsAll) / 50) * 50;
    const yScale = v => pad.t + gh - ((v - minT) / (maxT - minT)) * gh;
    const xScale = i => pad.l + (i + 0.5) * (gw / groups.length);
    // grid lines
    g.strokeStyle = 'rgba(255,255,255,0.08)';
    for (let t = minT; t <= maxT; t += 50) {
        let yt = yScale(t);
        g.beginPath(); g.moveTo(pad.l, yt); g.lineTo(pad.l + gw, yt); g.stroke();
        g.fillStyle = '#94a3b8'; g.font = '10px sans-serif'; g.textAlign = 'right';
        g.fillText(t, pad.l - 4, yt + 4);
    }
    // x labels
    groups.forEach((grp, i) => {
        g.fillStyle = '#cbd5e1'; g.font = '11px sans-serif'; g.textAlign = 'center';
        g.fillText(grp, xScale(i), pad.t + gh + 18);
    });
    // data lines and points
    dataset.forEach(ds => {
        const vals = type === 'bp' ? ds.bp : ds.mp;
        g.strokeStyle = ds.color; g.lineWidth = 2.5;
        g.beginPath();
        vals.forEach((v, i) => { const x = xScale(i), y = yScale(v); i === 0 ? g.moveTo(x, y) : g.lineTo(x, y); });
        g.stroke();
        vals.forEach((v, i) => {
            const x = xScale(i), y = yScale(v);
            if (i === highlightIdx) {
                g.fillStyle = '#fde047'; g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill();
                g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
            } else {
                g.fillStyle = ds.color; g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill();
            }
        });
        // name labels for the 2nd period (annotate anomalous)
        if (ds.names && ds.p === '2') {
            ds.names.forEach((nm, i) => {
                const x = xScale(i), y = yScale(vals[i]);
                g.fillStyle = ds.color; g.font = 'bold 10px sans-serif'; g.textAlign = 'center';
                g.fillText(nm, x, y - 10);
            });
        }
    });
}

function initBP() {
    const groups = ['4A族', '5A族', '6A族', '7A族'];
    const dataset = [
        { p: '2', color: '#f87171', bp: [-161, -33, 100, 19.5], mp: [-182, -78, 0, -83], names: ['CH₄','NH₃','H₂O','HF'] },
        { p: '3', color: '#38bdf8', bp: [-112, -88, -60, -85], mp: [-185, -134, -82, -114] },
        { p: '4', color: '#a78bfa', bp: [-88, -62, -41, -67], mp: [-165, -116, -66, -87] },
        { p: '5', color: '#4ade80', bp: [-52, -17, -2, -35], mp: [-150, -88, -49, -51] }
    ];
    const getSelected = () => {
        const rads = document.getElementsByName('period-sel');
        for (let r of rads) if (r.checked) return r.value;
        return 'all';
    };
    const draw = () => {
        const sel = getSelected();
        const dsf = sel === 'all' ? dataset : dataset.filter(d => d.p === sel);
        drawChartGeneral('canvas-bp-h', 'bp', dsf, groups);
        drawChartGeneral('canvas-mp-h', 'mp', dsf, groups);
    };
    draw();
    window._bpDraw = draw;
    document.getElementsByName('period-sel').forEach(r => r.addEventListener('change', draw));
}

/* ---- Drawing layer ---- */
let currentSlide = 0, isDrawingMode = false, drawMode = 'pen', penColor = '#f8fafc';
let slideDrawings = {}, lastX = 0, lastY = 0, isDrawing = false;
const slides = document.querySelectorAll('.slide');
const slideInfo = document.getElementById('slide-info');
const canvas = document.getElementById('drawing-layer');
const ctx = canvas ? canvas.getContext('2d') : null;

function resizeCanvas() {
    if (!canvas || !ctx) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    restoreDrawing();
    if (slides[currentSlide] && slides[currentSlide].id === 'slide-game') drawConnections();
}
window.addEventListener('resize', resizeCanvas);
if (canvas && ctx) resizeCanvas();

function getCoords(e) {
    if (!canvas) return [0, 0];
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return [cx - rect.left, cy - rect.top];
}
function startDrawing(e) { if (!isDrawingMode || !ctx) return; isDrawing = true; [lastX, lastY] = getCoords(e); }
function draw(e) {
    if (!isDrawing || !ctx) return;
    const [x, y] = getCoords(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
    if (drawMode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 38;
        ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = penColor;
        ctx.lineWidth = 3.5;
    }
    ctx.lineCap = 'round'; ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    [lastX, lastY] = [x, y];
}
function stopDrawing() {
    if (isDrawing && canvas) { isDrawing = false; slideDrawings[currentSlide] = canvas.toDataURL(); }
}
function restoreDrawing() {
    if (!ctx || !canvas) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (slideDrawings[currentSlide]) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = slideDrawings[currentSlide];
    }
}
if (canvas) {
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', e => { if (isDrawingMode) e.preventDefault(); startDrawing(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (isDrawingMode) e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
}

    { left: 'H₂O 每分子氫鍵數', right: '平均 4 條' },

];

let connections = [], isDraggingGame = false, startDot = null, currentLine = null;
const GAME_COUNT = 5;

function initGame() {
    const leftCol = document.getElementById('left-column'), rightCol = document.getElementById('right-column');
    if (!leftCol || !rightCol) return;
    leftCol.innerHTML = ''; rightCol.innerHTML = ''; connections = [];
    document.getElementById('game-feedback').style.display = 'none';
    document.getElementById('game-svg').innerHTML = '';
    const selected = [...GAME_POOL].sort(() => Math.random() - 0.5).slice(0, GAME_COUNT).map((item, i) => ({ ...item, idx: i }));
    const shuffledRight = [...selected].sort(() => Math.random() - 0.5);
    selected.forEach(item => {
        const div = document.createElement('div'); div.className = 'game-item';
        div.innerHTML = '<span>' + item.left + '</span><div class="dot left-dot" data-index="' + item.idx + '"></div>';
        leftCol.appendChild(div);
    });
    shuffledRight.forEach(item => {
        const div = document.createElement('div'); div.className = 'game-item';
        div.innerHTML = '<div class="dot right-dot" data-index="' + item.idx + '"></div><span>' + item.right + '</span>';
        rightCol.appendChild(div);
    });
    document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('mousedown', gameDragStart);
        dot.addEventListener('touchstart', gameDragStart, { passive: false });
    });
}
function gameDragStart(e) {
    const dot = e.currentTarget;
    if (dot.classList.contains('active')) return;
    if (e.type === 'touchstart') e.preventDefault();
    isDraggingGame = true; startDot = dot;
    const svg = document.getElementById('game-svg');
    const dr = dot.getBoundingClientRect(), rect = svg.getBoundingClientRect();
    currentLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const x = dr.left + dr.width / 2 - rect.left, y = dr.top + dr.height / 2 - rect.top;
    currentLine.setAttribute('x1', x); currentLine.setAttribute('y1', y);
    currentLine.setAttribute('x2', x); currentLine.setAttribute('y2', y);
    currentLine.setAttribute('stroke', 'var(--accent-blue)'); currentLine.setAttribute('stroke-width', '4');
    svg.appendChild(currentLine);
}
function gameDragMove(e) {
    if (!isDraggingGame || !currentLine) return;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    const rect = document.getElementById('game-svg').getBoundingClientRect();
    currentLine.setAttribute('x2', cx - rect.left); currentLine.setAttribute('y2', cy - rect.top);
}
function gameDragEnd(e) {
    if (!isDraggingGame) return;
    isDraggingGame = false;
    const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    let targetDot = null;
    document.querySelectorAll('.dot').forEach(dot => {
        const r = dot.getBoundingClientRect();
        if (cx >= r.left - 14 && cx <= r.right + 14 && cy >= r.top - 14 && cy <= r.bottom + 14) targetDot = dot;
    });
    if (targetDot && targetDot !== startDot && startDot.classList.contains('left-dot') !== targetDot.classList.contains('left-dot') && !targetDot.classList.contains('active')) {
        const svg = document.getElementById('game-svg');
        const rect = svg.getBoundingClientRect(), r2 = targetDot.getBoundingClientRect();
        const x2 = r2.left + r2.width / 2 - rect.left;
        const y2 = r2.top + r2.height / 2 - rect.top;
        if (startDot.dataset.index === targetDot.dataset.index) {
            startDot.classList.add('active'); targetDot.classList.add('active');
            connections.push({ from: startDot, to: targetDot });
            currentLine.setAttribute('x2', x2); currentLine.setAttribute('y2', y2);
            currentLine.setAttribute('stroke', 'var(--accent-green)');
            currentLine = null;
            if (connections.length === GAME_COUNT) {
                const fb = document.getElementById('game-feedback');
                fb.style.display = 'block';
                setTimeout(() => { fb.style.display = 'none'; }, 2800);
            }
        } else {
            currentLine.setAttribute('stroke', 'var(--accent-red)');
            currentLine.setAttribute('x2', x2); currentLine.setAttribute('y2', y2);
            const bad = currentLine; currentLine = null;
            setTimeout(() => { if (bad && bad.parentNode) bad.remove(); }, 450);
        }
    } else {
        if (currentLine) currentLine.remove();
        currentLine = null;
    }
    startDot = null;
}
function drawConnections() {
    const svg = document.getElementById('game-svg');
    if (!svg) return;
    svg.innerHTML = '';
    const rect = svg.getBoundingClientRect();
    connections.forEach(c => {
        const r1 = c.from.getBoundingClientRect(), r2 = c.to.getBoundingClientRect();
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', r1.left + r1.width / 2 - rect.left);
        l.setAttribute('y1', r1.top + r1.height / 2 - rect.top);
        l.setAttribute('x2', r2.left + r2.width / 2 - rect.left);
        l.setAttribute('y2', r2.top + r2.height / 2 - rect.top);
        l.setAttribute('stroke', 'var(--accent-green)');
        l.setAttribute('stroke-width', '4');
        l.setAttribute('stroke-linecap', 'round');
        svg.appendChild(l);
    });
}
function resetGame() { initGame(); }

document.addEventListener('mousemove', gameDragMove);
document.addEventListener('mouseup', gameDragEnd);
document.addEventListener('touchmove', gameDragMove, { passive: false });
document.addEventListener('touchend', gameDragEnd);

(function () {

<script>
let cifViewer = null;
function openCifModal(filename) {
    const modal = document.getElementById('cif-modal');
    modal.style.display = 'flex';
    if (!cifViewer) {
        cifViewer = $3Dmol.createViewer('cif-viewer', {backgroundColor: 'var(--bg-dark)'});
    }
    // 為了解決本地端(無伺服器)開啟的 CORS 限制，直接內建 CIF 資料
    if (filename === 'NaHCO3.cif') {
        cifViewer.setBackgroundColor('#1e2a3a');
        cifViewer.clear();

        // ─── 動態生成多層 HCO₃⁻ 氫鍵平面 (3層堆疊) ───
        let atomLines = [];
        let coBonds = [];
        let ohBonds = [];
        let hBonds = [];

        const numLayers = 3;       // 總共 3 層 (上下堆疊)
        const chainsPerLayer = 3;  // 每層有 3 條平行的氫鍵鏈 (構成一個平面)
        const groupsPerChain = 4;  // 每條鏈有 4 個碳酸氫根分子
        
        // 空間向量設定
        const vChain = {x: 3.437, y: -3.320, z: 0};  // 同一條鏈上相鄰分子的位移
        const vLateral = {x: 4.5, y: 4.5, z: 0};     // 同一層內相鄰平行鏈的位移 (橫向推展出平面)
        const vLayer = {x: 1.5, y: 1.2, z: 4.5};     // 層與層之間的位移 (Z 軸向上堆疊)

        // 計算座標與鍵結
        for (let l = 0; l < numLayers; l++) {
            for (let c = 0; c < chainsPerLayer; c++) {
                for (let i = 0; i < groupsPerChain; i++) {
                    // 計算基準座標，並減去偏移量使整體模型置中
                    const cx = l * vLayer.x + c * vLateral.x + i * vChain.x - 12.0;
                    const cy = l * vLayer.y + c * vLateral.y + i * vChain.y + 0.0;
                    const cz = l * vLayer.z + c * vLateral.z + i * vChain.z - 4.5;

                    // 碳酸氫根 (HCO₃⁻)
                    atomLines.push(`C  ${cx.toFixed(3)} ${cy.toFixed(3)} ${cz.toFixed(3)}`);
                    atomLines.push(`O  ${(cx).toFixed(3)} ${(cy+1.3).toFixed(3)} ${cz.toFixed(3)}`);
                    atomLines.push(`O  ${(cx-1.1).toFixed(3)} ${(cy-0.65).toFixed(3)} ${cz.toFixed(3)}`);
                    atomLines.push(`O  ${(cx+1.1).toFixed(3)} ${(cy-0.65).toFixed(3)} ${cz.toFixed(3)}`);
                    atomLines.push(`H  ${(cx+1.935).toFixed(3)} ${(cy-1.144).toFixed(3)} ${cz.toFixed(3)}`);
                    
                    // 鈉離子 (Na⁺) - 均勻分佈於鏈之間與層之間
                    atomLines.push(`Na ${(cx - 0.5).toFixed(3)} ${(cy + 2.5).toFixed(3)} ${(cz + 2.2).toFixed(3)}`);

                    // 分子內共價鍵 (實線)
                    coBonds.push([[cx, cy, cz], [cx, cy+1.3, cz]]);
                    coBonds.push([[cx, cy, cz], [cx-1.1, cy-0.65, cz]]);
                    coBonds.push([[cx, cy, cz], [cx+1.1, cy-0.65, cz]]);
                    ohBonds.push([[cx+1.1, cy-0.65, cz], [cx+1.935, cy-1.144, cz]]);

                    // 分子間氫鍵 (虛線)，連接同一條鏈上的下一個分子
                    if (i < groupsPerChain - 1) {
                        const nx = cx + vChain.x;
                        const ny = cy + vChain.y;
                        const nz = cz + vChain.z;
                        // 當前分子的 H，連向鏈上右側下一個分子的頂端 O
                        hBonds.push([[cx+1.935, cy-1.144, cz], [nx, ny+1.3, nz]]);
                    }
                }
            }
        }

        // 組裝 XYZ 格式資料並載入
        const xyzStr = [atomLines.length, 'NaHCO3 3 Layers', ...atomLines].join('\n');
        cifViewer.addModel(xyzStr, 'xyz');

        // 原子的渲染樣式 (大小與顏色)
        cifViewer.setStyle({elem:'Na'}, {sphere:{radius:0.60, color:'#9b59b6'}});
        cifViewer.setStyle({elem:'C'},  {sphere:{radius:0.42, color:'#555555'}});
        cifViewer.setStyle({elem:'O'},  {sphere:{radius:0.46, color:'#e74c3c'}});
        cifViewer.setStyle({elem:'H'},  {sphere:{radius:0.29, color:'#EEEEEE'}});

        // 畫出分子內的共價鍵 (深灰/淺灰圓柱)
        coBonds.forEach(([s,e]) => cifViewer.addCylinder({start:{x:s[0],y:s[1],z:s[2]}, end:{x:e[0],y:e[1],z:e[2]}, radius:0.14, color:'#888888', fromCap:2, toCap:2}));
        ohBonds.forEach(([s,e]) => cifViewer.addCylinder({start:{x:s[0],y:s[1],z:s[2]}, end:{x:e[0],y:e[1],z:e[2]}, radius:0.11, color:'#BBBBBB', fromCap:2, toCap:2}));
        
        // 畫出分子間的氫鍵 (金黃色虛線)
        hBonds.forEach(([s,e]) => {
            const dx = e[0]-s[0], dy = e[1]-s[1], dz = e[2]-s[2];
            const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
            const ux = dx/len, uy = dy/len, uz = dz/len;
            // 每隔一段距離畫一截短圓柱，產生虛線感
            for (let t = 0; t < len; t += 0.45) {
                const t2 = Math.min(t + 0.27, len);
                cifViewer.addCylinder({
                    start:{x:s[0]+ux*t, y:s[1]+uy*t, z:s[2]+uz*t}, 
                    end:{x:s[0]+ux*t2, y:s[1]+uy*t2, z:s[2]+uz*t2}, 
                    radius:0.08, color:'#FFD700', fromCap:2, toCap:2
                });
            }
        });

        // 圖例覆蓋層
        try {
            const vEl = document.getElementById('cif-viewer');
            if (!vEl.querySelector('.hb-legend')) {
                const lg = document.createElement('div');
                lg.className = 'hb-legend';
                lg.style.cssText = 'position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.75);color:#fff;padding:8px 14px;border-radius:8px;font-size:0.8rem;line-height:2;z-index:100;pointer-events:none;';
                lg.innerHTML = '<b style="color:#93c5fd;">HCO₃⁻ 氫鍵排列</b><br>'
                    + '<span style="color:#9b59b6;">●</span> Na⁺&nbsp;&nbsp;<span style="color:#888;">●</span> C&nbsp;&nbsp;<span style="color:#e74c3c;">●</span> O&nbsp;&nbsp;<span style="color:#ddd;">●</span> H<br>'
                    + '<span style="color:#888;">━━</span> C-O 鍵&nbsp;&nbsp;<span style="color:#bbb;">━━</span> O-H 鍵&nbsp;&nbsp;<span style="color:#FFD700;">╌╌</span> 氫鍵 O-H···O';
                vEl.appendChild(lg);
            }
        } catch(e) {}

        cifViewer.zoomTo();
        cifViewer.render();
        return;
    }

    fetch('./' + filename)
        .then(res => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.text();
        })
        .then(data => {
            cifViewer.clear();
            cifViewer.addModel(data, "cif", {doAssembly: true, normalizeAssembly: true});
            cifViewer.setStyle({}, {sphere: {radius: 0.35, colorscheme: 'Jmol'}, stick: {radius: 0.15, colorscheme: 'Jmol'}});
            
            // Add unit cell box
            try {
                const m = cifViewer.getModel();
                if (m) {
                    cifViewer.addUnitCell(m, {box:{color:'white', hidden:false}});
                }
            } catch (e) {
                console.warn("Could not add unit cell", e);
            }
            cifViewer.zoomTo();
            cifViewer.render();
        })
        .catch(err => {
            console.error("Error loading CIF:", err);
            alert("載入失敗: " + err.message + "\n檔案: " + filename + "\n\n若您已上傳至 GitHub Pages，請檢查：\n1. 該檔案是否確定有被 push 上去。\n2. 檔案名稱的大、小寫必須與 GitHub 上完全相同 (GitHub 區分大小寫)。\n3. 請清除瀏覽器快取 (Ctrl+F5) 後再試一次。");
            closeCifModal();
        });
}
function closeCifModal() {
    document.getElementById('cif-modal').style.display = 'none';
}

// ═══════════════ Random Draw Logic ═══════════════
let drawnNumbers = new Set();
let drawTotal = 40;
const rdModal = document.getElementById('random-draw-modal');
const btnCloseDraw = document.getElementById('btn-close-draw');
const btnDoDraw = document.getElementById('btn-do-draw');
const ballsContainer = document.getElementById('random-draw-balls');
const drawInput = document.getElementById('draw-total-input');
const btnRandomDraw = document.getElementById('btn-random-draw');

function initBalls() {
    if (!ballsContainer) return;
    ballsContainer.innerHTML = '';
    for (let i = 1; i <= drawTotal; i++) {
        const d = document.createElement('div');
        d.className = 'draw-ball'; d.id = 'ball-' + i; d.textContent = i;
        if (drawnNumbers.has(i)) d.classList.add('drawn');
        ballsContainer.appendChild(d);
    }
}
if (drawInput) {
    drawInput.addEventListener('change', (e) => {
        let v = parseInt(e.target.value);
        if (v < 1) v = 1; if (v > 100) v = 100; drawTotal = v;
        drawnNumbers.clear(); initBalls();
    });
}
if (btnCloseDraw) {
    btnCloseDraw.addEventListener('click', () => {
        if (rdModal) rdModal.style.display = 'none';
    });
}
if (btnDoDraw) {
    btnDoDraw.addEventListener('click', () => {
        if (drawnNumbers.size >= drawTotal) { drawnNumbers.clear(); initBalls(); }
        const avail = []; for (let i = 1; i <= drawTotal; i++) { if (!drawnNumbers.has(i)) avail.push(i); }
        if (avail.length === 0) return;
        btnDoDraw.disabled = true;
        const winner = avail[Math.floor(Math.random() * avail.length)];
        let ticks = 0, lastFlicker = null;
        const interval = setInterval(() => {
            if (lastFlicker) lastFlicker.classList.remove('flicker');
            const rnd = avail[Math.floor(Math.random() * avail.length)];
            const b = document.getElementById('ball-' + rnd);
            if (b) { b.classList.add('flicker'); lastFlicker = b; }
            ticks++;
            if (ticks > 20) {
                clearInterval(interval);
                if (lastFlicker) lastFlicker.classList.remove('flicker');
                const wb = document.getElementById('ball-' + winner);
                if (wb) {
                    wb.classList.add('winner');
                    setTimeout(() => { wb.classList.remove('winner'); wb.classList.add('drawn'); drawnNumbers.add(winner); btnDoDraw.disabled = false; }, 2000);
                } else { btnDoDraw.disabled = false; }
            }
        }, 100);
    });
}
if (btnRandomDraw) {
    btnRandomDraw.addEventListener('click', () => {
        if (rdModal) {
            rdModal.style.display = rdModal.style.display === 'none' ? 'block' : 'none';
            if (rdModal.style.display === 'block') { initBalls(); }
        }
    });
}
</script>

<script id="__chem_scroll_bridge">
(function() {
  if (window.__chemScrollBridgeInstalled) return;
  window.__chemScrollBridgeInstalled = true;

  function getScrollPos() {
    var sy = window.scrollY || window.pageYOffset || 0;
    var sx = window.scrollX || window.pageXOffset || 0;
    if (document.documentElement) {
      sy = Math.max(sy, document.documentElement.scrollTop || 0);
      sx = Math.max(sx, document.documentElement.scrollLeft || 0);
    }
    if (document.body) {
      sy = Math.max(sy, document.body.scrollTop || 0);
      sx = Math.max(sx, document.body.scrollLeft || 0);
    }
    var stream = document.getElementById('presentation-stream') ||
                 document.getElementById('presentation-area') ||
                 document.getElementById('slides-container') ||
                 document.getElementById('app');
    if (stream) {
      sy = Math.max(sy, stream.scrollTop || 0);
      sx = Math.max(sx, stream.scrollLeft || 0);
    }
    return { sx: sx, sy: sy };
  }

  function reportScroll() {
    if (window.parent && window.parent !== window) {
      var pos = getScrollPos();
      window.parent.postMessage({ type: '__chem_scroll', sy: pos.sy, sx: pos.sx }, '*');
    }
  }

  // 監聽各種觸發捲動之事件
  window.addEventListener('scroll', reportScroll, { capture: true, passive: true });
  document.addEventListener('scroll', reportScroll, { capture: true, passive: true });
  window.addEventListener('wheel', function() {
    requestAnimationFrame(reportScroll);
    setTimeout(reportScroll, 40);
    setTimeout(reportScroll, 120);
  }, { capture: true, passive: true });
  window.addEventListener('touchmove', function() {
    requestAnimationFrame(reportScroll);
    setTimeout(reportScroll, 40);
  }, { capture: true, passive: true });
  window.addEventListener('keydown', function(e) {
    if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space', 'Home', 'End'].indexOf(e.code) !== -1) {
      requestAnimationFrame(reportScroll);
      setTimeout(reportScroll, 60);
      setTimeout(reportScroll, 180);
    }
  }, { passive: true });

  // 監聽來自母頁面 (index.html) 的命令
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === '__chem_scroll_by') {
      var dy = e.data.deltaY || 0;
      var dx = e.data.deltaX || 0;
      window.scrollBy({ top: dy, left: dx, behavior: 'instant' });
      if (document.documentElement) document.documentElement.scrollTop += dy;
      if (document.body) document.body.scrollTop += dy;
      var stream = document.getElementById('presentation-stream') ||
                   document.getElementById('presentation-area') ||
                   document.getElementById('slides-container') ||
                   document.getElementById('app');
      if (stream) stream.scrollTop += dy;
      reportScroll();
    } else if (e.data.type === '__chem_get_scroll') {
      reportScroll();
    }
  });

  // 初始時與載入後回報
  reportScroll();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', reportScroll);
  }
  window.addEventListener('load', reportScroll);
})();
</script>
