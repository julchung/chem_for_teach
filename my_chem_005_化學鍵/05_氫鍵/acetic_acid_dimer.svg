<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
        .bond { stroke: black; stroke-width: 2; }
        .hbond { stroke: red; stroke-width: 2; stroke-dasharray: 4,4; }
    </style>
    
    <!-- Left Monomer -->
    <text x="30" y="80">H<tspan dy="5" font-size="12">3</tspan><tspan dy="-5">C</tspan></text>
    <line x1="65" y1="75" x2="100" y2="75" class="bond"/>
    <text x="105" y="80">C</text>
    
    <!-- Left =O -->
    <line x1="115" y1="60" x2="135" y2="40" class="bond"/>
    <line x1="123" y1="67" x2="143" y2="47" class="bond"/>
    <text x="140" y="40" fill="red">O</text>
    
    <!-- Left -OH -->
    <line x1="120" y1="85" x2="140" y2="105" class="bond"/>
    <text x="145" y="120" fill="red">O</text>
    <line x1="165" y1="115" x2="185" y2="115" class="bond"/>
    <text x="190" y="120" fill="blue">H</text>

    <!-- Right Monomer -->
    <text x="320" y="80">CH<tspan dy="5" font-size="12">3</tspan></text>
    <line x1="315" y1="75" x2="280" y2="75" class="bond"/>
    <text x="260" y="80">C</text>
    
    <!-- Right -OH (top) -->
    <line x1="260" y1="65" x2="240" y2="45" class="bond"/>
    <text x="220" y="40" fill="red">O</text>
    <line x1="215" y1="35" x2="195" y2="35" class="bond"/>
    <text x="180" y="40" fill="blue">H</text>
    
    <!-- Right =O (bottom) -->
    <line x1="265" y1="90" x2="245" y2="110" class="bond"/>
    <line x1="257" y1="83" x2="237" y2="103" class="bond"/>
    <text x="225" y="120" fill="red">O</text>
    
    <!-- Hydrogen bonds -->
    <line x1="160" y1="35" x2="175" y2="35" class="hbond"/>
    <line x1="205" y1="115" x2="220" y2="115" class="hbond"/>
</svg>