                        </div>
                    </div>
                    <div class="mol-pdb-panel">
                        <div id="pdb-viewer-wrap">
                            <div id="pdb-viewer"></div>
                        </div>
                    </div>
                </div>
                <div class="panel scroll-panel mol-desc-panel">
                    <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.35rem;">
                        <h2 id="mol-title" style="margin:0;">說明</h2>
                        <div class="status-pill pill-nonpolar" id="mol-status" role="status" aria-live="polite">請選擇分子</div>
                    </div>
                    <p id="mol-desc">點選上方分子：左欄 JPG、右欄 PDB 3D。共 10 種分子（H₂O、CO₂、NH₃、NF₃、BF₃、O₃、CH₄、CF₄、順/反式二氯乙烯）。</p>
                    <div class="highlight-box" id="mol-tip">
                        <p><strong>建議比較</strong>：NH₃ vs NF₃（孤對與鍵偶極）；順式 vs 反式 C₂H₂Cl₂（同分異構物極性）。</p>
                        <p><strong>口訣</strong>：先看鍵極性 → 再看分子對稱性與孤對電子。</p>
                    </div>
                </div>
            </div>
    <script>

let _pdbViewer = null, _pdbPendingKey = null, _pdbInitTries = 0;
function loadMolImage(key) {
    const img = document.getElementById('mol-image');
    if (!img) return;
    img.alt = key + ' 分子結構圖';
    img.onerror = () => img.removeAttribute('src');
    img.src = './' + key + '.jpg';
}

function initPDBViewer() {
    const el = document.getElementById('pdb-viewer');
    if (!el || _pdbViewer) return;
    if (!window.$3Dmol) { if (_pdbInitTries++ < 40) setTimeout(initPDBViewer, 250); return; }
    try {
        _pdbViewer = $3Dmol.createViewer(el, { backgroundColor: '0x0f172a' });
        if (_pdbPendingKey) loadPDBModel(_pdbPendingKey);
    } catch (e) { _pdbViewer = null; }
}

function normalizeChem3DPdb(txt) {
    return txt.split(/\r?\n/).map(function (line) {
        if (!/^HETATM|^ATOM/.test(line)) return line;
        const parts = line.trim().split(/\s+/);
        if (parts.length < 7) return line;
        const serial = parts[1], ci = /^-?\d+$/.test(parts[3]) ? 4 : 3;
        const x = parseFloat(parts[ci]), y = parseFloat(parts[ci + 1]), z = parseFloat(parts[ci + 2]);
        return 'HETATM' + String(serial).padStart(5) + ' ' + (parts[2]||'C').padEnd(4) + ' MOL A' + String(serial).padStart(4) + '   ' + x.toFixed(3).padStart(8) + y.toFixed(3).padStart(8) + z.toFixed(3).padStart(8) + '  1.00  0.00           ' + (parts[parts.length-1].replace(/[0-9]/g, '')||'C').padStart(2);
    }).join('\n');
}

function loadPDBModel(key) {
    _pdbPendingKey = key;
    if (!_pdbViewer) { initPDBViewer(); setTimeout(() => { if (_pdbPendingKey === key) loadPDBModel(key); }, 400); return; }
    _pdbViewer.clear();
    const txt = (window.ChemDiagrams && ChemDiagrams.getPdbText) ? ChemDiagrams.getPdbText(key) : "";
    _pdbViewer.addModel(normalizeChem3DPdb(txt), 'pdb', { keepH: true });
    _pdbViewer.setStyle({}, {stick: {radius: 0.22, color: '#64748b'}, sphere: {scale: 0.45, colorscheme: 'Jmol'}});
    _pdbViewer.zoomTo(); _pdbViewer.render();
}

function selectMol(key, btn) {
    key = (btn && btn.dataset.key) || key || 'H2O';
    document.querySelectorAll('.mol-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    loadMolImage(key);
    loadPDBModel(key);
    const titleEl = document.getElementById('mol-title'), descEl = document.getElementById('mol-desc');
    const m = window.ChemDiagrams ? ChemDiagrams.getMolMeta(key) : null;
    if (titleEl) titleEl.textContent = m ? m.title : key;
    if (descEl && m) descEl.textContent = m.desc;
    const st = document.getElementById('mol-status');
    if (st && m) {
        st.textContent = m.polar ? '極性分子' : '非極性分子';
        st.className = 'status-pill ' + (m.polar ? 'pill-polar' : 'pill-nonpolar');
    }
}

function initMolExplorer() {
    const row = document.getElementById('mol-btns');
    if (!row || !window.ChemDiagrams) return;
    initPDBViewer();
    if (row.dataset.init !== '3') {
        row.dataset.init = '3';
        row.innerHTML = '';
        ChemDiagrams.molKeys().forEach((key, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'mol-btn' + (i === 0 ? ' active' : '');
            b.textContent = ChemDiagrams.getMolLabel ? ChemDiagrams.getMolLabel(key) : key;
            b.dataset.key = key;
            b.onclick = () => selectMol(b.dataset.key, b);
            row.appendChild(b);
        });
    }
    selectMol('H2O', row.querySelector('[data-key="H2O"]') || row.querySelector('.mol-btn'));
}


    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initMolExplorer, 150);

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(() => {});
        }
    });
    </script>
</body>
</html>
