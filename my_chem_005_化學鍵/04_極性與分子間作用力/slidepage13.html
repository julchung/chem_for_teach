                        <h2 style="font-size: 1.4rem;">沸點與分子間作用力</h2>

                        <ul style="font-size: 1.15rem; line-height: 1.6; margin-left: 1rem;">
                            <li>同系列：分子量↑ → 倫敦力↑ → 沸點↑</li>
                            <li>含氫鍵者：沸點明顯高於同分子量類似物</li>
                            <li>極性分子通常高於非極性、相近分子量者</li>
                        </ul>
                        <div class="highlight-box" style="margin-top: 1.5rem; padding: 1rem;">
                            <p style="font-size: 1.15rem; margin: 0;">例：H₂O (100°C) >> H₂S (−60°C)；NH₃ > PH₃</p>
                        </div>
                    </div>
                    <div class="panel" style="display: flex; flex-direction: column;">
                        <h2 style="margin-bottom: 0.5rem; text-align: center;">各族氫化物熔沸點變化</h2>
                        <div style="display: flex; gap: 10px; flex: 1; padding: 0 10px;">
                            <div style="flex: 1; display: flex; flex-direction: column; position: relative;">
                                <canvas id="canvas-bp" role="img" aria-label="沸點折線圖" style="flex: 1; width: 100%; min-height: 200px;"></canvas>
                                <div style="text-align:center;font-size:0.85rem;color:#cbd5e1; margin-top: 5px;">沸點 (°C)</div>
                            </div>
                            <div style="flex: 1; display: flex; flex-direction: column; position: relative;">
                                <canvas id="canvas-mp" role="img" aria-label="熔點折線圖" style="flex: 1; width: 100%; min-height: 200px;"></canvas>
                                <div style="text-align:center;font-size:0.85rem;color:#cbd5e1; margin-top: 5px;">熔點 (°C)</div>
                            </div>
                        </div>
                        <div id="period-toggles" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding-bottom: 5px; font-size: 0.9rem;">
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="period-sel" value="all" checked> 全部</label>
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="period-sel" value="2"> 第二週期 <span style="display:inline-block;width:12px;height:4px;background:#f87171; border-radius:2px;"></span></label>
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="period-sel" value="3"> 第三週期 <span style="display:inline-block;width:12px;height:4px;background:#38bdf8; border-radius:2px;"></span></label>
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="period-sel" value="4"> 第四週期 <span style="display:inline-block;width:12px;height:4px;background:#a78bfa; border-radius:2px;"></span></label>
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="period-sel" value="5"> 第五週期 <span style="display:inline-block;width:12px;height:4px;background:#4ade80; border-radius:2px;"></span></label>
                            <label style="cursor: pointer; display: flex; align-items: center; gap: 5px; margin-left: 8px; color: var(--accent-cyan); font-weight: 600;"><input type="checkbox" id="toggle-formula-labels" checked> 標示分子式</label>
                        </div>
                    </div>
                </div>
            </div>
    <script>

let hoveredPoint = null; // { period: string, groupIndex: number }

function drawChartGeneral(canvasId, type, dataset, groups, hoveredInfo = null, showLabels = true) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    const g = canvas.getContext('2d');
    g.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    g.clearRect(0, 0, w, h);

    // 邊界設定：上方預留 28px 防止 H₂O 等高溫標籤被頂部邊界切掉
    const pad = { l: 42, r: 25, t: 28, b: 30 };
    const gw = w - pad.l - pad.r, gh = h - pad.t - pad.b;
    const valsAll = dataset.flatMap(ds => type === 'bp' ? ds.bp : ds.mp);
    if (valsAll.length === 0) return;
    const minT = Math.floor(Math.min(...valsAll) / 50) * 50;
    const maxT = Math.ceil(Math.max(...valsAll) / 50) * 50;
    const yScale = v => pad.t + gh - ((v - minT) / (maxT - minT)) * gh;
    const xScale = i => pad.l + (i + 0.5) * (gw / groups.length);

    // 背景水平刻度網格線
    g.strokeStyle = 'rgba(255,255,255,0.08)';
    g.lineWidth = 1;
    for(let t = minT; t <= maxT; t += 50) {
        let yt = yScale(t);
        g.beginPath(); g.moveTo(pad.l, yt); g.lineTo(pad.l + gw, yt); g.stroke();
        g.fillStyle = '#94a3b8'; g.font = '10px sans-serif'; g.textAlign = 'right';
        g.fillText(t + '°', pad.l - 6, yt + 4);
    }

    // 0°C 基準線（若落在此溫度範圍內）
    if (minT <= 0 && maxT >= 0) {
        let y0 = yScale(0);
        g.strokeStyle = 'rgba(255,255,255,0.25)';
        g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(pad.l, y0); g.lineTo(pad.l + gw, y0); g.stroke();
        g.setLineDash([]);
    }

    // X 軸族別標籤 (4A, 5A, 6A, 7A)
    groups.forEach((grp, i) => {
        g.fillStyle = '#cbd5e1'; g.font = 'bold 12px sans-serif'; g.textAlign = 'center';
        g.fillText(grp, xScale(i), pad.t + gh + 18);
    });

    // 1. 繪製平滑折線
    dataset.forEach(ds => {
        const vals = type === 'bp' ? ds.bp : ds.mp;
        g.strokeStyle = ds.color;
        g.lineWidth = 2.5;
        g.beginPath();
        vals.forEach((v, i) => {
            const x = xScale(i), y = yScale(v);
            i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        });
        g.stroke();
    });

    // 收集各欄點資料進行智慧排版避讓
    const pointsByGroup = [[], [], [], []];
    dataset.forEach(ds => {
        const vals = type === 'bp' ? ds.bp : ds.mp;
        vals.forEach((v, i) => {
            const x = xScale(i), y = yScale(v);
            const isHovered = hoveredInfo && hoveredInfo.period === ds.p && hoveredInfo.groupIndex === i;
            pointsByGroup[i].push({
                ds,
                p: ds.p,
                name: ds.names[i],
                val: v,
                x,
                y,
                isHovered
            });
        });
    });

    // 2. 繪製各點 (Dots)
    dataset.forEach(ds => {
        const vals = type === 'bp' ? ds.bp : ds.mp;
        vals.forEach((v, i) => {
            const x = xScale(i), y = yScale(v);
            const isHovered = hoveredInfo && hoveredInfo.period === ds.p && hoveredInfo.groupIndex === i;
            if (isHovered) {
                g.fillStyle = '#fde047';
                g.beginPath(); g.arc(x, y, 7, 0, Math.PI*2); g.fill();
                g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; g.stroke();
            } else {
                g.fillStyle = ds.color;
                g.beginPath(); g.arc(x, y, 4.5, 0, Math.PI*2); g.fill();
                g.strokeStyle = '#0f172a'; g.lineWidth = 1.5; g.stroke();
            }
        });
    });

    // 3. 標示各分子式 (如 CH₄, NH₃, H₂O, HF...)
    if (showLabels) {
        pointsByGroup.forEach((pts) => {
            // 依 Y 座標從小到大排序（Y 愈小代表溫度愈高）
            pts.sort((a, b) => a.y - b.y);

            pts.forEach((pt, k) => {
                let lx = pt.x;
                let ly = pt.y - 9;
                let align = 'center';

                if (pts.length === 1) {
                    // 單一週期：直接置於上方或下方
                    align = 'center';
                    lx = pt.x;
                    ly = (pt.y < pad.t + 12) ? pt.y + 15 : pt.y - 9;
                } else {
                    // 全部週期：若鄰近點垂直差距小於 22px，則交錯往左右偏移避開
                    const prev = pts[k - 1];
                    const next = pts[k + 1];
                    const closeToPrev = prev && Math.abs(pt.y - prev.y) < 22;
                    const closeToNext = next && Math.abs(pt.y - next.y) < 22;

                    if (closeToPrev || closeToNext) {
                        if (k % 2 === 0) {
                            align = 'right';
                            lx = pt.x - 7;
                            ly = pt.y + 3;
                        } else {
                            align = 'left';
                            lx = pt.x + 7;
                            ly = pt.y + 3;
                        }
                    } else {
                        align = 'center';
                        lx = pt.x;
                        ly = (pt.y < pad.t + 12) ? pt.y + 15 : pt.y - 9;
                    }
                }

                // 文字暗色外框 (Halo / Stroke)，確保穿過折線時依然 100% 清晰
                g.font = pt.isHovered ? 'bold 12px sans-serif' : 'bold 11px sans-serif';
                g.textAlign = align;
                g.textBaseline = 'middle';
                g.strokeStyle = '#0a0f1e';
                g.lineWidth = 3.5;
                g.lineJoin = 'round';
                g.strokeText(pt.name, lx, ly);

                // 文字本體填色（依該週期顏色呈現，懸浮時發光黃色）
                g.fillStyle = pt.isHovered ? '#fde047' : pt.ds.color;
                g.fillText(pt.name, lx, ly);
            });
        });
    }

    // 4. 懸浮點數值資訊框 (Tooltip Badge)
    if (hoveredInfo) {
        const targetPt = dataset.flatMap(ds => {
            const vals = type === 'bp' ? ds.bp : ds.mp;
            return vals.map((v, i) => ({ ds, v, i }));
        }).find(item => item.ds.p === hoveredInfo.period && item.i === hoveredInfo.groupIndex);

        if (targetPt) {
            const tx = xScale(targetPt.i);
            const ty = yScale(targetPt.v);
            const name = targetPt.ds.names[targetPt.i];
            const tipText = `${name} (${targetPt.v}°C)`;

            g.font = 'bold 11px sans-serif';
            const tw = g.measureText(tipText).width + 16;
            const th = 22;
            let bx = tx - tw / 2;
            let by = ty - 26;
            if (bx < pad.l) bx = pad.l;
            if (bx + tw > w - pad.r) bx = w - pad.r - tw;
            if (by < 4) by = ty + 12;

            g.fillStyle = 'rgba(15, 23, 42, 0.94)';
            g.strokeStyle = targetPt.ds.color;
            g.lineWidth = 1.2;
            g.beginPath();
            if (g.roundRect) g.roundRect(bx, by, tw, th, 6);
            else g.rect(bx, by, tw, th);
            g.fill();
            g.stroke();

            g.fillStyle = '#ffffff';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.fillText(tipText, bx + tw / 2, by + th / 2);
        }
    }
}

function initBP() {
    const cb = document.getElementById('canvas-bp');
    const cm = document.getElementById('canvas-mp');
    if (!cb || !cm) return;
    const groups = ['4A', '5A', '6A', '7A'];
    const dataset = [
        { p: '2', color: '#f87171', bp: [-161, -33, 100, 20], mp: [-182, -78, 0, -83], names: ['CH₄','NH₃','H₂O','HF'] },
        { p: '3', color: '#38bdf8', bp: [-112, -88, -60, -85], mp: [-185, -134, -82, -114], names: ['SiH₄','PH₃','H₂S','HCl'] },
        { p: '4', color: '#a78bfa', bp: [-88, -62, -41, -67], mp: [-165, -116, -66, -87], names: ['GeH₄','AsH₃','H₂Se','HBr'] },
        { p: '5', color: '#4ade80', bp: [-52, -17, -2, -35], mp: [-150, -88, -49, -51], names: ['SnH₄','SbH₃','H₂Te','HI'] }
    ];

    const getSelectedPeriod = () => {
        const rads = document.getElementsByName('period-sel');
        for(let r of rads) if(r.checked) return r.value;
        return 'all';
    };

    const isLabelEnabled = () => {
        const chk = document.getElementById('toggle-formula-labels');
        return chk ? chk.checked : true;
    };

    const draw = () => {
        const sel = getSelectedPeriod();
        const showLabels = isLabelEnabled();
        const dsFiltered = sel === 'all' ? dataset : dataset.filter(d => d.p === sel);
        drawChartGeneral('canvas-bp', 'bp', dsFiltered, groups, hoveredPoint, showLabels);
        drawChartGeneral('canvas-mp', 'mp', dsFiltered, groups, hoveredPoint, showLabels);
    };

    draw();
    window._bpDraw = draw;

    document.getElementsByName('period-sel').forEach(r => r.addEventListener('change', draw));
    const labelChk = document.getElementById('toggle-formula-labels');
    if (labelChk) labelChk.addEventListener('change', draw);

    // 滑鼠與觸控懸浮偵測（雙圖聯動高亮）
    const attachHover = (canvas, type) => {
        const handleMove = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const mx = clientX - rect.left;
            const my = clientY - rect.top;

            const sel = getSelectedPeriod();
            const dsFiltered = sel === 'all' ? dataset : dataset.filter(d => d.p === sel);
            const pad = { l: 42, r: 25, t: 28, b: 30 };
            const gw = rect.width - pad.l - pad.r, gh = rect.height - pad.t - pad.b;
            const valsAll = dsFiltered.flatMap(ds => type === 'bp' ? ds.bp : ds.mp);
            if (valsAll.length === 0) return;
            const minT = Math.floor(Math.min(...valsAll) / 50) * 50;
            const maxT = Math.ceil(Math.max(...valsAll) / 50) * 50;
            const yScale = v => pad.t + gh - ((v - minT) / (maxT - minT)) * gh;
            const xScale = i => pad.l + (i + 0.5) * (gw / groups.length);

            let closest = null;
            let minDist = 22; // 偵測半徑 22px

            dsFiltered.forEach(ds => {
                const vals = type === 'bp' ? ds.bp : ds.mp;
                vals.forEach((v, i) => {
                    const px = xScale(i);
                    const py = yScale(v);
                    const dist = Math.hypot(mx - px, my - py);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = { period: ds.p, groupIndex: i };
                    }
                });
            });

            if (closest) {
                if (!hoveredPoint || hoveredPoint.period !== closest.period || hoveredPoint.groupIndex !== closest.groupIndex) {
                    hoveredPoint = closest;
                    draw();
                }
            } else if (hoveredPoint !== null) {
                hoveredPoint = null;
                draw();
            }
        };

        const handleLeave = () => {
            if (hoveredPoint !== null) {
                hoveredPoint = null;
                draw();
            }
        };

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseleave', handleLeave);
        canvas.addEventListener('touchmove', handleMove, { passive: true });
        canvas.addEventListener('touchend', handleLeave);
    };

    attachHover(cb, 'bp');
    attachHover(cm, 'mp');

    // 視窗縮放自適應重繪
    window.addEventListener('resize', () => {
        requestAnimationFrame(draw);
    });
}


    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initBP, 150);

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(() => {});
        }
    });
    </script>
</body>
