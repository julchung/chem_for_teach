                            <tr><th>作用力</th><th>發生對象</th><th>相對強度</th></tr>
                            <tr><td>倫敦分散力</td><td>所有分子</td><td>最弱</td></tr>
                            <tr><td>偶極–偶極力</td><td>極性分子</td><td>中等</td></tr>
                            <tr><td>氫鍵</td><td>H 與 F、O、N</td><td>較強</td></tr>
                            <tr><td>離子–偶極力</td><td>離子與極性分子</td><td>強</td></tr>

                        <div class="info-card" style="margin-top: 1.2rem; padding: 1rem;">
                            <p style="font-size: clamp(1rem, 1.3vw, 1.15rem); line-height: 1.6; margin: 0;"><strong>倫敦力</strong>：瞬間偶極誘發鄰近分子產生誘導偶極；分子愈大、電子數愈多，分散力愈強。</p>
                        </div>
                    </div>
                    <div class="panel scroll-panel" style="display: flex; flex-direction: column; gap: 0.55rem; padding: 0.55rem;">
                        <div style="display: flex; align-items: center; gap: 0.9rem; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.6rem; flex: 1; min-height: 0;">
                            <div class="diagram-panel" id="diag-slide7a" role="img" aria-label="偶極-偶極力示意圖" style="flex: 0 0 44%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; background: rgba(0,0,0,0.2);"></div>
                            <div style="flex: 1; overflow-y: auto; padding-right: 0.3rem;">
                                <h3 style="color: var(--accent-blue); margin: 0 0 0.35rem 0; font-size: clamp(1rem, 1.3vw, 1.15rem);">偶極–偶極力</h3>
                                <p style="font-size: clamp(0.9rem, 1.15vw, 1.05rem); color: rgba(248,250,252,0.9); margin: 0; line-height: 1.5;">
                                    存在於<strong>極性分子</strong>之間。極性分子的恆久偶極，其正端與負端互相吸引。極性愈大，作用力愈強。
                                </p>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.9rem; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.6rem; flex: 1; min-height: 0;">
                            <div class="diagram-panel" id="diag-slide7b" role="img" aria-label="偶極-誘導偶極力示意圖" style="flex: 0 0 44%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; background: rgba(0,0,0,0.2);"></div>

                        <div style="display: flex; align-items: center; gap: 0.9rem; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.6rem; flex: 1; min-height: 0;">

                                <p style="font-size: clamp(0.9rem, 1.15vw, 1.05rem); color: rgba(248,250,252,0.9); margin: 0; line-height: 1.5;">
                                    存在於<strong>所有分子</strong>之間。電子雲瞬間不均勻分布產生<strong>瞬間偶極</strong>，並誘發周圍分子產生誘導偶極。
                                </p>
                            </div>

    <script>

function injectChemDiagrams() {
    const mapIds = ['diag-slide1','diag-slide2-hf','diag-slide2-hx','diag-slide3-en','diag-slide4a','diag-slide4b','diag-slide7a','diag-slide7b','diag-slide7c'];
    if (!window.ChemDiagrams) {
        mapIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '<div class="info-card" style="text-align:center;padding:0.8rem;">示意圖載入失敗，請確認 chem-diagrams.js 是否存在或已正確載入。</div>';
        });
        return;
    }
    const D = ChemDiagrams;
    const map = {
        'diag-slide1': D.slide1BondTypes,
        'diag-slide2-hf': D.slide2HFDiagram,
        'diag-slide2-hx': D.slide2HalidesCompare,
        'diag-slide3-en': D.slide3EnPeriodicTable,
        'diag-slide4a': D.slide4PolarMols,
        'diag-slide4b': D.slide4NonpolarMols,
        'diag-slide7a': D.slide7DpDp,
        'diag-slide7b': D.slide7DpNdp,
        'diag-slide7c': D.slide7NdpNdp
    };
    Object.keys(map).forEach(id => {
        const el = document.getElementById(id);
        if (el && map[id]) el.innerHTML = map[id]();
    });
}


    document.addEventListener('DOMContentLoaded', () => {
        if (typeof injectChemDiagrams === 'function') injectChemDiagrams();

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(() => {});
        }
    });
    </script>
