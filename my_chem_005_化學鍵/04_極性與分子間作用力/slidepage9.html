                <div class="panel" style="flex-shrink: 0; margin-bottom: 0.8rem; padding: 0.8rem 1rem;">
                    <h2 style="font-size: 1.4rem;">分子大小（電子總數）對作用力的影響</h2>
                    <p style="font-size: 1.15rem; line-height: 1.6; margin: 0;">隨著正烷類碳數增加，電子總數增多，分子尺寸變大，倫敦色散力（瞬時偶極‑瞬時偶極）會顯著增強，導致沸點與熔點持續升高。</p>
                </div>
                <div style="display: flex; gap: 10px; flex: 1; min-height: 0;">
                    <div class="panel" style="flex: 1; display:flex; flex-direction:column;">
                        <div style="flex: 1; position:relative; min-height:0;">
                            <canvas id="canvas-boil" role="img" aria-label="正烷類沸點折線圖" style="width:100%; height:100%;"></canvas>
                        </div>
                        <div style="text-align:center; font-size:0.85rem; color:#cbd5e1; margin-top:5px; flex-shrink:0;">沸點 (°C)</div>
                    </div>
                    <div class="panel" style="flex: 1; display:flex; flex-direction:column;">
                        <div id="alkane-title" style="text-align:center; font-size:1rem; font-weight:bold; color:var(--accent-yellow); margin-bottom:5px; flex-shrink:0;">分子結構</div>
                        <div id="alkane-model" style="flex:1; border:1px solid #334155; background:#0f172a; position:relative; border-radius:8px; min-height:0;">
                            <!-- 3Dmol viewer will be injected here -->
                        </div>
                    </div>
                    <div class="panel" style="flex: 1; display:flex; flex-direction:column;">
                        <div style="flex: 1; position:relative; min-height:0;">
                            <canvas id="canvas-melt" role="img" aria-label="正烷類熔點折線圖" style="width:100%; height:100%;"></canvas>
                        </div>
                        <div style="text-align:center; font-size:0.85rem; color:#cbd5e1; margin-top:5px; flex-shrink:0;">熔點 (°C)</div>
                    </div>
                </div>
            </div>
    <script>

function drawChartGeneral(canvasId, type, dataset, groups, highlightIdx = -1) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    const g = canvas.getContext('2d');
    g.scale(dpr, dpr);
    const w = rect.width, h = rect.height;
    g.clearRect(0, 0, w, h);
    const pad = { l: 40, r: 25, t: 20, b: 30 };
    const gw = w - pad.l - pad.r, gh = h - pad.t - pad.b;
    const valsAll = dataset.flatMap(ds => type === 'bp' ? ds.bp : ds.mp);
    const minT = Math.floor(Math.min(...valsAll) / 50) * 50;
    const maxT = Math.ceil(Math.max(...valsAll) / 50) * 50;
    const yScale = v => pad.t + gh - ((v - minT) / (maxT - minT)) * gh;
    const xScale = i => pad.l + (i + 0.5) * (gw / groups.length);
    g.strokeStyle = 'rgba(255,255,255,0.1)';
    for(let t = minT; t <= maxT; t += 50) {
        let yt = yScale(t);
        g.beginPath(); g.moveTo(pad.l, yt); g.lineTo(pad.l + gw, yt); g.stroke();
        g.fillStyle = '#94a3b8'; g.font = '10px sans-serif'; g.textAlign = 'right';
        g.fillText(t, pad.l - 5, yt + 4);
    }
    groups.forEach((grp, i) => {
        if (groups.length === 20 && grp === `C${i+1}`) {
            if (i % 5 !== 0) return;
        }
        g.fillStyle = '#cbd5e1'; g.font = '12px sans-serif'; g.textAlign = 'center';
        g.fillText(grp, xScale(i), pad.t + gh + 18);
    });
    dataset.forEach(ds => {
        const vals = type === 'bp' ? ds.bp : ds.mp;
        g.strokeStyle = ds.color; g.lineWidth = 2.5;
        g.beginPath();
        vals.forEach((v, i) => { const x = xScale(i), y = yScale(v); i === 0 ? g.moveTo(x, y) : g.lineTo(x, y); });
        g.stroke();
        vals.forEach((v, i) => {
            const x = xScale(i), y = yScale(v);
            if (i === highlightIdx) {
                g.fillStyle = '#fde047';
                g.beginPath(); g.arc(x, y, 6, 0, Math.PI*2); g.fill();
                g.strokeStyle = '#ffffff'; g.lineWidth = 2; g.stroke();
            } else {
                g.fillStyle = ds.color;
                g.beginPath(); g.arc(x, y, 4, 0, Math.PI*2); g.fill();
            }
        });
    });
}

let alkaneViewer = null;
function generateAlkaneXYZ(n) {
    if (n === 1) {
        let atoms = [
            "C 0.000 0.000 0.000",
            "H 0.630 0.630 0.630",
            "H -0.630 -0.630 0.630",
            "H -0.630 0.630 -0.630",
            "H 0.630 -0.630 -0.630"
        ];
        return `5\nAlkane C1\n${atoms.join('\n')}`;
    }
    let atoms = [];
    const dx = 1.26, dy = 0.89; 
    for (let i = 0; i < n; i++) {
        let x = i * dx;
        let isEven = (i % 2 === 0);
        let y = isEven ? 0 : dy;
        let z = 0;
        atoms.push(`C ${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
        if (i === 0) {
            atoms.push(`H ${(x - 0.89).toFixed(3)} ${(y + 0.63).toFixed(3)} ${z.toFixed(3)}`);
        }
        if (i === n - 1) {
            let hx = x + 0.89;
            let hy = isEven ? (y + 0.63) : (y - 0.63);
            atoms.push(`H ${hx.toFixed(3)} ${hy.toFixed(3)} ${z.toFixed(3)}`);
        }
        let hy = isEven ? (y - 0.63) : (y + 0.63);
        atoms.push(`H ${x.toFixed(3)} ${hy.toFixed(3)} 0.890`);
        atoms.push(`H ${x.toFixed(3)} ${hy.toFixed(3)} -0.890`);
    }
    return `${atoms.length}\nAlkane C${n}\n${atoms.join('\n')}`;
}

function loadAlkaneModel(idx) {
    if (!alkaneViewer) return;
    alkaneViewer.clear();
    const n = idx + 1;
    const titleEl = document.getElementById('alkane-title');
    if (titleEl) {
        if (n === 1) {
            titleEl.innerHTML = `分子結構 <span style="color:#f8fafc;font-size:0.9em;margin-left:5px;">(CH<sub>4</sub>)</span>`;
        } else {
            titleEl.innerHTML = `分子結構 <span style="color:#f8fafc;font-size:0.9em;margin-left:5px;">(C<sub>${n}</sub>H<sub>${2*n+2}</sub>)</span>`;
        }
    }
    const xyz = generateAlkaneXYZ(n);
    alkaneViewer.addModel(xyz, 'xyz');
    alkaneViewer.setStyle({}, {stick: {radius: 0.15, color: '#64748b'}, sphere: {scale: 0.3, colorscheme: 'Jmol'}});
    alkaneViewer.zoomTo();
    alkaneViewer.render();
}

function initAlkane() {
    const alc = document.getElementById('alkane-model');
    if (!alc) return;
    const bpVals = [-162, -89, -42, -1, 36, 69, 98, 126, 151, 174, 196, 216, 235, 254, 271, 287, 302, 317, 331, 344];
    const mpVals = [-183, -172, -188, -138, -130, -95, -91, -57, -54, -30, -26, -10, -5, 6, 10, 18, 22, 28, 32, 36];
    const alkGroups = ['C1','C2','C3','C4','C5','C6','C7','C8','C9','C10','C11','C12','C13','C14','C15','C16','C17','C18','C19','C20'];
    const dataset = [{ color: '#f87171', bp: bpVals, mp: mpVals }];
    drawChartGeneral('canvas-boil', 'bp', dataset, alkGroups);
    drawChartGeneral('canvas-melt', 'mp', dataset, alkGroups);
    function tryInit3D() {
        if (!window.$3Dmol) { setTimeout(tryInit3D, 300); return; }
        if (!alkaneViewer) {
            try { alkaneViewer = $3Dmol.createViewer(alc, { backgroundColor: '0x0f172a' }); } catch(e) {}
        }
        if (alkaneViewer) loadAlkaneModel(0);
    }
    tryInit3D();
    const handleClick = (e) => {
        const cvs = e.currentTarget;
        const rect = cvs.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const gw = rect.width - 65;
        const colW = gw / alkGroups.length;
        let idx = Math.floor((x - 40) / colW);
        idx = Math.max(0, Math.min(alkGroups.length - 1, idx));
        loadAlkaneModel(idx);
        drawChartGeneral('canvas-boil', 'bp', dataset, alkGroups, idx);
        drawChartGeneral('canvas-melt', 'mp', dataset, alkGroups, idx);
    };
    const cb = document.getElementById('canvas-boil');
    const cm = document.getElementById('canvas-melt');
    if (cb && !cb.dataset.alkClick) { cb.addEventListener('click', handleClick); cb.dataset.alkClick = '1'; }
    if (cm && !cm.dataset.alkClick) { cm.addEventListener('click', handleClick); cm.dataset.alkClick = '1'; }
}


    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initAlkane, 150);

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(() => {});
        }
    });
    </script>
</body>
