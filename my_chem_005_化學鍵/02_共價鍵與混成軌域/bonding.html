<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 互動化學鍵結模擬 (Blogger 版)</title>
    <!-- 引入現代字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- 外部資源：檔案置於 GitHub 空間 -->
    <link rel="stylesheet" href="https://julchung.github.io/chemplay/bonding/style.css">
    
    <style>
        /* 強力清空 Blogger 樣式，確保模擬頁面全螢幕呈現 */
        #header-wrapper, .header-outer, .column-right-outer, .column-left-outer, 
        .footer-outer, .post-footer, .comments, .blog-pager, #sidebar-right-1,
        .navbar, .header-cap, .footer-cap, .main-cap-top, .main-cap-bottom,
        .bt-header, .bt-footer, .bt-sidebar, .bt-meta {
            display: none !important;
        }
        
        body, html {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: #0d1117 !important;
        }
        
        .main-inner, .content-inner, .post-body, .region-inner, .post-outer, .column-center-inner {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
        }

        /* 全螢幕容器：強制覆蓋在所有 Blogger 元素之上 */
        .blogger-fullscreen-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #0d1117;
            display: flex;
        }

        /* 返回部落格連結樣式 */
        .back-to-blog {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100000;
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            padding: 10px 20px;
            border: 1px solid rgba(88, 166, 255, 0.4);
            border-radius: 30px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }


        .back-to-blog:hover {
            background: #58a6ff;
            color: #ffffff;
            border-color: #58a6ff;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
            transform: translateY(-2px);
        }

        .back-to-blog:active {
            transform: translateY(0);
        }

        /* 避免返回按鈕遮住控制項 */
        .controls-container {
            padding-right: 180px !important;
        }
    </style>
</head>
<body>
    <!-- 返回部落格按鈕 -->
    <a href="https://julchung.blogspot.com/" class="back-to-blog">← 返回部落格</a>

    <!-- 全螢幕隔離容器 -->
    <div class="blogger-fullscreen-wrapper">
        <div class="app-container">
            <!-- 左側面板：選擇軌域 -->
            <aside class="sidebar">
                <div class="header">
                    <h2>3D 軌域成鍵模擬</h2>
                    <p>了解共價鍵在立體空間中的重疊與融合</p>
                    <div class="help-text">
                        [提示] <br>
                        滑鼠左鍵：旋轉鏡頭<br>
                        滑鼠右鍵：平移鏡頭<br>
                        滑鼠滾輪：縮放大小
                    </div>
                </div>
                
                <div class="atom-section">
                    <h3>選擇鍵結類型</h3>
                    <div class="orbital-options" id="options-preset">
                        <button class="orbital-btn active" data-preset="ss">s-s 單鍵 (σ)</button>
                        <button class="orbital-btn" data-preset="sp">s-p 單鍵 (σ)</button>
                        <button class="orbital-btn" data-preset="pp_sigma">p-p 單鍵 (σ)</button>
                        <button class="orbital-btn" data-preset="pp_pi">p-p 多重鍵 (π)</button>
                        <div class="btn-group">
                            <button class="orbital-btn main-btn" data-preset="sp2_sp2">sp2-sp2 鍵結</button>
                            <button class="orbital-btn sub-btn" id="toggle-pz" title="顯示未混成的 pz 軌域">pz 軌域</button>
                        </div>
                        <div class="btn-group">
                            <button class="orbital-btn main-btn" data-preset="sp_sp">sp-sp 混成鍵</button>
                            <div class="sub-btn-col">
                                <button class="orbital-btn sub-btn" id="toggle-py" title="顯示 py 軌域">py 軌域</button>
                                <button class="orbital-btn sub-btn" id="toggle-pz-sp" title="顯示 pz 軌域">pz 軌域</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="legend">
                    <h4>電子雲標示</h4>
                    <div class="legend-item"><span class="color-box pos"></span> 正相位 (+)</div>
                    <div class="legend-item"><span class="color-box neg"></span> 負相位 (-)</div>
                    <div class="legend-item"><span class="color-box sp"></span> 混成軌域</div>
                    <div class="legend-item"><span class="color-box core"></span> 原子核</div>
                    <p class="legend-hint">同相位互相接觸時會如同液體般融合降低能量，形成鍵結區域。</p>
                </div>
            </aside>

            <!-- 主畫面區：畫布與滑桿 -->
            <main class="main-display">
                <!-- 距離控制區置頂 -->
                <div class="controls-container">
                    <div class="control-header">
                        <span>遠 (Far)</span>
                        <label for="distance-slider">透過滑桿拉近兩個原子發生重疊</label>
                        <span>近 (Near)</span>
                    </div>
                    <!-- 值=0 代表最遠，100 代表最近 -->
                    <input type="range" id="distance-slider" min="0" max="100" value="0">
                </div>

                <!-- 3D 畫布區 -->
                <div class="canvas-container" id="webgl-container">
                    <!-- Three.js 將在此生成 <canvas> -->
                </div>
            </main>
        </div>
    </div>
    
    <!-- 使用 Import Map 指定 Three.js 路徑 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- 引入主邏輯 -->
    <script type="module" src="https://julchung.github.io/chemplay/bonding/app.js"></script>
</body>
</html>
