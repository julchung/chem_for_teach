<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原子混成軌域互動式展示 (Atomic Orbital Hybridization)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- External assets from GitHub -->
    <link rel="stylesheet" href="https://julchung.github.io/chemplay/antigravity_atom/style.css">
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* Blogger Layout Override - To hide blog elements and show app in full screen */
        body {
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background-color: #0b0f19 !important; /* Match app background */
        }

        /* Target Blogger theme containers to hide them */
        .header-outer, .footer-outer, .sidebar-wrapper, .post-title, .post-footer, 
        .blog-pager, .comments, #header, #footer, .tabs-outer, .column-right-outer,
        .column-left-outer, .post-share-buttons {
            display: none !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            visibility: hidden !important;
        }

        /* Ensure the app container covers everything */
        #app-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
            background-color: #0b0f19;
            margin: 0 !important;
        }

        /* "Return to Blog" Button */
        .back-to-blog {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000001; /* Above app-container */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-to-blog:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-color: #4fd1c5;
        }

        .back-to-blog svg {
            width: 18px;
            height: 18px;
        }

        /* Adjustment for instructions positioning to not overlap with back button on small screens */
        @media (max-width: 768px) {
            .back-to-blog {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Return Link -->
        <a href="https://julchung.blogspot.com/" class="back-to-blog" id="btn-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回部落格
        </a>

        <!-- 3D Canvas Area -->
        <div id="canvas-container">
            <div id="loading" class="active">正在載入 3D 引擎...</div>
            <div class="instructions">拖曳以旋轉模型 | 滾動以縮放</div>
            <canvas id="orbital-canvas"></canvas>
            
            <!-- Float Reset Button -->
            <button id="btn-reset" style="display:none;">重置 (Reset)</button>
        </div>

        <!-- UI Sidebar / Bottom Sheet -->
        <aside id="controls-panel">
            <header>
                <h1>混成軌域展示</h1>
                <p>挑選欲重疊的軌域，若選取數量符合化學定則，即可解鎖「總表」並執行 3 秒的形變融合混成。</p>
            </header>

            <div class="orbital-selector-container">
                <h2>1. 選擇原子軌域</h2>
                <div class="orbital-grid">
                    <button class="atomic-btn" data-orb="s">s</button>
                    <button class="atomic-btn" data-orb="px">p<sub>x</sub></button>
                    <button class="atomic-btn" data-orb="py">p<sub>y</sub></button>
                    <button class="atomic-btn" data-orb="pz">p<sub>z</sub></button>
                    <button class="atomic-btn" data-orb="dz2">d<sub>z²</sub></button>
                    <button class="atomic-btn" data-orb="dx2y2">d<sub>x²-y²</sub></button>
                </div>
            </div>

            <div class="summary-table-container">
                <h2>2. 觸發對應的混成</h2>
                <div class="hybrid-options">
                    <!-- sp -->
                    <button class="hybrid-btn locked" data-type="sp" disabled>
                        <div class="btn-content">
                            <span class="type-badge">sp</span>
                            <span class="shape-name">直線型 (Linear)</span>
                            <span class="angle-info">180°</span>
                        </div>
                    </button>
                    <!-- sp2 -->
                    <button class="hybrid-btn locked" data-type="sp2" disabled>
                        <div class="btn-content">
                            <span class="type-badge">sp²</span>
                            <span class="shape-name">平面三角形 (Trigonal Planar)</span>
                            <span class="angle-info">120°</span>
                        </div>
                    </button>
                    <!-- sp3 -->
                    <button class="hybrid-btn locked" data-type="sp3" disabled>
                        <div class="btn-content">
                            <span class="type-badge">sp³</span>
                            <span class="shape-name">四面體 (Tetrahedral)</span>
                            <span class="angle-info">109.5°</span>
                        </div>
                    </button>
                    <!-- sp3d -->
                    <button class="hybrid-btn locked" data-type="sp3d" disabled>
                        <div class="btn-content">
                            <span class="type-badge">sp³d</span>
                            <span class="shape-name">雙三角錐 (Trigonal Bipyramidal)</span>
                            <span class="angle-info">90° / 120°</span>
                        </div>
                    </button>
                    <!-- sp3d2 -->
                    <button class="hybrid-btn locked" data-type="sp3d2" disabled>
                        <div class="btn-content">
                            <span class="type-badge">sp³d²</span>
                            <span class="shape-name">八面體 (Octahedral)</span>
                            <span class="angle-info">90°</span>
                        </div>
                    </button>
                </div>
            </div>
            
        </aside>
    </div>

    <!-- External app.js from GitHub -->
    <script type="module" src="https://julchung.github.io/chemplay/antigravity_atom/app.js"></script>
</body>
</html>
