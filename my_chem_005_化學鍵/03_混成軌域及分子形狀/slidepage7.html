<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 混成軌域互動模擬 | 互動教學</title>
    <meta name="description" content="選修化學二 第三章：混成軌域與分子幾何 3D 模擬教學">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }

        .slide-iframe-container {
            width: 100%;
            height: 100vh;
            min-height: max(100vh, 720px);
            display: flex;
            flex-direction: column;
            padding: 0.6rem 1.2rem 0.8rem;
            box-sizing: border-box;
            overflow: hidden;
        }

        h1 {
            color: var(--accent-blue);
            font-size: clamp(1.2rem, 2.2vw, 1.65rem);
            margin: 0.2rem 0 0.3rem 0;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            border-bottom: 2px solid rgba(56, 189, 248, 0.28);
            padding-bottom: 0.25rem;
            flex-shrink: 0;
        }
        h1::before {
            content: "";
            width: 7px;
            height: 24px;
            background: linear-gradient(var(--accent-blue), var(--accent-cyan));
            border-radius: 4px;
        }

        .iframe-caption {
            flex-shrink: 0;
            font-size: 0.88rem;
            color: rgba(248, 250, 252, 0.7);
            margin-bottom: 0.45rem;
            padding: 0.1rem 0.2rem;
            line-height: 1.4;
        }
        .iframe-caption strong {
            color: var(--accent-cyan);
        }

        .iframe-wrap {
            flex: 1 1 auto;
            width: 100%;
            min-height: calc(100vh - 120px);
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
            background: #0b0e1a;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .iframe-wrap iframe {
            width: 100%;
            height: 100%;
            flex: 1 1 auto;
            min-height: calc(100vh - 120px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="slide-iframe-container">
    <h1>3D 混成軌域互動模擬</h1>
    <p class="iframe-caption"><strong>操作指引：</strong>選取左側原子軌域（s、px、py、pz…），符合化學成鍵定則後可解鎖 sp / sp² / sp³ 等 3D 混成動畫｜支援滑鼠左鍵旋轉、滾輪縮放視角。</p>
    <div class="iframe-wrap">
        <iframe id="sim-frame" src="vsepr.html" title="3D 混成軌域互動模擬" allow="fullscreen"></iframe>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const frame = document.getElementById('sim-frame');
    if (frame) {
        frame.addEventListener('load', () => {
            try {
                if (frame.contentWindow) {
                    frame.contentWindow.dispatchEvent(new Event('resize'));
                    setTimeout(() => {
                        try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch(e) {}
                    }, 300);
                }
            } catch(e) {}
        });
    }
});

window.addEventListener('resize', () => {
    const frame = document.getElementById('sim-frame');
    if (frame && frame.contentWindow) {
        try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch(e) {}
    }
});
</script>

</body>
</html>
