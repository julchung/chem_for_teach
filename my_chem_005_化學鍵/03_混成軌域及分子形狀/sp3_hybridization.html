<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碳的 sp³ 混成軌域</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@700&display=swap');

    :root {
      --bg: #0b0e1a; --panel: #111827; --border: #1e2d4a;
      --c1: #38bdf8; --c2: #a78bfa; --c3: #34d399;
      --gold: #fbbf24; --text: #e2e8f0; --dim: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Noto Sans TC',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; padding:8px 12px;
    }
    h1 {
      font-family:'Orbitron',sans-serif;
      text-align:center; font-size:1.1rem;
      background:linear-gradient(135deg,var(--c1),var(--c2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:3px; letter-spacing:1px;
    }
    .subtitle { text-align:center; color:var(--dim); font-size:.75rem; margin-bottom:8px; }

    .zones {
      display:grid; grid-template-columns:1fr 1fr 1fr;
      gap:8px; max-width:1140px; margin:0 auto 8px;
    }
    .zone {
      background:var(--panel); border:1px solid var(--border);
      border-radius:10px; padding:6px 8px 6px; position:relative;
    }
    .zone-1 { box-shadow:inset 0 0 40px rgba(56,189,248,.05); }
    .zone-2 { box-shadow:inset 0 0 40px rgba(251,191,36,.05); }
    .zone-3 { box-shadow:inset 0 0 40px rgba(52,211,153,.05); }

    .zone-label {
      font-size:.58rem; font-weight:700; letter-spacing:1px;
      text-transform:uppercase; margin-bottom:3px;
      display:flex; align-items:center; gap:5px;
    }
    .zone-1 .zone-label{color:var(--c1);}
    .zone-2 .zone-label{color:var(--gold);}
    .zone-3 .zone-label{color:var(--c3);}
    .badge {
      display:inline-flex; align-items:center; justify-content:center;
      width:16px; height:16px; border-radius:50%;
      font-size:.58rem; font-weight:700;
    }
    .zone-1 .badge{background:rgba(56,189,248,.2);color:var(--c1);}
    .zone-2 .badge{background:rgba(251,191,36,.2);color:var(--gold);}
    .zone-3 .badge{background:rgba(52,211,153,.2);color:var(--c3);}
    .zone-title { font-size:.78rem; font-weight:700; margin-bottom:4px; line-height:1.2; }
    .orbital-canvas { width:100%; display:block; border-radius:6px; }

    .anim-section {
      max-width:1140px; margin:0 auto;
      background:var(--panel); border:1px solid var(--border);
      border-radius:12px; padding:12px 16px;
    }
    .anim-title { text-align:left; font-size:1.25rem; font-weight:700; color:var(--c2); margin-bottom:8px; }
    .anim-subtitle { text-align:left; font-size:1rem; color:var(--dim); margin-bottom:14px; line-height:1.6; }
    .anim-content-row { display:flex; gap:16px; align-items:stretch; }
    .anim-left { flex:1; display:flex; flex-direction:column; justify-content:center; }
    .anim-right { flex:1.5; display:flex; flex-direction:column; }
    .anim-canvas {
      display:block; margin:0 auto; border-radius:8px;
      background:#070a14; max-width:100%;
    }
    .step-label {
      font-size:1rem; color:var(--dim);
      text-align:left; min-height:20px; line-height:1.6;
    }
    @media(max-width:800px){
      .zones{grid-template-columns:1fr;}
      .anim-content-row{flex-direction:column;}
      .anim-title, .anim-subtitle, .step-label { text-align:center; }
    }
  </style>
</head>
<body>

<h1>碳的 sp³ 混成軌域</h1>

<div class="zones">
  <div class="zone zone-1">
    <div class="zone-label"><span class="badge">1</span> 基態 Ground State</div>
    <div class="zone-title">碳的電子組態 1s²2s²2p²</div>
    <canvas class="orbital-canvas" id="c1" width="310" height="290"></canvas>
  </div>
  <div class="zone zone-2">
    <div class="zone-label"><span class="badge">2</span> 激發態 Excited State</div>
    <div class="zone-title">能量激發：2s → 2p 電子提升</div>
    <canvas class="orbital-canvas" id="c2" width="310" height="290"></canvas>
  </div>
  <div class="zone zone-3">
    <div class="zone-label"><span class="badge">3</span> 混成 sp³ Hybridization</div>
    <div class="zone-title">4 個等價 sp³ 混成軌域</div>
    <canvas class="orbital-canvas" id="c3" width="310" height="290"></canvas>
  </div>
</div>

<div class="anim-section">
  <div class="anim-content-row">
    <div class="anim-left">
      <div class="anim-title">⚛️ CH₄ 甲烷 3D 成鍵動畫</div>
      <div class="anim-subtitle">四個氫原子（1s 軌域）沿 sp³ 四面體方向接近碳原子（支援滑鼠拖曳旋轉 3D 視角）</div>
      <div class="step-label" id="stepLabel">動畫載入中，請稍候…</div>
    </div>
    <div class="anim-right">
      <div id="three-container" style="position: relative; width: 100%; height: 250px; border-radius: 10px; overflow: hidden; background: #070a14; cursor: grab;"></div>
    </div>
  </div>
</div>

<!-- 使用 Import Map 指定 Three.js 路徑 -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
    }
}
</script>

<script>
// ════════════════════════════════════════════════════
// SHARED CONSTANTS
// ════════════════════════════════════════════════════
const CW=310, CH=290, CX=155;

// Color palette
const C2P='#a78bfa', C2S='#38bdf8', CSP3='#34d399', CPROM='#fbbf24';
const HCOLS=['#38bdf8','#a78bfa','#34d399','#fb923c'];

function hex2rgba(hex, alpha) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Zone 1 & 2 layout (y increases downward; top = high energy) ──
const Y2P   = 28;   // 2p orbital lines
const Y2PS  = 68;   // 2p dumbbell shape centers
const Y2S   = 170;  // 2s orbital line
const Y2SS  = 196;  // 2s sphere center (closer to line)

// 2p x-positions: three p orbitals side by side
const PSP   = 75;   // spacing between p orbital lines
const PLW   = 66;   // length of orbital line (increased from 50)
const P2X   = [CX-PSP, CX, CX+PSP]; 

// ── Zone 3 sp3 layout ──
const Y_SP3 = 64;
const YSP3C = 138;  // center of sp3 3D lobe diagram
const SP3SP = 75;   // spacing between 4 sp3 orbital lines
const SP3L  = 16;   // sp3 lobe parameter (shrunk to not exceed line length)

const SP3DIRS = [
  [-0.5,  -0.866],
  [ 0.5,  -0.866],
  [ 0.866, 0.5  ],
  [-0.866, 0.5  ],
];

// ════════════════════════════════════════════════════
// DRAWING PRIMITIVES
// ════════════════════════════════════════════════════

function drawEnergyAxis(ctx, h) {
  ctx.save();
  ctx.strokeStyle='#2d3f5a'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(20,h-10); ctx.lineTo(20,18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,18); ctx.lineTo(14,30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,18); ctx.lineTo(26,30); ctx.stroke();
  ctx.font='bold 10px sans-serif'; ctx.fillStyle='#475569';
  ctx.textAlign='center'; ctx.fillText('E',20,13); ctx.restore();
}

function drawOrbLine(ctx, cx, cy, w, color) {
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.shadowColor=color; ctx.shadowBlur=9;
  ctx.beginPath(); ctx.moveTo(cx-w/2,cy); ctx.lineTo(cx+w/2,cy); ctx.stroke();
  ctx.restore();
}

function drawSpin(ctx, x, lineY, up, color) {
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.shadowColor=color; ctx.shadowBlur=9;
  const top=lineY-24, bot=lineY-4;
  if(up){
    ctx.beginPath(); ctx.moveTo(x,bot); ctx.lineTo(x,top); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x-4.5,top+8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x+4.5,top+8); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,bot); ctx.lineTo(x-4.5,bot-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,bot); ctx.lineTo(x+4.5,bot-8); ctx.stroke();
  }
  ctx.restore();
}

function drawDumbbell(ctx, cx, cy, rx, ry, angle, color) {
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(0,-ry,rx,ry,0,0,Math.PI*2);
  const g1=ctx.createRadialGradient(0,-ry*.4,1,0,-ry,ry);
  g1.addColorStop(0, hex2rgba(color, 0.93)); 
  g1.addColorStop(1, hex2rgba(color, 0.12));
  ctx.fillStyle=g1; ctx.shadowColor=color; ctx.shadowBlur=8; ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
  
  ctx.beginPath(); ctx.ellipse(0,ry,rx*.8,ry*.8,0,0,Math.PI*2);
  const g2=ctx.createRadialGradient(0,ry*.4,1,0,ry,ry*.8);
  g2.addColorStop(0, hex2rgba(color, 0.53)); 
  g2.addColorStop(1, hex2rgba(color, 0.06));
  ctx.fillStyle=g2; ctx.shadowBlur=0; ctx.fill();
  ctx.strokeStyle=hex2rgba(color, 0.33); ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function drawSphere(ctx, cx, cy, r, color) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  const g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,2,cx,cy,r);
  g.addColorStop(0, hex2rgba(color, 0.8)); 
  g.addColorStop(.55, hex2rgba(color, 0.4)); 
  g.addColorStop(1, hex2rgba(color, 0.09));
  ctx.fillStyle=g; ctx.shadowColor=color; ctx.shadowBlur=16; ctx.fill();
  ctx.strokeStyle=hex2rgba(color, 0.6); ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
}

function drawSP3Lobe(ctx, cx, cy, len, angle, color) {
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
  ctx.beginPath(); ctx.ellipse(0,-len*.6,len*.22,len*.6,0,0,Math.PI*2);
  const gp=ctx.createRadialGradient(0,-len*.4,2,0,-len*.6,len*.6);
  gp.addColorStop(0, hex2rgba(color, 0.87)); 
  gp.addColorStop(1, hex2rgba(color, 0.08));
  ctx.fillStyle=gp; ctx.shadowColor=color; ctx.shadowBlur=10; ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
  
  ctx.beginPath(); ctx.ellipse(0,len*.18,len*.09,len*.18,0,0,Math.PI*2);
  ctx.fillStyle=hex2rgba(color, 0.16); ctx.shadowBlur=0; ctx.fill(); ctx.restore();
}

function label(ctx, text, x, y, color, size, align) {
  ctx.save(); ctx.font=(size||10)+'px Noto Sans TC';
  ctx.fillStyle=color||'#94a3b8'; ctx.textAlign=align||'center';
  ctx.fillText(text,x,y); ctx.restore();
}

// ════════════════════════════════════════════════════
// ZONE 1 — Ground State
// ════════════════════════════════════════════════════
(function drawZone1(){
  const ctx=document.getElementById('c1').getContext('2d');
  ctx.clearRect(0,0,CW,CH);
  drawEnergyAxis(ctx,CH);

  ctx.save(); ctx.font='bold 13px Noto Sans TC'; ctx.fillStyle=C2P;
  ctx.textAlign='left'; ctx.fillText('2p',30,Y2P+4); ctx.restore();

  for(let i=0;i<3;i++) drawOrbLine(ctx,P2X[i],Y2P,PLW,C2P);

  ['2px','2py','2pz'].forEach((lb,i)=>
    label(ctx,lb,P2X[i],Y2P+16,hex2rgba(C2P, 0.67),9));

  drawSpin(ctx,P2X[0],Y2P,true,C2P);
  drawSpin(ctx,P2X[1],Y2P,true,C2P);

  // 2p orbital shapes (shrunk: rx=5, ry=16)
  drawDumbbell(ctx,P2X[0],Y2PS,4,12,Math.PI/2,C2P); 
  drawDumbbell(ctx,P2X[1],Y2PS,4,12,0,C2P);          
  drawDumbbell(ctx,P2X[2],Y2PS,4,12,Math.PI/4,C2P);  
  ['px','py','pz'].forEach((lb,i)=>
    label(ctx,lb,P2X[i],Y2PS+20,hex2rgba(C2P, 0.53),9));

  ctx.save(); ctx.font='bold 13px Noto Sans TC'; ctx.fillStyle=C2S;
  ctx.textAlign='left'; ctx.fillText('2s',30,Y2S+4); ctx.restore();

  drawOrbLine(ctx,CX,Y2S,PLW,C2S);
  drawSpin(ctx,CX-11,Y2S,true,C2S);
  drawSpin(ctx,CX+11,Y2S,false,'#fb923c');

  // 2s sphere (shrunk: r=11)
  drawSphere(ctx,CX,Y2SS,11,C2S);
  ctx.save(); ctx.font='bold 10px Noto Sans TC'; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('2s',CX,Y2SS); ctx.restore();

  label(ctx,'基態 C：1s²2s²2p²',CX,CH-26,C2S,10);
})();

// ════════════════════════════════════════════════════
// ZONE 2 — Excited State
// ════════════════════════════════════════════════════
(function drawZone2(){
  const ctx=document.getElementById('c2').getContext('2d');
  ctx.clearRect(0,0,CW,CH);
  drawEnergyAxis(ctx,CH);

  ctx.save(); ctx.font='bold 13px Noto Sans TC'; ctx.fillStyle=C2P;
  ctx.textAlign='left'; ctx.fillText('2p',30,Y2P+4); ctx.restore();
  for(let i=0;i<3;i++) drawOrbLine(ctx,P2X[i],Y2P,PLW,C2P);
  label(ctx,'2px',P2X[0],Y2P+16,hex2rgba(C2P, 0.67),9);
  label(ctx,'2py',P2X[1],Y2P+16,hex2rgba(C2P, 0.67),9);
  label(ctx,'2pz',P2X[2],Y2P+16,hex2rgba(CPROM, 0.67),9);

  drawSpin(ctx,P2X[0],Y2P,true,C2P);
  drawSpin(ctx,P2X[1],Y2P,true,C2P);
  drawSpin(ctx,P2X[2],Y2P,true,CPROM);

  // 2p shapes (shrunk: rx=4, ry=12)
  drawDumbbell(ctx,P2X[0],Y2PS,4,12,Math.PI/2,C2P);
  drawDumbbell(ctx,P2X[1],Y2PS,4,12,0,C2P);
  drawDumbbell(ctx,P2X[2],Y2PS,4,12,Math.PI/4,CPROM);
  label(ctx,'px',P2X[0],Y2PS+20,hex2rgba(C2P, 0.53),9);
  label(ctx,'py',P2X[1],Y2PS+20,hex2rgba(C2P, 0.53),9);
  label(ctx,'pz',P2X[2],Y2PS+20,hex2rgba(CPROM, 0.53),9);

  ctx.save(); ctx.font='bold 13px Noto Sans TC'; ctx.fillStyle=C2S;
  ctx.textAlign='left'; ctx.fillText('2s',30,Y2S+4); ctx.restore();
  drawOrbLine(ctx,CX,Y2S,PLW,C2S);
  drawSpin(ctx,CX,Y2S,true,C2S);

  // 2s sphere (shrunk: r=11, identical to zone 1)
  drawSphere(ctx,CX,Y2SS,11,C2S);
  ctx.save(); ctx.font='bold 10px Noto Sans TC'; ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('2s',CX,Y2SS); ctx.restore();

  ctx.save();
  ctx.strokeStyle=CPROM; ctx.lineWidth=2;
  ctx.setLineDash([5,4]); ctx.shadowColor=CPROM; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(CX+15, Y2S-8);
  ctx.bezierCurveTo(CX+80,Y2S-50, P2X[2]+15,Y2P+40, P2X[2],Y2P+5);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(P2X[2],Y2P+5); ctx.lineTo(P2X[2]-6,Y2P+17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(P2X[2],Y2P+5); ctx.lineTo(P2X[2]+5,Y2P+16); ctx.stroke();
  ctx.restore();
  label(ctx,'能量激發',CX+62,Y2S-42,CPROM,9,'center');

  label(ctx,'激發態 C：1s²2s¹2p³',CX,CH-26,CPROM,10);
})();

// ════════════════════════════════════════════════════
// ZONE 3 — sp³ Hybridization
// ════════════════════════════════════════════════════
(function drawZone3(){
  const ctx=document.getElementById('c3').getContext('2d');
  ctx.clearRect(0,0,CW,CH);
  drawEnergyAxis(ctx,CH);

  ctx.save();
  ctx.strokeStyle=hex2rgba(C2P, 0.33); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(14,Y2P); ctx.lineTo(27,Y2P); ctx.stroke();
  ctx.font='9px Noto Sans TC'; ctx.fillStyle=hex2rgba(C2P, 0.4); ctx.textAlign='left';
  ctx.fillText('2p',29,Y2P+4); ctx.restore();

  ctx.save();
  ctx.strokeStyle=hex2rgba(C2S, 0.33); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(14,Y2S); ctx.lineTo(27,Y2S); ctx.stroke();
  ctx.font='9px Noto Sans TC'; ctx.fillStyle=hex2rgba(C2S, 0.4); ctx.textAlign='left';
  ctx.fillText('2s',29,Y2S+4); ctx.restore();

  ctx.save(); ctx.font='bold 13px Noto Sans TC'; ctx.fillStyle=CSP3;
  ctx.textAlign='left'; ctx.fillText('sp³',30,Y_SP3+4); ctx.restore();
  label(ctx,'×4（四個等價）',CX+18,Y_SP3-14,hex2rgba(CSP3, 0.6),9,'center');

  const sp3X=[CX-1.5*SP3SP, CX-0.5*SP3SP, CX+0.5*SP3SP, CX+1.5*SP3SP];
  for(let i=0;i<4;i++){
    drawOrbLine(ctx,sp3X[i],Y_SP3,PLW,CSP3);
    drawSpin(ctx,sp3X[i],Y_SP3,true,CSP3);
  }

  // sp³ 3D lobe diagram BELOW the lines
  const lobeAngles=SP3DIRS.map(d=>Math.atan2(d[0],-d[1]));
  for(let i=0;i<4;i++)
    drawSP3Lobe(ctx,CX,YSP3C,SP3L,lobeAngles[i],HCOLS[i]);

  ctx.save();
  ctx.beginPath(); ctx.arc(CX,YSP3C,6,0,Math.PI*2); // Shrunk from 10
  const cg=ctx.createRadialGradient(CX-2,YSP3C-2,1,CX,YSP3C,6);
  cg.addColorStop(0,'#94a3b8'); cg.addColorStop(1,'#1e293b');
  ctx.fillStyle=cg; ctx.shadowColor='#cbd5e1'; ctx.shadowBlur=8; ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.font='bold 11px Noto Sans TC'; ctx.fillStyle='#fff'; ctx.shadowBlur=0;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('C',CX,YSP3C);
  ctx.restore();

  for(let i=0;i<4;i++){
    const tipX=CX+SP3DIRS[i][0]*SP3L*1.5;
    const tipY=YSP3C+SP3DIRS[i][1]*SP3L*1.5;
    label(ctx,'sp³',tipX,tipY+4,HCOLS[i],9,'center');
  }

  label(ctx,'4 個等價 sp³ 混成軌域（四面體）',CX,CH-26,CSP3,10);
})();

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const container = document.getElementById('three-container');

// Scene Setup
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 11);

// WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// CSS2D Renderer for HTML Labels
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(container.clientWidth, container.clientHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
backLight.position.set(-5, -5, -7);
scene.add(backLight);

// Molecule Group
const molGroup = new THREE.Group();
scene.add(molGroup);

// Colors matching the original palette
const CSP3 = 0x34d399; 
const C1S  = 0x38bdf8; 

// Central Carbon Atom Core
const cGeo = new THREE.SphereGeometry(0.35, 32, 32);
const cMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, shininess: 30 });
const cMesh = new THREE.Mesh(cGeo, cMat);
molGroup.add(cMesh);

// "C" Label
const cDiv = document.createElement('div');
cDiv.textContent = 'C';
cDiv.style.color = '#ffffff';
cDiv.style.fontFamily = 'Noto Sans TC, sans-serif';
cDiv.style.fontWeight = 'bold';
cDiv.style.fontSize = '22px';
cDiv.style.textShadow = '0 0 6px #000';
const cLabel = new CSS2DObject(cDiv);
molGroup.add(cLabel);

// sp3 lobes
const lobeGeo = new THREE.SphereGeometry(0.7, 32, 32);
const lobeMat = new THREE.MeshPhongMaterial({
    color: CSP3,
    transparent: true,
    opacity: 0.8,
    shininess: 90
});

const dirs = [
    new THREE.Vector3(1, 1, 1).normalize(),
    new THREE.Vector3(-1, -1, 1).normalize(),
    new THREE.Vector3(-1, 1, -1).normalize(),
    new THREE.Vector3(1, -1, -1).normalize()
];

dirs.forEach((dir) => {
    const mesh = new THREE.Mesh(lobeGeo, lobeMat);
    mesh.scale.set(0.6, 1.4, 0.6);
    mesh.position.y = 0.8; 
    
    const pivot = new THREE.Group();
    pivot.add(mesh);
    
    const quaternion = new THREE.Quaternion();
    quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    pivot.quaternion.copy(quaternion);
    
    molGroup.add(pivot);
});

// H Atoms (1s orbitals)
const hGeo = new THREE.SphereGeometry(0.65, 32, 32);
const hMat = new THREE.MeshPhongMaterial({
    color: C1S,
    transparent: true,
    opacity: 0.7,
    shininess: 60
});

const hAtoms = [];
dirs.forEach((dir) => {
    const mesh = new THREE.Mesh(hGeo, hMat);
    
    const hDiv = document.createElement('div');
    hDiv.textContent = 'H';
    hDiv.style.color = '#ffffff';
    hDiv.style.fontFamily = 'Noto Sans TC, sans-serif';
    hDiv.style.fontWeight = 'bold';
    hDiv.style.fontSize = '18px';
    hDiv.style.textShadow = '0 0 5px #000';
    const hLabel = new CSS2DObject(hDiv);
    mesh.add(hLabel);
    
    molGroup.add(mesh);
    hAtoms.push({ mesh, dir });
});

// Animation State
let animPlaying = false;
let animProg = 0;
let t0 = 0;
const DUR = 5000;
const START_DIST = 5.0;
const BOND_DIST = 1.45;

function updatePositions(t) {
    const dist = START_DIST + (BOND_DIST - START_DIST) * t;
    hAtoms.forEach((h) => {
        h.mesh.position.copy(h.dir).multiplyScalar(dist);
    });
    
    let txt;
    if(t < 0.2) txt = '① 碳原子準備了 4 個指向四面體頂點的 sp³ 混成軌域';
    else if(t < 0.8) txt = '② 四個氫原子 (H) 的 1s 軌域沿直線方向接近並進行重疊...';
    else txt = '✓ 鍵結完成！sp³ 軌域與 s 軌域重疊形成 σ 鍵，構成立體四面體的甲烷分子';
    document.getElementById('stepLabel').textContent = txt;
}

updatePositions(0);

window.play3DAnim = function() {
    if(animPlaying) return;
    animPlaying = true;
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
        playBtn.textContent = '▶ 播放中…';
        playBtn.disabled = true;
    }
    t0 = Date.now();
};

window.reset3DAnim = function() {
    animPlaying = false;
    animProg = 0;
    updatePositions(0);
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
        playBtn.textContent = '▶ 播放動畫';
        playBtn.disabled = false;
    }
    document.getElementById('stepLabel').textContent = '點擊「播放動畫」開始';
};

function animate() {
    requestAnimationFrame(animate);
    
    if(animPlaying) {
        animProg = Math.min((Date.now() - t0) / DUR, 1);
        const t = 1 - Math.pow(1 - animProg, 3); // easeOutCubic
        updatePositions(t);
        
        molGroup.rotation.y += 0.003;
        molGroup.rotation.x += 0.001;
        
        if(animProg >= 1) {
            animPlaying = false;
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
                playBtn.textContent = '✓ 完成 (自動重播)';
                playBtn.disabled = false;
            }
            setTimeout(() => {
                if(!animPlaying && animProg >= 1) {
                    window.reset3DAnim();
                    window.play3DAnim();
                }
            }, 3000);
        }
    } else {
        // Slow idle rotation
        molGroup.rotation.y += 0.0015;
    }
    
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    if(!container.clientWidth) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    labelRenderer.setSize(container.clientWidth, container.clientHeight);
});

window.addEventListener('load', () => {
    setTimeout(() => {
        window.play3DAnim();
    }, 500);
});
</script>
</body>
