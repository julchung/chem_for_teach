<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3-5 互動挑戰：陽離子分離實驗 | 互動教學</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container {
            position: absolute;
            top: 1.2vh; left: 1.8vw; right: 1.8vw; bottom: 1.2vh;
            display: flex; flex-direction: column; gap: 0.6rem;
        }
        h1 {
            color: var(--accent-cyan); font-size: clamp(1.25rem, 1.8vw, 1.7rem);
            margin-bottom: 0.2rem; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid rgba(34, 211, 238, 0.25); padding-bottom: 0.25rem; flex-shrink: 0;
        }
        .title-left { display: flex; align-items: center; gap: 0.6rem; }
        .title-left::before { content: ""; width: 7px; height: 24px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 1.1rem;
            flex: 1;
            min-height: 0;
        }

        .stage-panel {
            background: var(--glass);
            border: 1.5px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.2rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
        }

        .stage-scroll-area {
            flex: 1;
            display: flex;
            align-items: flex-start;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px 10px;
            position: relative;
        }
        .stage-scroll-area::-webkit-scrollbar { height: 6px; }
        .stage-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        /* 燒杯卡片 */
        .beaker-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 14px 18px;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            flex-shrink: 0;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .beaker-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 8px rgba(56,189,248,0.4));
        }
        .beaker-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
        }
        .beaker-ions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        /* 步驟箭頭與反應結果 */
        .step-arrow-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            flex-shrink: 0;
            gap: 6px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .anion-badge {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid var(--accent-blue);
            color: var(--accent-cyan);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
        }
        .arrow-graphic {
            font-size: 1.6rem;
            color: #64748b;
        }
        .ppt-badge {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid var(--accent-red);
            color: #fca5a5;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 800;
        }
        .ppt-badge.err {
            background: rgba(239, 68, 68, 0.35);
            border-color: #ef4444;
            color: #fecaca;
        }

        /* 控制台面 */
        .control-panel {
            background: var(--glass);
            border: 1.5px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.1rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
            min-height: 0;
        }

        .control-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .anion-btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .btn-anion {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-anion:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
            color: #38bdf8;
            transform: translateX(3px);
        }

        .feedback-banner {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.5;
            display: none;
        }
        .feedback-banner.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34d399;
            display: block;
        }
        .feedback-banner.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            display: block;
        }

        .success-stamp {
            position: absolute;
            right: 20px;
            bottom: 20px;
            border: 3px solid #34d399;
            color: #34d399;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 12px;
            transform: rotate(-10deg);
            background: rgba(52,211,153,0.1);
            box-shadow: 0 0 16px rgba(52,211,153,0.3);
            display: none;
            animation: stampIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes stampIn { from { transform: scale(2) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(-10deg); opacity: 1; } }

        .btn-action {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: #f8fafc;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-blue);
            color: #38bdf8;
        }

        @media (max-width: 900px) {
            .game-layout { grid-template-columns: 1fr; }
            body, html, #app { overflow: auto; }
            #slides-container { position: relative; height: auto; min-height: 100vh; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="slides-container">
        <h1>
            <span class="title-left">3-5 沉澱表與沉澱規則 &middot; 陽離子分離實驗</span>
            <span style="font-size:0.85rem; color:#94a3b8; font-weight:500;">⚗️ 依序加入適當試劑，每次精準只沉澱分離一種陽離子</span>
        </h1>

        <div class="game-layout">
            <!-- 實驗試管主舞台 -->
            <div class="stage-panel">
                <div style="font-size:0.9rem; color:#cbd5e1; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span>當前實驗題目：<strong id="puzzle-title" style="color:var(--accent-yellow);">題目載入中...</strong></span>
                    <span id="step-badge" style="color:var(--accent-cyan); font-weight:700;">步驟 1 / 3</span>
                </div>

                <div class="stage-scroll-area" id="stage-area"></div>

                <div id="feedback-banner" class="feedback-banner"></div>
                <div id="success-stamp" class="success-stamp">分離成功 ✓</div>
            </div>

            <!-- 控制面板：選擇陰離子試劑 -->
            <div class="control-panel">
                <div class="control-title">
                    <span>🧪 選擇加入之試劑</span>
                    <button class="btn-action" style="padding:2px 8px; font-size:0.75rem;" onclick="nextPuzzle()">換題 ↻</button>
                </div>
                <div style="font-size:0.8rem; color:#94a3b8;">
                    請點選下方陰離子。目標：使目前溶液中**恰好只有一種**陽離子沉澱！
                </div>

                <div class="anion-btn-grid" id="anion-btn-container"></div>

                <button class="btn-action" onclick="resetCurrentPuzzle()" style="margin-top:auto;">
                    ↺ 重試此題
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const ionDetails = {
    'Ag':  { label: 'Ag<sup>+</sup>',  color: '#f8fafc' },
    'Pb':  { label: 'Pb<sup>2+</sup>', color: '#cbd5e1' },
    'Ba':  { label: 'Ba<sup>2+</sup>', color: '#facc15' },
    'Ca':  { label: 'Ca<sup>2+</sup>', color: '#fb923c' },
    'Mg':  { label: 'Mg<sup>2+</sup>', color: '#4ade80' },
    'Cu':  { label: 'Cu<sup>2+</sup>', color: '#60a5fa' },
    'Zn':  { label: 'Zn<sup>2+</sup>', color: '#c084fc' },
    'Fe':  { label: 'Fe<sup>3+</sup>', color: '#f87171' },
    'K':   { label: 'K<sup>+</sup>',   color: '#f472b6' }
};

const anionDetails = {
    'Cl':   { label: '$\\text{Cl}^-$',           name: '鹽酸 / 氯離子' },
    'SO4':  { label: '$\\text{SO}_4^{2-}$',      name: '硫酸根' },
    'OH':   { label: '$\\text{OH}^-$',           name: '氫氧根' },
    'S':    { label: '$\\text{S}^{2-}$',         name: '硫離子' },
    'CO3':  { label: '$\\text{CO}_3^{2-}$',      name: '碳酸根' },
    'CrO4': { label: '$\\text{CrO}_4^{2-}$',     name: '鉻酸根' }
};

// 沉澱規則判斷函數
function getPrecipitates(cations, anion) {
    const ppts = [];
    cations.forEach(cat => {
        let isPpt = false;
        let formula = '';
        if (anion === 'Cl') {
            if (['Ag', 'Pb'].includes(cat)) { isPpt = true; formula = cat === 'Ag' ? 'AgCl' : 'PbCl₂'; }
        } else if (anion === 'SO4') {
            if (['Ba', 'Pb', 'Ca'].includes(cat)) { isPpt = true; formula = cat + 'SO₄'; }
        } else if (anion === 'OH') {
            if (['Mg', 'Cu', 'Zn', 'Fe', 'Ag', 'Pb'].includes(cat)) { isPpt = true; formula = cat + '(OH)ₙ'; }
        } else if (anion === 'S') {
            if (!['IA', 'IIA', 'Ba', 'Ca', 'Mg', 'K'].includes(cat)) { isPpt = true; formula = cat + 'S'; }
        } else if (anion === 'CrO4') {
            if (['Ba', 'Pb', 'Ag'].includes(cat)) { isPpt = true; formula = cat + 'CrO₄'; }
        } else if (anion === 'CO3') {
            if (cat !== 'K') { isPpt = true; formula = cat + 'CO₃'; }
        }
        if (isPpt) ppts.push({ cation: cat, formula });
    });
    return ppts;
}

const puzzles = [
    { title: '題組一：[Ag⁺, Ba²⁺, Mg²⁺]', cations: ['Ag', 'Ba', 'Mg'], candidates: ['Cl', 'SO4', 'OH', 'CO3'] },
    { title: '題組二：[Pb²⁺, Ba²⁺, Cu²⁺]', cations: ['Pb', 'Ba', 'Cu'], candidates: ['Cl', 'SO4', 'S', 'OH'] },
    { title: '題組三：[Ag⁺, Pb²⁺, Ba²⁺]', cations: ['Ag', 'Pb', 'Ba'], candidates: ['CrO4', 'Cl', 'SO4', 'CO3'] },
    { title: '題組四：[Cu²⁺, Mg²⁺, K⁺]',  cations: ['Cu', 'Mg', 'K'],  candidates: ['S', 'OH', 'CO3', 'Cl'] }
];

let currentPuzzleIdx = 0;
let currentRemaining = [];
let historySteps = [];

function loadPuzzle(idx) {
    currentPuzzleIdx = idx;
    const p = puzzles[currentPuzzleIdx];
    currentRemaining = [...p.cations];
    historySteps = [];
    document.getElementById('puzzle-title').textContent = p.title;
    document.getElementById('success-stamp').style.display = 'none';
    hideFeedback();
    renderStage();
    renderButtons();
}

function nextPuzzle() {
    loadPuzzle((currentPuzzleIdx + 1) % puzzles.length);
}

function resetCurrentPuzzle() {
    loadPuzzle(currentPuzzleIdx);
}

function renderStage() {
    const stage = document.getElementById('stage-area');
    stage.innerHTML = '';

    // 起始燒杯
    stage.appendChild(createBeakerNode('起始混合液', puzzles[currentPuzzleIdx].cations));

    // 歷程步驟
    historySteps.forEach((st, idx) => {
        // 箭頭
        stage.appendChild(createArrowNode(st.anion, st.pptFormula, st.isError));
        // 後續濾液
        if (!st.isError) {
            stage.appendChild(createBeakerNode(`濾液 ${idx + 1}`, st.remaining));
        }
    });

    const isComplete = currentRemaining.length === 0 || (currentRemaining.length === 1 && currentRemaining[0] === 'K');
    if (isComplete && !historySteps.some(s => s.isError)) {
        document.getElementById('success-stamp').style.display = 'block';
    }

    document.getElementById('step-badge').textContent = `步驟 ${historySteps.length + 1} / 3`;

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([stage]).catch(() => {});
    }
}

function createBeakerNode(title, cations) {
    const card = document.createElement('div');
    card.className = 'beaker-card';
    card.innerHTML = `
        <div class="beaker-icon">🧪</div>
        <div class="beaker-title">${title}</div>
        <div class="beaker-ions">
            ${cations.length === 0 ? '<span style="color:#94a3b8;font-size:0.85rem;">(全部分離完成)</span>' :
              cations.map(c => `<span style="color:${ionDetails[c].color}">${ionDetails[c].label}</span>`).join(' ')}
        </div>
    `;
    return card;
}

function createArrowNode(anion, pptFormula, isError) {
    const box = document.createElement('div');
    box.className = 'step-arrow-box';
    box.innerHTML = `
        <div class="anion-badge">+ ${anionDetails[anion].label}</div>
        <div class="arrow-graphic">➔</div>
        <div class="ppt-badge ${isError ? 'err' : ''}">沉澱：${pptFormula}</div>
    `;
    return box;
}

function renderButtons() {
    const container = document.getElementById('anion-btn-container');
    container.innerHTML = '';
    const cand = puzzles[currentPuzzleIdx].candidates;

    cand.forEach(an => {
        const btn = document.createElement('button');
        btn.className = 'btn-anion';
        btn.innerHTML = `<span>${anionDetails[an].label}</span> <small style="font-size:0.8rem;color:#94a3b8;">${anionDetails[an].name}</small>`;
        btn.addEventListener('click', () => applyAnion(an));
        container.appendChild(btn);
    });

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([container]).catch(() => {});
    }
}

function applyAnion(anion) {
    if (currentRemaining.length === 0) return;

    const ppts = getPrecipitates(currentRemaining, anion);

    if (ppts.length === 0) {
        showFeedback(`加入 ${anionDetails[anion].label} 無法沉澱任何離子，無法達到分離目的！`, true);
        return;
    }
    if (ppts.length > 1) {
        const pNames = ppts.map(p => p.formula).join('、');
        showFeedback(`加入 ${anionDetails[anion].label} 同時沉澱了多種離子（${pNames}），違反「逐一分離」規則！請重試。`, true);
        historySteps.push({ anion, pptFormula: pNames + ' (多重沉澱)', isError: true, remaining: currentRemaining });
        renderStage();
        return;
    }

    // 剛好沉澱一種
    const single = ppts[0];
    currentRemaining = currentRemaining.filter(c => c !== single.cation);
    historySteps.push({ anion, pptFormula: single.formula + ' ↓', isError: false, remaining: [...currentRemaining] });

    if (currentRemaining.length === 0 || (currentRemaining.length === 1 && currentRemaining[0] === 'K')) {
        showFeedback(`🎉 成功！成功沉澱 ${single.formula}，所有陽離子皆已分離完成！`, false);
    } else {
        showFeedback(`✓ 成功沉澱分離 ${single.formula}，請繼續加入下一種試劑分離剩餘離子。`, false);
    }
    renderStage();
}

function showFeedback(msg, isError) {
    const fb = document.getElementById('feedback-banner');
    fb.className = 'feedback-banner ' + (isError ? 'error' : 'success');
    fb.innerHTML = msg;
    fb.style.display = 'block';
}

function hideFeedback() {
    const fb = document.getElementById('feedback-banner');
    fb.style.display = 'none';
}

window.addEventListener('DOMContentLoaded', () => {
    loadPuzzle(0);
});
</script>
</body>
</html>
