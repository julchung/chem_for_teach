    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;

        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #slide-stage {
            width: 1600px;
            height: 900px;
            transform-origin: center center;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 24px 38px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            background: transparent;
        }
        h1 {
            color: var(--accent-cyan); font-size: 33px; font-weight: 800;
            display: flex; align-items: center; gap: 14px;
            border-bottom: 2.5px solid rgba(34,211,238,0.3); padding-bottom: 9px; flex-shrink: 0;
        }
        h1::before { content: ""; width: 8px; height: 33px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }
        
        .grid-2 {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 26px; flex: 1; min-height: 0;
        }
        .panel {
            background: var(--glass); border: 1.5px solid var(--glass-border); border-radius: 20px;
            padding: 22px 26px; backdrop-filter: blur(14px);
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 0;
            box-shadow: 0 12px 38px rgba(0,0,0,0.42);
        }

        /* 影片面板專屬美化樣式 */
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            justify-content: space-between;
        }
        .video-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1.5px solid rgba(34,211,238,0.25);
            flex-shrink: 0;
        }
        .video-title {
            font-size: 21.5px;
            font-weight: 800;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-tag {
            font-size: 15px;
            font-weight: 700;
            color: #a5f3fc;
            background: rgba(34,211,238,0.18);
            border: 1px solid rgba(34,211,238,0.4);
            padding: 4px 14px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .video-box {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1.5px solid rgba(255,255,255,0.14);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.65);
        }
        .video-box video {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="slide-stage">

        <div class="grid-2">

                <div class="video-container">

        </div>
    </div>
</div>

<script>
function fitStage() {
    const stage = document.getElementById('slide-stage');
    if (!stage) return;
    const baseW = 1600;
    const baseH = 900;
    const paddingX = 20;
    const paddingY = 20;
    const availW = Math.max(window.innerWidth - paddingX, 320);
    const availH = Math.max(window.innerHeight - paddingY, 240);
    const scale = Math.min(availW / baseW, availH / baseH);
    stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
document.addEventListener('fullscreenchange', fitStage);
document.addEventListener('webkitfullscreenchange', fitStage);
window.addEventListener('DOMContentLoaded', fitStage);
fitStage();
</script>
