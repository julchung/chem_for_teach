<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3-1 物質三態 · 性質比較 | 互動教學</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(rgba(56,189,248,0.08) 1.2px, transparent 1.2px);
            background-size: 30px 30px;
        }
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #slides-container {
            position: absolute;
            top: 1.2vh; left: 1.8vw; right: 1.8vw; bottom: 1.2vh;
            display: flex; flex-direction: column;
        }
        h1 {
            color: var(--accent-cyan); font-size: clamp(1.3rem, 2vw, 1.8rem);
            margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.6rem;
            border-bottom: 2px solid rgba(34,211,238,0.25); padding-bottom: 0.3rem; flex-shrink: 0;
        }
        h1::before { content: ""; width: 7px; height: 26px; background: var(--accent-cyan); border-radius: 4px; flex-shrink: 0; }
        .subtitle { font-size: clamp(0.9rem, 1.1vw, 1.05rem); color: rgba(255,255,255,0.65); margin-bottom: 0.6rem; text-align: center; }

        /* 三態比較表 */
        .states-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr;
            gap: 0;
            flex: 1;
            min-height: 0;
            border-radius: 14px;
            overflow: hidden;
            border: 1.5px solid rgba(255,255,255,0.12);
        }
        .cell {
            padding: clamp(0.4rem, 0.8vw, 0.7rem) clamp(0.5rem, 0.9vw, 0.9rem);
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: clamp(0.82rem, 0.95vw, 1.0rem);
            line-height: 1.45;
        }
        .cell:last-child { border-right: none; }
        .row-header {
            background: rgba(30,41,59,0.9);
            font-weight: 700;
            color: #cbd5e1;
            justify-content: flex-start;
        }
        .col-header {
            font-size: clamp(0.95rem, 1.1vw, 1.15rem);
            font-weight: 800;
            padding: clamp(0.5rem, 0.9vw, 0.8rem);
        }
        .col-header.solid { background: rgba(34,211,238,0.18); color: var(--accent-cyan); }
        .col-header.liquid { background: rgba(52,211,153,0.18); color: var(--accent-green); }
        .col-header.gas { background: rgba(248,113,113,0.18); color: var(--accent-red); }
        .col-header.prop { background: rgba(56,189,248,0.12); color: var(--accent-blue); }
        .row-even { background: rgba(255,255,255,0.02); }
        .row-odd { background: rgba(255,255,255,0.045); }
        .cell-solid { color: rgba(34,211,238,0.9); }
        .cell-liquid { color: rgba(52,211,153,0.9); }
        .cell-gas { color: rgba(248,113,113,0.9); }

        @media (max-width: 900px) {
            body, html, #app { overflow: auto; }
            #slides-container { position: relative; height: auto; min-height: 100vh; }
            .states-grid { grid-template-columns: 1fr; overflow-y: auto; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="slides-container">
        <h1>3-1 物質的狀態與三相圖 &middot; 物質三態性質比較</h1>
        <p class="subtitle">固態、液態、氣態在微觀結構與巨觀性質上的系統性對比</p>

        <div class="states-grid">
            <!-- 表頭列 -->
            <div class="cell col-header prop">性質</div>
            <div class="cell col-header solid">固態 (Solid)</div>
            <div class="cell col-header liquid">液態 (Liquid)</div>
            <div class="cell col-header gas">氣態 (Gas)</div>

            <!-- 形狀與體積 -->
            <div class="cell row-header row-even">形狀與體積</div>
            <div class="cell row-even cell-solid">有一定體積和形狀，位置固定</div>
            <div class="cell row-even cell-liquid">有一定體積，無一定形狀</div>
            <div class="cell row-even cell-gas">無一定體積和形狀</div>

            <!-- 分子間作用力 -->
            <div class="cell row-header row-odd">分子間作用力</div>
            <div class="cell row-odd cell-solid">大</div>
            <div class="cell row-odd cell-liquid">中</div>
            <div class="cell row-odd cell-gas">小（可忽略）</div>

            <!-- 分子間距離 -->
            <div class="cell row-header row-even">分子間距離</div>
            <div class="cell row-even cell-solid">緊密靠在一起</div>
            <div class="cell row-even cell-liquid">緊密，但有流動性</div>
            <div class="cell row-even cell-gas">分子可自由運動（距離遠）</div>

            <!-- 密度 -->
            <div class="cell row-header row-odd">密度</div>
            <div class="cell row-odd cell-solid">大（少數例外如冰、銻、生鐵）</div>
            <div class="cell row-odd cell-liquid">通常比固態小</div>
            <div class="cell row-odd cell-gas">最低</div>

            <!-- 可壓縮性 -->
            <div class="cell row-header row-even">可壓縮性</div>
            <div class="cell row-even cell-solid">加壓影響不大</div>
            <div class="cell row-even cell-liquid">加壓影響不大</div>
            <div class="cell row-even cell-gas">加壓可使體積明顯縮小</div>

            <!-- 分子運動 -->
            <div class="cell row-header row-odd">分子運動方式</div>
            <div class="cell row-odd cell-solid">振動與轉動</div>
            <div class="cell row-odd cell-liquid">振動、轉動、移動</div>
            <div class="cell row-odd cell-gas">振動、轉動、移動（高速）</div>

            <!-- 熱膨脹率 -->
            <div class="cell row-header row-even">受熱膨脹率</div>
            <div class="cell row-even cell-solid">最小</div>
            <div class="cell row-even cell-liquid">中等</div>
            <div class="cell row-even cell-gas">最大</div>
        </div>
    </div>
</div>
<script src="../../unified_chem_spa/js/scroll_relay.js"></script>
<script id="__chem_scroll_bridge">
(function () {
    if (window.__chemScrollBridgeInstalled) return;
    window.__chemScrollBridgeInstalled = true;
    function getScrollPos() {
        var sy = window.scrollY || 0, sx = window.scrollX || 0;
        if (document.documentElement) { sy = Math.max(sy, document.documentElement.scrollTop || 0); sx = Math.max(sx, document.documentElement.scrollLeft || 0); }
        if (document.body) { sy = Math.max(sy, document.body.scrollTop || 0); sx = Math.max(sx, document.body.scrollLeft || 0); }
        return { sx: sx, sy: sy };
    }
    function reportScroll() { if (window.parent && window.parent !== window) { var p = getScrollPos(); window.parent.postMessage({ type: '__chem_scroll', sy: p.sy, sx: p.sx }, '*'); } }
    window.addEventListener('scroll', reportScroll, { capture: true, passive: true });
    document.addEventListener('scroll', reportScroll, { capture: true, passive: true });
    window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === '__chem_scroll_by') { var dy = e.data.deltaY || 0; window.scrollBy({ top: dy, behavior: 'instant' }); reportScroll(); }
        else if (e.data.type === '__chem_get_scroll') { reportScroll(); }
    });
    reportScroll();
    window.addEventListener('load', reportScroll);
})();
</script>
</body>
</html>
