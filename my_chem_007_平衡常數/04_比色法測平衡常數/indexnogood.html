<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>比色法測平衡常數 - 互動式實驗教學</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f43f5e;
            --accent-cyan: #22d3ee;
            --blood-red: #991b1b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Outfit', 'Noto Sans TC', sans-serif; overflow: hidden; }

        #app { position: relative; width: 100vw; height: 100vh; display: flex; overflow: hidden; }

        /* --- Start Overlay --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .hero-title { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; background: linear-gradient(135deg, var(--accent-red), var(--accent-yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        .hero-subtitle { color: var(--text-dim); margin-bottom: 2.5rem; font-size: 1.3rem; letter-spacing: 2px; }
        .btn-start { background: linear-gradient(135deg, var(--accent-red), #991b1b); color: white; border: none; padding: 18px 45px; border-radius: 50px; font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(244, 63, 94, 0.2); }
        .btn-start:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4); }

        /* --- Main Layout --- */
        #main-container { 
            width: 100vw; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; padding: 15px; gap: 15px; 
            opacity: 0; transition: opacity 0.8s ease; overflow: hidden;
        }
        #main-container.visible { opacity: 1; }

        /* Left Column: Stacked Areas with Scrolling */
        .left-column { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow-y: auto; padding-right: 10px; }
        
        /* Custom Scrollbar for Left Column */
        .left-column::-webkit-scrollbar { width: 8px; }
        .left-column::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .left-column::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        .left-column::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }

        .workspace-card {
            background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 25px; display: flex; flex-direction: column; gap: 15px;
            position: relative; flex-shrink: 0; min-height: fit-content;
        }
        .area-header { font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; font-size: 1.2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }

        /* ── 1. Serial Dilution Flowchart (staircase, no h-scroll) ── */
        .dilution-stage { width: 100%; flex-shrink: 0; display: flex; flex-direction: column; }

        .serial-flow-container {
            width: 100%;
            overflow: hidden;          /* NO scrollbar at all */
            padding: 16px 10px 10px;
        }

        /* Canvas fills 100% width, height set by JS */
        .stair-canvas {
            position: relative;
            width: 100%;
            /* height injected by JS */
        }

        /* Each stage column: absolute, width = 16% of canvas */
        .stage-column {
            position: absolute;
            width: 16%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Flask node */
        .flask-node {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 8px; width: 100%;
            z-index: 10; transition: transform 0.3s;
        }
        .flask-node:hover { transform: scale(1.05); background: rgba(255,255,255,0.05); }
        .flask-svg-wrap { height: 52px; display: flex; align-items: center; justify-content: center; }

        /* Vertical line from flask to tube – height set inline by JS */
        .v-path {
            width: 2px;
            background: linear-gradient(to bottom, var(--accent-blue), rgba(56,189,248,0.15));
            position: relative;
            flex-shrink: 0;
            z-index: 1;
        }
        .v-path::after {
            content: ''; position: absolute; bottom: 0; left: -4px;
            border-top: 8px solid rgba(56,189,248,0.5);
            border-left: 5px solid transparent; border-right: 5px solid transparent;
        }

        /* Tube group – same for all stages */
        .tube-bottom-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }

        /* Horizontal branch arrow – position set inline by JS */
        .h-stair-link {
            position: absolute;
            height: 2px;
            background: var(--accent-blue);
            opacity: 0.85;
            z-index: 5;
        }
        .h-stair-link::after {
            content: ''; position: absolute; right: -7px; top: -4px;
            border-left: 9px solid var(--accent-blue);
            border-top: 5px solid transparent; border-bottom: 5px solid transparent;
        }

        /* Label box sitting above each horizontal arrow */
        .stair-input-box {
            position: absolute;
            bottom: 6px;            /* sits just above the arrow line */
            left: 50%; transform: translateX(-50%);
            background: var(--bg-dark); border: 1px solid var(--accent-blue);
            border-radius: 6px; padding: 3px 5px;
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            z-index: 20; white-space: nowrap;
            box-shadow: 0 3px 12px rgba(0,0,0,0.6);
        }
        .stair-label { font-size: 0.48rem; color: var(--text-dim); white-space: nowrap; }
        .stair-input { width: 36px; border: none; background: transparent; color: var(--accent-yellow); font-weight: 700; text-align: center; font-size: 0.72rem; outline: none; }

        /* 2. Colorimetry Area */
        .color-stage { width: 100%; display: flex; flex-direction: column; }
        
        .top-view-box {
            position: absolute; top: 75px; right: 25px; width: 160px; height: 90px;
            background: rgba(0,0,0,0.5); border-radius: 15px; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 10px; z-index: 100;
        }
        .view-circles { display: flex; gap: 20px; }
        .circle { width: 45px; height: 45px; border-radius: 50%; border: 2.5px solid white; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); transition: background 0.3s; }

        /* Experimental Stand */
        .stand-area { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; gap: 60px; position: relative; }
        .base-slot { width: 60px; height: 20px; background: #334155; border-radius: 5px; position: relative; border-bottom: 4px solid #1e293b; }
        .base-slot::after { content: attr(data-label); position: absolute; bottom: -25px; left: 0; width: 100%; text-align: center; font-size: 0.75rem; color: var(--text-dim); }
        .slot-indicator { position: absolute; top: -140px; left: 0; width: 100%; height: 140px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: rgba(255,255,255,0.1); }

        /* Tube Rack */
        .rack-area { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 15px; border: 1px solid var(--glass-border); }
        
        /* Draggable Tube */
        .tube { width: 35px; height: 140px; border: 2px solid rgba(255,255,255,0.3); border-radius: 0 0 18px 18px; position: relative; overflow: hidden; background: rgba(255,255,255,0.02); cursor: grab; transition: transform 0.2s; }
        .tube:active { cursor: grabbing; transform: scale(1.05); }
        .liquid { position: absolute; bottom: 0; left: 0; width: 100%; transition: height 0.5s, background 0.8s; }
        .liq-std { background: var(--blood-red); }
        .tube-label-tag { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.5); z-index: 10; }

        /* Standard Height Pull-tab */
        .pull-tab-container { position: absolute; left: -50px; top: -150px; height: 150px; width: 40px; display: none; flex-direction: column; align-items: center; gap: 10px; }
        .pull-tab-container.active { display: flex; }
        .tab-slider { height: 100px; width: 6px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 3px; orientation: vertical; -webkit-appearance: slider-vertical; }
        .tab-slider::-webkit-slider-thumb { appearance: none; width: 24px; height: 14px; background: var(--accent-blue); border-radius: 4px; cursor: pointer; border: 1px solid white; }

        /* Right Column: Data & Recording */
        .right-column { display: flex; flex-direction: column; gap: 15px; height: 100%; overflow: hidden; }
        .data-card { 
            background: var(--bg-panel); border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border); 
            flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden;
        }
        .record-btn-container { display: flex; justify-content: center; padding: 10px 0; }
        .btn-record { 
            background: linear-gradient(135deg, var(--accent-green), #059669); color: #000; border: none; padding: 12px 40px; border-radius: 50px; 
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(52, 211, 153, 0.3);
        }
        .btn-record:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(52, 211, 153, 0.5); }
        .btn-record:active { transform: translateY(0); }

        .table-wrap { flex: 1; overflow: auto; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: center; }
        th { background: rgba(255,255,255,0.05); color: var(--accent-blue); padding: 10px; border: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 20; }
        td { padding: 8px; border: 1px solid var(--glass-border); }
        .val-result { color: var(--accent-yellow); font-weight: 700; }
        
        .avg-display { background: rgba(52, 211, 153, 0.1); border: 1px solid var(--accent-green); border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .avg-label { font-size: 0.9rem; color: var(--accent-green); font-weight: 600; }
        .avg-value { font-size: 1.8rem; font-weight: 700; color: var(--accent-green); }

        /* Toolbar */
        #toolbar { position: fixed; left: 20px; bottom: 20px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 15px; display: flex; align-items: center; gap: 12px; z-index: 2500; border: 1px solid var(--glass-border); }
        .tool-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .tool-btn.active { background: var(--accent-blue); color: #000; }
        .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: white; transform: scale(1.2); }
        #drawing-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2000; }
        #drawing-layer.active { pointer-events: auto; }

        /* Drag Visual */
        .dragging { opacity: 0.5; transform: scale(0.9); }
        .drop-over { background: rgba(56, 189, 248, 0.1) !important; border: 2px solid var(--accent-blue) !important; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Start Overlay -->
        <div id="start-overlay">
            <h1 class="hero-title">比色法測定平衡常數</h1>
            <p class="hero-subtitle">互動實驗操作與數據分析系統</p>
            <button class="btn-start" onclick="initApp()">▶ 啟動實驗室</button>
        </div>

        <!-- Main Container -->
        <div id="main-container">
            
            <!-- Left Column -->
            <div class="left-column">
                <!-- Top: Fe3+ Serial Dilution Flowchart -->
                <div class="workspace-card dilution-stage">
                    <div class="area-header"><span>⚗️</span> 重點一：Fe³⁺ 序列稀釋流程與互動配製</div>
                    <div class="serial-flow-container" id="serial-flow">
                        <!-- stair-canvas height + all columns built by buildFlowUI() -->
                        <div class="stair-canvas" id="stair-canvas"></div>
                    </div>
                </div>

                <!-- Bottom: Colorimetry Stand -->
                <div class="workspace-card color-stage">
                    <div class="area-header"><span>🔭</span> 重點二：拖曳式比色操作與肉眼比對</div>
                    
                    <!-- Top View -->
                    <div class="top-view-box">
                        <div class="view-circles">
                            <div style="text-align: center;"><div id="vs" class="circle"></div><div style="font-size: 0.6rem; margin-top: 3px;">標準管 #1</div></div>
                            <div style="text-align: center;"><div id="vt" class="circle"></div><div id="vt-name" style="font-size: 0.6rem; margin-top: 3px;">待測管</div></div>
                        </div>
                    </div>

                    <!-- Comparison Stand -->
                    <div class="stand-area" id="stand">
                        <!-- Left Slot (Standard) -->
                        <div class="base-slot" id="slot-std" data-label="標準管槽位">
                            <div class="slot-indicator">#1 置入區</div>
                            <div class="pull-tab-container" id="h-ctrl">
                                <div style="font-size: 0.7rem; color: var(--accent-blue); font-weight: 700;"><span id="h1-txt">5.0</span>cm</div>
                                <input type="range" class="tab-slider" id="h1-sld" min="10" max="100" value="50" oninput="changeH1(this.value)">
                                <div style="font-size: 0.6rem; color: var(--text-dim);">高度拉條</div>
                            </div>
                        </div>
                        <!-- Right Slot (Test) -->
                        <div class="base-slot" id="slot-test" data-label="待測管槽位">
                            <div class="slot-indicator">#2-5 拖入區</div>
                        </div>
                    </div>

                    <!-- Tube Rack -->
                    <div class="rack-area" id="rack">
                        <!-- Tubes 1-5 will be here -->
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                <div class="data-card">
                    <div class="area-header"><span>📊</span> 重點三：數據記錄與平衡常數計算</div>
                    
                    <div class="record-btn-container">
                        <button class="btn-record" onclick="recordData()">📥 記錄目前數值</button>
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th rowspan="2">管別</th>
                                    <th colspan="2">配製體積 (mL)</th>
                                    <th colspan="2">初始濃度 (10⁻⁴M)</th>
                                    <th colspan="2">液柱高度 (cm)</th>
                                    <th rowspan="2">[FeSCN²⁺]<sub>eq</sub><br>(10⁻⁴M)</th>
                                    <th rowspan="2">K<sub>c</sub></th>
                                </tr>
                                <tr>
                                    <th>Fe³⁺</th><th>SCN⁻</th>
                                    <th>[Fe³⁺]₀</th><th>[SCN⁻]₀</th>
                                    <th>h<sub>std</sub></th><th>h<sub>test</sub></th>
                                </tr>
                            </thead>
                            <tbody id="tbl-body">
                                <!-- Data rows -->
                            </tbody>
                        </table>
                    </div>

                    <div class="avg-display">
                        <span class="avg-label">平衡常數平均值 (K<sub>avg</sub>)</span>
                        <span class="avg-value" id="avg-val">---</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Toolbar -->
        <div id="toolbar">
            <div id="toolbar-handle" style="cursor: grab; color: rgba(255,255,255,0.3); padding-right: 5px;">⋮</div>
            <button class="tool-btn" onclick="toggleDrawing()">✎</button>
            <button class="tool-btn" onclick="toggleFS()">⛶</button>
            <div id="draw-tools" style="display: none; flex-direction: row; gap: 8px; border-left: 1px solid var(--glass-border); padding-left: 10px;">
                <div class="color-dot active" style="background: #f8fafc" onclick="setPenColor('#f8fafc', this)"></div>
                <div class="color-dot" style="background: #f43f5e" onclick="setPenColor('#f43f5e', this)"></div>
                <div class="color-dot" style="background: #38bdf8" onclick="setPenColor('#38bdf8', this)"></div>
                <button class="tool-btn" onclick="clearCanvas()">🗑</button>
            </div>
            <div style="width: 1px; height: 25px; background: var(--glass-border);"></div>
            <button class="tool-btn" onclick="window.history.back()">⬅</button>
        </div>
        <canvas id="drawing-layer"></canvas>
    </div>

    <script>
        // --- State Management ---
        const state = {
            h1: 5.0, // Standard height in cm
            h2: 5.0, // Test tube height in cm (Fixed)
            activeSlotTest: null, // Tube ID in test slot
            activeSlotStd: null,  // Tube ID in std slot
            tubes: {
                1: { fv: 5.0, sv: 2.0, f0: 400.0, s0: 1.60, ceq: 1.60, kc: null, h1: null, h2: 5.0, recorded: true },
                2: { fv: 5.0, sv: 1.0, f0: 4.00, s0: 0.80, ceq: null, kc: null, h1: null, h2: 5.0, recorded: false },
                3: { fv: 5.0, sv: 2.0, f0: 4.00, s0: 1.60, ceq: null, kc: null, h1: null, h2: 5.0, recorded: false },
                4: { fv: 5.0, sv: 3.0, f0: 4.00, s0: 2.40, ceq: null, kc: null, h1: null, h2: 5.0, recorded: false },
                5: { fv: 5.0, sv: 4.0, f0: 4.00, s0: 3.20, ceq: null, kc: null, h1: null, h2: 5.0, recorded: false }
            }
        };

        // --- Init ---
        function initApp() {
            toggleFS();
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('main-container').classList.add('visible');
            buildFlowUI();
            buildRack();
            buildTable();
            initDragAndDrop();
            initCanvas();
            initToolbar();
            calcSerial();
        }

        function buildFlowUI() {
            const canvas = document.getElementById('stair-canvas');
            if (!canvas) return;
            canvas.innerHTML = '';

            // ── Layout constants ──────────────────────────────────────────
            // Each flask drops STEP_Y px below the previous (= FLASK_H so no overlap).
            // All tube groups pin to the same bottom row.
            // Horizontal arrow fires from the v-path of col i at the exact vertical
            // midpoint of the NEXT flask, and spans to the center of that flask column.
            const N        = 5;
            const FLASK_H  = 90;           // px – height of .flask-node
            const TUBE_GRP = 90;           // px – height of .tube-bottom-group
            const STEP_Y   = FLASK_H;      // drop per stage = 1 full flask height (no overlap)
            const VPATH_MIN= 45;           // min v-path below last flask
            const COL_W    = 15;           // % column width
            const COL_GAP  = 5;            // % gap between columns
            const CANVAS_H = (N-1)*STEP_Y + FLASK_H + VPATH_MIN + TUBE_GRP;
            // = 4×90 + 90 + 45 + 90 = 585 px

            canvas.style.height = CANVAS_H + 'px';

            const FLASK_SVG = `<svg viewBox="0 0 40 60" width="26" height="40">
              <path d="M18,5 L22,5 L22,28 Q22,33 25,36 Q35,40 35,50 Q35,58 20,58 Q5,58 5,50 Q5,40 15,36 Q18,33 18,28 Z"
                fill="rgba(34,211,238,0.18)" stroke="var(--accent-cyan)" stroke-width="1.5"/>
            </svg>`;

            const TUBE_HTML = (i) => `
                <button class="btn-add-set" onclick="addToSet(${i})">加入</button>
                <div class="tube-mini"><div class="liq-mix" id="m-liq-${i}"></div></div>
                <div class="stair-label">#${i} SCN⁻ 5mL</div>`;

            for (let i = 1; i <= N; i++) {
                const idx     = i - 1;
                const colTop  = idx * STEP_Y;                    // px: top of this flask
                const colLeft = idx * (COL_W + COL_GAP);         // %: left of this column
                const tubeTop = CANVAS_H - TUBE_GRP;             // px: aligned tube row
                const vpathH  = tubeTop - colTop - FLASK_H;      // px: v-path height

                // ── Stage column ──────────────────────────────────────────
                const col = document.createElement('div');
                col.className = 'stage-column';
                col.id = `stage-col-${i}`;
                col.style.cssText = `top:${colTop}px; left:${colLeft}%;`;

                const flaskLabel = (i === 1)
                    ? `<div class="stair-label">[Fe³⁺]₁</div>
                       <input type="number" class="stair-input" id="fe-m1" value="0.2" step="0.01" onchange="calcSerial()">
                       <div class="stair-label">M</div>`
                    : `<div class="stair-label">[Fe³⁺]<sub>${i}</sub></div>
                       <div id="m-val-${i}" style="font-size:0.7rem;color:var(--accent-yellow);font-weight:700;">-</div>
                       <div class="stair-label">M</div>`;

                col.innerHTML = `
                    <div class="flask-node">
                        <div class="flask-svg-wrap">${FLASK_SVG}</div>
                        ${flaskLabel}
                    </div>
                    <div class="v-path" style="height:${vpathH}px;"></div>
                    <div class="tube-bottom-group">${TUBE_HTML(i)}</div>`;

                canvas.appendChild(col);

                // ── Horizontal branch arrow: col i → col i+1 ─────────────
                if (i < N) {
                    // Arrow Y = vertical MIDPOINT of the NEXT flask (in canvas coords)
                    const nextFlaskTop = i * STEP_Y;          // col i+1 top (0-indexed: i)
                    const arrowY = nextFlaskTop + FLASK_H / 2; // mid of next flask

                    // Arrow runs from CENTER of current v-path to CENTER of next flask column
                    // Center of col i  = colLeft + COL_W/2
                    // Center of col i+1 = (i)*(COL_W+COL_GAP) + COL_W/2
                    const arrowLeft  = colLeft + COL_W / 2;               // % start (at v-path)
                    const arrowRight = i * (COL_W + COL_GAP) + COL_W / 2; // % end  (at next flask center)
                    const arrowWidth = arrowRight - arrowLeft;             // always = COL_W+COL_GAP = 20%

                    const arrow = document.createElement('div');
                    arrow.className = 'h-stair-link';
                    arrow.style.cssText =
                        `left:${arrowLeft}%; width:${arrowWidth}%;` +
                        `top:${arrowY}px; overflow:visible;`;
                    arrow.innerHTML = `
                        <div class="stair-input-box">
                            <div class="stair-label">取 (mL)</div>
                            <input type="number" class="stair-input" id="v-trans-${i+1}" value="10" step="0.1" onchange="calcSerial()">
                            <div class="stair-label">加水至 25mL</div>
                        </div>`;
                    canvas.appendChild(arrow);
                }
            }
        }

        function calcSerial() {
            const fe_m1_el = document.getElementById('fe-m1');
            if (!fe_m1_el) return;
            const m1 = parseFloat(fe_m1_el.value) || 0.2;
            const ms = [m1];
            
            for(let i=2; i<=5; i++) {
                const v_el = document.getElementById(`v-trans-${i}`);
                const v = v_el ? parseFloat(v_el.value) : 10;
                const mNext = ms[i-2] * (v / 25);
                ms.push(mNext);
                const m_val_el = document.getElementById(`m-val-${i}`);
                if (m_val_el) m_val_el.textContent = mNext.toFixed(4);
            }

            for(let i=1; i<=5; i++) {
                const flaskM = ms[i-1];
                state.tubes[i].f0 = (flaskM * 0.5) * 10000;
                state.tubes[i].s0 = (0.002 * 0.5) * 10000;
            }
            updateTubeLiquids();
            buildTable();
        }

        function addToSet(id) {
            const t = state.tubes[id];
            t.added = true;
            
            const tr = document.getElementById(`row-${id}`);
            if (tr) {
                tr.classList.add('sync-pulse');
                setTimeout(() => tr.classList.remove('sync-pulse'), 500);
            }
            // No alert to keep fullscreen
            buildTable();
        }

        function buildRack() {
            const rack = document.getElementById('rack');
            if (!rack) return;
            rack.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const tube = document.createElement('div');
                tube.className = 'tube';
                tube.id = `tube-${i}`;
                tube.draggable = true;
                tube.dataset.id = i;
                tube.innerHTML = `<div class="tube-label-tag">#${i}</div><div class="liquid" id="liq-${i}"></div>`;
                rack.appendChild(tube);
            }
            updateTubeLiquids();
        }

        function buildTable() {
            const body = document.getElementById('tbl-body');
            if (!body) return;
            body.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const t = state.tubes[i];
                const tr = document.createElement('tr');
                tr.id = `row-${i}`;
                tr.innerHTML = `
                    <td>${i===1 ? '標' : '管'} ${i}</td>
                    <td>5.0</td>
                    <td>5.0</td>
                    <td class="val-result">${t.f0.toFixed(2)}</td>
                    <td class="val-result">${t.s0.toFixed(2)}</td>
                    <td id="h1-cell-${i}">${t.h1 ? t.h1.toFixed(1) : '-'}</td>
                    <td>${i===1 ? '-' : '5.0'}</td>
                    <td id="ceq-cell-${i}" class="val-result">${t.ceq ? t.ceq.toFixed(2) : '-'}</td>
                    <td id="kc-cell-${i}" class="val-result">${t.kc ? Math.round(t.kc) : '-'}</td>
                `;
                body.appendChild(tr);
            }
        }

        // --- Drag & Drop ---
        function initDragAndDrop() {
            const tubes = document.querySelectorAll('.tube');
            const slots = document.querySelectorAll('.base-slot');

            tubes.forEach(t => {
                t.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('tubeId', t.dataset.id);
                    t.classList.add('dragging');
                });
                t.addEventListener('dragend', () => t.classList.remove('dragging'));
            });

            slots.forEach(s => {
                s.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    s.classList.add('drop-over');
                });
                s.addEventListener('dragleave', () => s.classList.remove('drop-over'));
                s.addEventListener('drop', (e) => {
                    e.preventDefault();
                    s.classList.remove('drop-over');
                    const tubeId = e.dataTransfer.getData('tubeId');
                    handleDrop(tubeId, s.id);
                });
            });
        }

        function handleDrop(tubeId, slotId) {
            const tube = document.getElementById(`tube-${tubeId}`);
            const slot = document.getElementById(slotId);
            const id = parseInt(tubeId);

            if (slotId === 'slot-std' && id !== 1) {
                alert('此槽位僅能放置 #1 標準管！');
                return;
            }
            if (slotId === 'slot-test' && id === 1) {
                alert('此槽位僅能放置 #2-5 待測管！');
                return;
            }

            // Move tube to slot
            slot.appendChild(tube);
            tube.style.position = 'absolute';
            tube.style.top = '-140px';
            tube.style.left = '12px';

            if (id === 1) {
                state.activeSlotStd = 1;
                document.getElementById('h-ctrl').classList.add('active');
            } else {
                state.activeSlotTest = id;
                document.getElementById('vt-name').textContent = `管 ${id}`;
            }
            updateVisuals();
        }

        // --- Core Interactions ---
        function changeH1(val) {
            state.h1 = val / 10;
            document.getElementById('h1-txt').textContent = state.h1.toFixed(1);
            if (state.activeSlotStd) {
                document.getElementById('tube-1').style.height = (140 * (val/100)) + 'px';
            }
            updateVisuals();
        }

        function updateVisuals() {
            const vs = document.getElementById('vs');
            const vt = document.getElementById('vt');
            
            // Standard Intensity
            const intensityStd = 1.6 * state.h1;
            vs.style.backgroundColor = `rgba(153, 27, 27, ${Math.min(1, intensityStd / 16)})`;

            // Test Intensity
            if (state.activeSlotTest) {
                const ceq = solveTheoretical(state.activeSlotTest);
                const intensityTest = ceq * state.h2;
                vt.style.backgroundColor = `rgba(153, 27, 27, ${Math.min(1, intensityTest / 16)})`;
            } else {
                vt.style.backgroundColor = 'transparent';
            }
        }

        function solveTheoretical(id) {
            const t = state.tubes[id];
            const Kc = 180; const k = Kc * 1e-4;
            const f0 = t.fv * 0.8, s0 = t.sv * 0.8;
            const a = k, b = -(k*(f0+s0)+1), c = k*f0*s0;
            return (-b - Math.sqrt(b*b - 4*a*c)) / (2*a);
        }

        function recordData() {
            const tid = state.activeSlotTest;
            if (!tid) { alert('請先放置待測管！'); return; }
            
            const tube = state.tubes[tid];
            tube.h1 = state.h1;
            tube.recorded = true;

            const ceq = (1.6 * state.h1) / state.h2;
            tube.ceq = ceq;
            
            const feE = (tube.fv * 0.8) - ceq;
            const scnE = (tube.sv * 0.8) - ceq;
            if (feE > 0 && scnE > 0) {
                tube.kc = (ceq * 1e-4) / ((feE * 1e-4) * (scnE * 1e-4));
            }

            // Update UI
            document.getElementById(`h1-cell-${tid}`).textContent = state.h1.toFixed(1);
            document.getElementById(`ceq-cell-${tid}`).textContent = ceq.toFixed(2);
            document.getElementById(`kc-cell-${tid}`).textContent = tube.kc ? Math.round(tube.kc) : 'ERR';
            
            updateAvg();
        }

        function updateAvg() {
            const kcs = Object.values(state.tubes).map(t => t.kc).filter(k => k !== null);
            if (kcs.length > 0) {
                const avg = kcs.reduce((a,b) => a+b, 0) / kcs.length;
                document.getElementById('avg-val').textContent = Math.round(avg);
            }
        }

        function updateDilution() {
            const feV = parseFloat(document.getElementById('in-fe').value) || 0;
            const scnV = parseFloat(document.getElementById('in-scn').value) || 0;
            
            state.tubes[1].fv = feV;
            state.tubes[1].sv = scnV;
            
            // SCN- calc for display: (scnV * 0.002) / 25 * 1e4 = scnV * 0.8
            const scn0 = scnV * 0.8;
            document.getElementById('calc-res').textContent = `[SCN⁻]₀: ${scn0.toFixed(2)}`;

            // Apply to all tubes (for demo link or specific logic)
            for(let i=2; i<=5; i++) {
                state.tubes[i].fv = feV;
                state.tubes[i].sv = (i-1) * 1.0; 
            }
            buildTable();
            updateTubeLiquids();
            updateVisuals();
        }

        function updateTubeLiquids() {
            for(let i=1; i<=5; i++) {
                const ceq = (i===1) ? 1.6 : solveTheoretical(i);
                const op = Math.min(1, ceq / 1.6);
                const liq = document.getElementById(`liq-${i}`);
                if (liq) {
                    liq.style.height = '80%';
                    liq.style.backgroundColor = `rgba(153, 27, 27, ${op})`;
                }
            }
        }


        // --- Toolbar, Canvas, Fullscreen ---
        function toggleFS() {
            const e = document.documentElement;
            if (!document.fullscreenElement) {
                if (e.requestFullscreen) e.requestFullscreen();
                else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        let dCtx, isDM = false, isD = false, pC = '#f8fafc', lx, ly;
        function initCanvas() {
            const c = document.getElementById('drawing-layer');
            dCtx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            dCtx.lineCap = 'round'; dCtx.lineWidth = 3;
            const gp = (e) => [ (e.clientX || e.touches[0].clientX), (e.clientY || e.touches[0].clientY) ];
            c.onmousedown = (e) => { if(!isDM) return; isD = true; [lx, ly] = gp(e); };
            c.onmousemove = (e) => { if(!isD) return; const [cx, cy] = gp(e); dCtx.beginPath(); dCtx.strokeStyle = pC; dCtx.moveTo(lx, ly); dCtx.lineTo(cx, cy); dCtx.stroke(); [lx, ly] = [cx, cy]; };
            window.onmouseup = () => isD = false;
        }
        function toggleDrawing() { isDM = !isDM; document.getElementById('drawing-layer').classList.toggle('active'); }
        function setPenColor(c, el) { pC = c; document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active')); el.classList.add('active'); }
        function clearCanvas() { dCtx.clearRect(0,0,window.innerWidth, window.innerHeight); }
        function initToolbar() {
            const t = document.getElementById('toolbar'), h = document.getElementById('toolbar-handle');
            let dr = false, ox, oy;
            h.onmousedown = (e) => { dr = true; ox = e.clientX - t.offsetLeft; oy = e.clientY - t.offsetTop; };
            document.onmousemove = (e) => { if(dr) { t.style.left = (e.clientX - ox) + 'px'; t.style.top = (e.clientY - oy) + 'px'; t.style.bottom = 'auto'; } };
            document.onmouseup = () => dr = false;
        }

    </script>
</body>
