<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>高中化學全螢幕學習網 · 一頁到底互動教學系統</title>

  <!-- MathJax 化學式與數學公式渲染器 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- 全站統一樣式表 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═════════════════════════════════════════════════════════════
       1. 登入視窗層 (Login Portal)
       ═════════════════════════════════════════════════════════════ -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-logo">⚗️</div>
      <h1>高中化學學習系統</h1>
      <p class="login-subtitle">沉浸式全螢幕 · 循序解鎖與互動闖關</p>

      <div class="login-error" id="login-error-msg"></div>

      <form id="login-form">
        <div class="login-form-group">
          <label for="login-username">學號 / 使用者名稱</label>
          <div class="input-with-icon">
            <input type="text" id="login-username" placeholder="請輸入帳號 (例如: 10101 或 teacher)" required autocomplete="username">
          </div>
        </div>

        <div class="login-form-group">
          <label for="login-password">登入密碼</label>
          <div class="input-with-icon">
            <input type="password" id="login-password" placeholder="請輸入密碼 (預設: 123 或 888)" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="login-btn-primary" id="btn-login-submit">
          <span>🚀 登入並進入全螢幕學習</span>
        </button>
      </form>

      <div class="login-quick-demo">
        <span>快捷快速體驗帳號（點擊即代入）：</span>
        <div class="quick-tags">
          <button type="button" class="quick-account-tag" data-user="student" data-pwd="123">學生體驗 (student/123)</button>
          <button type="button" class="quick-account-tag" data-user="teacher" data-pwd="888">教師解鎖 (teacher/888)</button>
          <button type="button" class="quick-account-tag" data-user="10101" data-pwd="123">學號 10101</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════
       2. 主工作台介面 (Main Learning Workspace)
       ═════════════════════════════════════════════════════════════ -->
  <div id="main-workspace" style="display: none;">

    <!-- 2-1. 頂部導航列 -->
    <header class="top-navbar">
      <div class="nav-left">
        <button class="btn-sidebar-toggle" id="btn-toggle-sidebar" title="開啟章節目錄 (快捷切換)">
          ☰
        </button>
        <div class="site-brand">
          <span style="font-size: 1.4rem;">🧪</span>
          <span>高中化學學習網</span>
        </div>
      </div>

      <div class="nav-right">
        <div class="user-status-pill" id="sidebar-user-name">化學學生</div>
        <button class="btn-nav-action" id="btn-export-progress" title="備份進度碼">備份進度</button>
        <button class="btn-nav-action" id="btn-import-progress" title="匯入進度碼">匯入進度</button>
        <button class="btn-nav-action" id="btn-logout" title="儲存並登出">登出</button>
      </div>
    </header>

    <!-- 2-2. 自動隱藏目錄側邊欄 (TOC Drawer) -->
    <aside id="sidebar-drawer">
      <div class="sidebar-header">
        <h2>📚 課程進度目錄</h2>
        <button class="btn-close-sidebar" id="btn-close-sidebar">✕</button>
      </div>

      <div class="sidebar-progress-box">
        <div class="progress-header">
          <span>課程總體進度</span>
          <span id="overall-progress-label">0% (0/0)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="overall-progress-bar"></div>
        </div>
      </div>

      <div class="sidebar-scroll-area" id="toc-chapter-list">
        <!-- 由 app.js 動態渲染目錄章節與小節解鎖狀態 -->
      </div>

      <div class="sidebar-footer">
        <p style="font-size: 0.75rem; color: var(--text-dim); text-align: center; width: 100%;">
          💡 綠勾代表已通關，可隨時點選跳轉複習！
        </p>
      </div>
    </aside>
    <div id="sidebar-backdrop"></div>

    <!-- 2-3. 一頁到底全螢幕課程串流 (Main Curriculum Stream) -->
    <main id="curriculum-stream">
      <!-- 由 app.js 依據 chem_data.js 依序渲染所有章節與小節 -->
    </main>

    <!-- 2-4. 手寫透明全域畫布 -->
    <canvas id="drawing-layer"></canvas>

    <!-- 2-5. 懸浮工具列 (Whiteboard & Random Picker) -->
    <div id="floating-toolbar">
      <div class="toolbar-drag-handle" id="drag-handle-bar" title="拖曳移動工具列">≡</div>

      <!-- 手寫筆按鈕 -->
      <button class="btn-tool" id="btn-draw-toggle" title="手寫筆記模式">✎</button>

      <!-- 色盤群組 (開啟手寫時展開) -->
      <div class="color-palette-group" id="color-picker-group">
        <div class="color-dot selected" style="background: #38bdf8;" data-color="#38bdf8" title="天藍色"></div>
        <div class="color-dot" style="background: #fbbf24;" data-color="#fbbf24" title="明黃色"></div>
        <div class="color-dot" style="background: #10b981;" data-color="#10b981" title="翠綠色"></div>
        <div class="color-dot" style="background: #f43f5e;" data-color="#f43f5e" title="艷紅色"></div>
        <div class="color-dot" style="background: #f8fafc;" data-color="#f8fafc" title="純白色"></div>
      </div>

      <!-- 粗細調整 -->
      <div class="size-slider-group" id="size-picker-group">
        <input type="range" id="pen-size-slider" min="1" max="18" value="3" title="筆刷粗細">
      </div>

      <!-- 橡皮擦、復原與全清 -->
      <div id="eraser-group" style="display: none; flex-direction: column; gap: 6px; width: 100%; align-items: center;">
        <button class="btn-tool" id="btn-eraser-tool" title="橡皮擦">🧹</button>
        <button class="btn-tool" id="btn-undo-tool" title="復原上一筆筆跡">↩️</button>
        <button class="btn-tool" id="btn-clear-canvas" title="全清畫布">🗑️</button>
      </div>

      <div class="tool-divider"></div>

      <!-- 隨機抽號按鈕 -->
      <button class="btn-tool" id="btn-open-draw" title="課堂隨機抽號 (🎲 抽號工具)">🎲</button>
    </div>

    <!-- 2-6. 獨立原創互動教材/實驗彈出視窗 (Interactive Lab Modal) -->
    <div id="lab-modal">
      <div class="lab-modal-container">
        <div class="lab-modal-header">
          <div class="lab-modal-title">
            <span style="font-size: 1.3rem;">🧪</span>
            <span id="lab-modal-caption">互動實驗室</span>
          </div>
          <div style="display: flex; gap: 10px; align-items: center;">
            <a id="lab-modal-external-link" href="#" target="_blank" class="btn-nav-action" style="font-size: 0.85rem; text-decoration: none; padding: 6px 14px;">在新分頁開啟 ↗</a>
            <button class="btn-close-sidebar" id="btn-close-lab">✕</button>
          </div>
        </div>
        <div class="lab-modal-body">
          <iframe id="lab-modal-iframe" src="" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- 2-7. 隨機抽號彈出視窗 -->
    <div id="random-draw-modal">
      <div class="draw-modal-card">
        <div class="draw-header">
          <h3>🎲 課堂互動隨機抽號</h3>
          <button class="btn-close-sidebar" id="btn-close-draw">✕</button>
        </div>

        <div class="draw-winner-display" id="draw-winner-banner">
          點擊「開始抽號」進行隨機選號
        </div>

        <div class="draw-balls-grid" id="draw-balls-container">
          <!-- 動態生成 1~N 號球 -->
        </div>

        <div class="draw-actions">
          <div class="draw-input-box">
            <span>總人數：</span>
            <input type="number" id="draw-total-input" value="40" min="1" max="100">
          </div>
          <button class="btn-primary" id="btn-do-draw" style="padding: 10px 24px;">🎲 開始抽號</button>
          <button class="btn-nav-action" id="btn-reset-draw" style="padding: 10px 16px;">重新洗牌</button>
        </div>
      </div>
    </div>

    <!-- 2-7. 通關解鎖慶祝視窗 -->
    <div id="unlock-modal">
      <div class="draw-modal-card" style="max-width: 480px; text-align: center;">
        <div id="unlock-modal-msg"></div>
        <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center;">
          <button class="btn-primary" id="btn-unlock-next" style="padding: 12px 28px; font-size: 1.05rem;">
            立即前往新章節 ➔
          </button>
          <button class="btn-nav-action" id="btn-close-unlock-modal">留在當前</button>
        </div>
      </div>
    </div>

    <!-- 2-8. 全域浮動 Toast 提示 -->
    <div class="toast-box" id="toast-notification"></div>

  </div>

  <!-- ═════════════════════════════════════════════════════════════
       3. 核心邏輯腳本載入
       ═════════════════════════════════════════════════════════════ -->
  <script src="js/users.js"></script>
  <script src="js/chem_data.js"></script>
  <script src="js/whiteboard.js"></script>
  <script src="js/random_picker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
